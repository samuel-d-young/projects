# =============================================================================
# test-clock-s3-round.yaml
# ESP32-S3-N16R8 + 24-LED WS2812B ring + 360x360 round ST77916 display
# =============================================================================
# WHY THIS BOARD AND NOT THE D1 MINI
#
# A 360x360 RGB565 framebuffer is 360 x 360 x 2 = 259,200 bytes = 253 KB.
#
#   D1 mini / NodeMCU (ESP8266)   ~30 KB free heap   short by 223 KB
#   ESP32, no PSRAM              ~160 KB free heap   short by  93 KB
#   ESP32-S3-N16R8, 8 MB PSRAM      8192 KB          fits, with room to spare
#
# This is not a tuning problem. ESPHome's own ST77916 model declares
# `requires={"psram"}` in esphome/components/mipi_spi/models/st77916.py, so a
# config without PSRAM is REFUSED at validation — it will not even compile.
# The N16R8's 8 MB of octal PSRAM is exactly what this needs.
#
# The LED ring moves to esp32_rmt_led_strip here (ESP32 native). The clock face
# render is identical to the D1 mini config — it reads its size from the strip.
#
# !! PINS ARE THE THING TO CHECK !!
# The GPIOs below are the ESP-VoCat v1.2 values that ESPHome's own model file
# documents, because that is the board its init sequence came from. YOUR panel
# is almost certainly wired differently. Get your module's pinout and correct
# the substitutions before flashing. Wrong pins here waste an evening.
#
# NOT COMPILED OR FLASHED. Run `esphome config test-clock-s3-round.yaml` first.
# =============================================================================

substitutions:
  device_name: round-clock
  friendly_name: Round Clock

  num_leds: "24"
  led_pin: GPIO5              # any free GPIO; keep clear of the QSPI pins below
  twelve_oclock_offset: "0"
  night_start_hour: "22"
  night_end_hour: "7"

  # ---- DISPLAY PINS — correct these against your panel ----------------------
  lcd_clk: GPIO18
  lcd_d0: GPIO46
  lcd_d1: GPIO13
  lcd_d2: GPIO11
  lcd_d3: GPIO12
  lcd_cs: GPIO14
  lcd_reset: GPIO47           # active HIGH on this panel — see inverted: below
  lcd_backlight: GPIO44

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 600
      then:
        - light.turn_on:
            id: ring
            brightness: 100%
            effect: "Face"
        - light.turn_on:
            id: backlight
            brightness: 80%
        - logger.log: "Boot: ring + display up"

esp32:
  variant: esp32s3
  # If ESPHome does not pick up all 16MB of flash, set an explicit board: here.
  # Not set by default because the correct board id depends on your module and
  # a wrong one is worse than the auto-selected default. (unverified)

# 8 MB octal PSRAM on the N16R8. `mode: octal` is what the R8 suffix means —
# a quad-PSRAM part (R2/R8Q) would need `mode: quad` and will fail to init here.
psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret wall_clock_api_key
  reboot_timeout: 0s
  on_client_connected:
    - lambda: 'id(ha_connected) = true;'
  on_client_disconnected:
    - lambda: 'id(ha_connected) = false;'

ota:
  - platform: esphome
    password: !secret wall_clock_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret wall_clock_ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time
    timezone: Australia/Melbourne
    update_interval: 6h

# -----------------------------------------------------------------------------
# QSPI BUS
# -----------------------------------------------------------------------------
# The ST77916 is a quad-SPI panel: four data lines, not one MOSI. `type: quad`
# plus four data_pins is what distinguishes it from an ordinary SPI display.
spi:
  - id: qspi
    type: quad
    clk_pin: ${lcd_clk}
    # Quoted: an unquoted ${...} inside a YAML flow sequence is parsed as
    # the start of a flow mapping and fails before ESPHome ever substitutes.
    data_pins: ["${lcd_d0}", "${lcd_d1}", "${lcd_d2}", "${lcd_d3}"]

output:
  - platform: ledc
    pin: ${lcd_backlight}
    id: backlight_out

light:
  - platform: monochromatic
    output: backlight_out
    id: backlight
    name: "Backlight"
    restore_mode: ALWAYS_ON

  # ---- the LED ring --------------------------------------------------------
  - platform: esp32_rmt_led_strip
    id: ring
    internal: true
    pin: ${led_pin}
    num_leds: ${num_leds}
    chipset: WS2812             # NOT WS2812B — that value is invalid here
    channel_colors: GRB         # replaces the deprecated rgb_order (2026.8.0)
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    effects:
      - addressable_lambda:
          name: "Face"
          update_interval: 50ms
          lambda: |-
            int N = it.size();
            if (N < 4) return;
            if (N > 256) N = 256;
            id(frame)++;
            static Color buf[256];
            for (int i = 0; i < N; i++) buf[i] = Color(0, 0, 0);
            auto P = [N](float frac) -> int {
              int p = (int) lroundf(frac * N) + (${twelve_oclock_offset});
              p %= N; return p < 0 ? p + N : p;
            };
            auto add = [](int i, int r, int g, int b) {
              buf[i].r = (uint8_t) std::min(255, (int) buf[i].r + r);
              buf[i].g = (uint8_t) std::min(255, (int) buf[i].g + g);
              buf[i].b = (uint8_t) std::min(255, (int) buf[i].b + b);
            };
            const std::string mode = id(display_mode).state;
            const auto now = id(ha_time).now();
            if (!id(display_on).state) { it.all() = Color::BLACK; return; }

            if (mode == "test chase") {
              add((id(frame) / 6) % N, 255, 255, 255);
              add(P(0.0f), 160, 0, 0);
            } else if (!now.is_valid()) {
              add((id(frame) / 12) % N, 40, 20, 0);
            } else if (id(timer_alert).state && mode != "clock bare") {
              const float ph = (id(frame) % 20) / 20.0f;
              const float k = 0.35f + 0.65f * fabsf(1.0f - 2.0f * ph);
              for (int i = 0; i < N; i++) add(i, (int)(255*k), (int)(60*k), 0);
            } else {
              for (int m = 0; m < 12; m++) add(P(m / 12.0f), 14, 14, 18);
              bool running = false;
              if (mode == "auto" || mode == "clock only") {
                const float fin = id(timer_finish_epoch).state;
                const float tot = id(timer_total_seconds).state;
                if (!std::isnan(fin) && fin > 0 && !std::isnan(tot) && tot > 0) {
                  const float left = fin - (float) now.timestamp;
                  if (left > 0) {
                    running = true;
                    float ratio = left / tot;
                    if (ratio > 1.0f) ratio = 1.0f;
                    const int lit = (int) ceilf(ratio * N);
                    for (int i = 0; i < lit; i++) add(P((float) i / N), 0, 90, 80);
                  }
                }
              }
              if (mode == "auto" && !running) {
                if (id(garage_open).state) add(P(0.25f), 150, 70, 0);
                if (id(driveway_unknown).state) {
                  const float k = ((id(frame) / 10) % 2) ? 1.0f : 0.25f;
                  add(P(0.75f), (int)(200*k), 0, 0);
                }
              }
              const float hf = fmodf((float) now.hour, 12.0f) / 12.0f + now.minute / 720.0f;
              add(P(hf), 255, 90, 20);
              add(P(now.minute / 60.0f + now.second / 3600.0f), 30, 120, 255);
              add(P(now.second / 60.0f), 90, 90, 90);
              if (!id(ha_connected)) add(P(0.5f), 30, 0, 0);
            }
            float bri = id(day_brightness).state / 100.0f;
            if (now.is_valid()) {
              const int h = now.hour, ns = ${night_start_hour}, ne = ${night_end_hour};
              const bool night = (ns > ne) ? (h >= ns || h < ne) : (h >= ns && h < ne);
              if (night) bri = id(night_brightness).state / 100.0f;
            } else bri = id(night_brightness).state / 100.0f;
            for (int i = 0; i < N; i++)
              it[i] = Color((uint8_t) lroundf(buf[i].r * bri),
                            (uint8_t) lroundf(buf[i].g * bri),
                            (uint8_t) lroundf(buf[i].b * bri));

# -----------------------------------------------------------------------------
# FONTS
# -----------------------------------------------------------------------------
# gfonts:// pulls from Google Fonts AT COMPILE TIME, so the machine running
# ESPHome needs internet for the first build. Restricting `glyphs` keeps flash
# use small — a full glyph set at size 128 is enormous.
font:
  - file: "gfonts://Roboto"
    id: font_time
    size: 120
    bpp: 4                      # anti-aliased; 1bpp digits look ragged this big
    glyphs: "0123456789:"
  - file: "gfonts://Roboto"
    id: font_med
    size: 34
    bpp: 4
    glyphs: "0123456789.-°C% abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
  - file: "gfonts://Roboto"
    id: font_small
    size: 22
    bpp: 4
    glyphs: "0123456789.-°C% abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"

# -----------------------------------------------------------------------------
# THE ROUND DISPLAY
# -----------------------------------------------------------------------------
display:
  - platform: mipi_spi
    model: ESP-VOCAT           # the only ST77916 model ESPHome ships (360x360)
    id: face_lcd
    spi_id: qspi
    cs_pin: ${lcd_cs}
    reset_pin:
      number: ${lcd_reset}
      inverted: true           # this panel's RST is active HIGH
    # 1s because the clock shows seconds. With PSRAM the whole 253KB buffer is
    # resident, so a full blit at 80MHz QSPI is a few ms — it will not disturb
    # the 50ms LED render. If you drop seconds, switch to `update_interval:
    # never` and drive it from an on_time minute trigger instead.
    update_interval: 1s
    lambda: |-
      const int CX = 180, CY = 180;

      // ---- weather wash --------------------------------------------------
      // Background tint by condition. Kept dark on purpose: this sits inside a
      // lit LED ring, and a bright background would wash the ring out and be
      // unreadable at night.
      std::string cond = id(weather_condition).state;
      Color bg = Color(10, 12, 18);                       // unknown / default
      if      (cond == "sunny")        bg = Color(46, 34,  6);
      else if (cond == "clear-night")  bg = Color( 8, 10, 26);
      else if (cond == "partlycloudy") bg = Color(28, 30, 38);
      else if (cond == "cloudy")       bg = Color(22, 24, 28);
      else if (cond == "fog")          bg = Color(26, 26, 30);
      else if (cond == "rainy" ||
               cond == "pouring")      bg = Color( 8, 20, 40);
      else if (cond == "lightning" ||
               cond == "lightning-rainy") bg = Color(38, 24, 46);
      else if (cond == "snowy")        bg = Color(30, 36, 44);
      else if (cond == "windy")        bg = Color(16, 30, 30);
      it.filled_circle(CX, CY, 180, bg);

      // ---- time (the reason this exists) ---------------------------------
      if (id(ha_time).now().is_valid()) {
        it.strftime(CX, CY - 18, id(font_time), Color(255, 255, 255),
                    TextAlign::CENTER, "%H:%M", id(ha_time).now());
      } else {
        it.print(CX, CY - 18, id(font_time), Color(90, 70, 30),
                 TextAlign::CENTER, "--:--");
      }

      // ---- weather under the time ----------------------------------------
      if (!std::isnan(id(weather_temp).state)) {
        it.printf(CX, CY + 62, id(font_med), Color(210, 220, 240),
                  TextAlign::CENTER, "%.0f°C", id(weather_temp).state);
      }
      if (!cond.empty() && cond != "unknown") {
        // HA conditions are hyphenated slugs; make them readable.
        std::string pretty = cond;
        for (auto &ch : pretty) if (ch == '-') ch = ' ';
        it.printf(CX, CY + 104, id(font_small), Color(140, 152, 175),
                  TextAlign::CENTER, "%s", pretty.c_str());
      }

      // ---- stale-data hint, matching the ring's -------------------------
      if (!id(ha_connected))
        it.filled_circle(CX, CY + 140, 4, Color(120, 30, 30));

# -----------------------------------------------------------------------------
# STATE FROM HOME ASSISTANT
# -----------------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: timer_finish_epoch
    entity_id: sensor.wall_clock_timer_finish_epoch
  - platform: homeassistant
    id: timer_total_seconds
    entity_id: sensor.wall_clock_timer_total
  - platform: homeassistant
    id: weather_temp
    entity_id: weather.home        # <-- your weather entity
    attribute: temperature

text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.home        # state IS the condition slug
  - platform: homeassistant
    id: next_bin
    entity_id: sensor.next_bin

binary_sensor:
  - platform: homeassistant
    id: timer_alert
    entity_id: binary_sensor.wall_clock_timer_alert
  - platform: homeassistant
    id: garage_open
    entity_id: binary_sensor.wall_clock_garage_open
  - platform: homeassistant
    id: driveway_unknown
    entity_id: binary_sensor.wall_clock_driveway_unknown

number:
  - platform: template
    id: day_brightness
    name: "Brightness"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 45
    optimistic: true
    restore_value: true
  - platform: template
    id: night_brightness
    name: "Night brightness"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 1
    max_value: 50
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true

select:
  - platform: template
    id: display_mode
    name: "Mode"
    entity_category: config
    options: ["auto", "clock only", "clock bare", "test chase"]
    initial_option: "auto"
    optimistic: true
    restore_value: true

switch:
  - platform: template
    id: display_on
    name: "Display"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

globals:
  - id: frame
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ha_connected
    type: bool
    restore_value: no
    initial_value: 'false'
