    name: "Hour hue"
    entity_category: config
    icon: mdi:palette-outline
    unit_of_measurement: "°"
    min_value: 0
    max_value: 360
    step: 1
    initial_value: 18
    optimistic: true
    restore_value: true
  - platform: template
    id: hour_sat
    name: "Hour saturation"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 92
    optimistic: true
    restore_value: true
  - platform: template
    id: hour_val
    name: "Hour intensity"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    restore_value: true

  - platform: template
    id: min_hue
    name: "Minute hue"
    entity_category: config
    icon: mdi:palette-outline
    unit_of_measurement: "°"
    min_value: 0
    max_value: 360
    step: 1
    initial_value: 216
    optimistic: true
    restore_value: true
  - platform: template
    id: min_sat
