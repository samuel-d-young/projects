  - platform: template
    id: sec_hue
    name: "Second hue"
    entity_category: config
    icon: mdi:palette-outline
    unit_of_measurement: "°"
    min_value: 0
    max_value: 360
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
  - platform: template
    id: sec_sat
    name: "Second saturation"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
  - platform: template
    id: sec_val
    name: "Second intensity"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 35
    optimistic: true
    restore_value: true

  - platform: template
    id: timer_hue
    name: "Timer hue"
    entity_category: config
    icon: mdi:palette-outline
    unit_of_measurement: "°"
    min_value: 0
    max_value: 360
    step: 1
    initial_value: 173
    optimistic: true
    restore_value: true
  - platform: template
    id: timer_sat
    name: "Timer saturation"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    restore_value: true
  - platform: template
    id: timer_val
    name: "Timer intensity"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 35
    optimistic: true
    restore_value: true

  # ===========================================================================
  # GROW CLOCK -- a toddler sleep-training clock, on the same hardware
  # ===========================================================================
  # Sam: "I want to create a 'grow clock' feature for my son so that it changes
  # colour when to wake up etc." The Gro-Clock / Hatch Rest idea: the clock is
  # one colour while it is still sleep time and another when it is OK to get
  # up, so a child who cannot read a clock can still read this one. Everything
  # below is what a consumer grow clock does, minus two things this hardware
  # does not have -- a microphone and a speaker. The sound response is real but
  # it is fed from Home Assistant (see grow_sound_in), not from a mic.
  #
  # Times are hour + minute pairs rather than a single "07:30" text field,
  # because ESPHome's number entity is a slider or a box and either is easier
  # on a phone than typing a time string. Minutes step in fives.
  - platform: template
    id: grow_wake_h
    name: "Grow clock wake hour"
    entity_category: config
    icon: mdi:weather-sunset-up
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 7
    optimistic: true
    restore_value: true
  - platform: template
    id: grow_wake_m
    name: "Grow clock wake minute"
    entity_category: config
    icon: mdi:weather-sunset-up
    min_value: 0
    max_value: 55
    step: 5
    initial_value: 0
    optimistic: true
    restore_value: true
  - platform: template
    id: grow_wake_h_wknd
    name: "Grow clock weekend wake hour"
    entity_category: config
    icon: mdi:calendar-weekend
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true
  - platform: template
    id: grow_wake_m_wknd
    name: "Grow clock weekend wake minute"
    entity_category: config
    icon: mdi:calendar-weekend
    min_value: 0
    max_value: 55
    step: 5
    initial_value: 0
    optimistic: true
    restore_value: true
  - platform: template
    id: grow_bed_h
    name: "Grow clock bed hour"
    entity_category: config
    icon: mdi:weather-night
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 19
    optimistic: true
    restore_value: true
  - platform: template
    id: grow_bed_m
    name: "Grow clock bed minute"
    entity_category: config
    icon: mdi:weather-night
    min_value: 0
    max_value: 55
    step: 5
    initial_value: 0
    optimistic: true
    restore_value: true
  # "Almost time": the amber window before wake, so a child who wakes at 6:50
  # sees that morning is CLOSE without seeing that it is here. 0 turns it off.
  - platform: template
    id: grow_warn_min
    name: "Grow clock almost time minutes"
    entity_category: config
    icon: mdi:timer-sand
    min_value: 0
    max_value: 60
    step: 5
    initial_value: 15
    optimistic: true
    restore_value: true
  # The same idea at the other end of the day: a warning colour before bed.
  - platform: template
    id: grow_bed_warn_min
    name: "Grow clock bedtime warning minutes"
    entity_category: config
    icon: mdi:timer-sand
    min_value: 0
    max_value: 60
    step: 5
    initial_value: 10
    optimistic: true
    restore_value: true
  - platform: template
    id: grow_nap_min
    name: "Grow clock nap minutes"
    entity_category: config
    icon: mdi:power-sleep
    min_value: 10
    max_value: 180
    step: 5
    initial_value: 90
    optimistic: true
    restore_value: true
  # Brightness in the sleep states and in the awake ones, SCREEN and RING
  # apart. Sam: "the LEDs are too bright and the screen is too low" -- one
  # number for both could only ever get one of them right. These override the
  # clock's ordinary day/night brightness while grow mode is on.
  - platform: template
    id: grow_night_bright
    name: "Grow clock screen night brightness"
    entity_category: config
    icon: mdi:brightness-3
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 20
    optimistic: true
    restore_value: true
  - platform: template
    id: grow_day_bright
    name: "Grow clock screen day brightness"
    entity_category: config
    icon: mdi:brightness-7
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 80
    optimistic: true
    restore_value: true
  - platform: template
    id: grow_ring_night_bright
    name: "Grow clock ring night brightness"
    entity_category: config
    icon: mdi:led-strip-variant
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 7           # was 12; a night light, not a lamp
    optimistic: true
    restore_value: true
  - platform: template
    id: grow_ring_day_bright
    name: "Grow clock ring day brightness"
    entity_category: config
    icon: mdi:led-strip-variant
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 1
    initial_value: 25          # was 45; see the note on day_brightness
    optimistic: true
    restore_value: true
  # Sunrise: the wake colour fades up from the night level to the day level
  # over this many minutes after wake time, ring and screen. 0 is a hard cut.
  - platform: template
    id: grow_fade_min
    name: "Grow clock sunrise fade minutes"
    entity_category: config
    icon: mdi:weather-sunset-up
    unit_of_measurement: "min"
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
  # How many stars the screen counts down through the night.
  - platform: template
    id: grow_star_count
    name: "Grow clock star count"
    entity_category: config
    icon: mdi:star-four-points
    min_value: 3
    max_value: 12
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true
  # With "clock by day" on, the grow face gives way to the ordinary clock this
  # long after wake time, and comes back for the bedtime warning.
  - platform: template
    id: grow_wake_hold_min
    name: "Grow clock wake hold minutes"
    entity_category: config
    icon: mdi:clock-end
    unit_of_measurement: "min"
    min_value: 5
    max_value: 240
    step: 5
    initial_value: 60
    optimistic: true
    restore_value: true
  # "Five more minutes": the snooze button starts a short sleep of this length.
  - platform: template
    id: grow_snooze_min
    name: "Grow clock snooze minutes"
    entity_category: config
    icon: mdi:alarm-snooze
    unit_of_measurement: "min"
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
  # How long the wake-up effect (rainbow, sparkle) runs on the ring after wake.
  # HOW OFTEN THE FACE MAY REDRAW, in milliseconds, and it is a dial rather
  # than a constant because the right value is a thing you look at, not a
  # thing I can derive.
  #
  # This panel has no working PSRAM, so its buffer holds a sixth of a frame
  # and every redraw is written to the glass in six horizontal strips, top to
  # bottom. If a new frame starts before the last one has finished walking
  # down the panel, the screen is never showing one whole picture, and that
  # is the flicker left on the animations after the stale-pixel bug was
  # fixed. It is not a fault in the drawing; it is the panel being repainted
  # faster than it can be repainted.
  #
  # THE DIAL IS THE POINT: turn it live and watch, no reflash. Lower is
  # smoother eyes and more load; higher is calmer and jumpier.
  #
  # THE RULE, and it is measurable rather than a matter of taste: keep this at
  # roughly TWICE the "Grow clock frame time" sensor. Below that the loop
  # cannot finish one repaint before the next is due, and everything sharing
  # the loop -- the ordinary clock face, the ring -- starts to stutter with it.
  # That is what happened at a 100 ms default, and the lesson is that the
  # budget is the LOOP, not the SPI bus.
  #
  # The history is worth keeping because the numbers moved twice. A full-panel
  # animation frame measured 269 ms and the first clipped one 385, which is why
  # the floor was briefly 400. Drawing the animation box band by band (06765c3)
  # cut the background from 272160 pixel calls a frame to 45360 and skips the
  # eye block in three bands of six, so the floor comes back down to 200 and
  # the default to 300. If the frame-time sensor says otherwise on your panel,
  # believe the sensor.
  #
  # Blinks get a faster floor than this on their own -- see the animator's
  # gate below. They are the fast part and they were the part being dropped.
  - platform: template
    id: grow_anim_ms
    name: "Grow clock animation interval"
    entity_category: config
    icon: mdi:filmstrip
    unit_of_measurement: "ms"
    # 250, not 100. A FULL frame is 360 x 360 x 16 bit -- 259200 bytes, about
    # 104 ms at the panel's 20 MHz -- plus six passes of the drawing lambda.
    # Below about 250 ms the frames overlap and the glass never shows one whole
    # picture, which is the flicker this whole exercise is about. The first
    # version that worked repainted once a SECOND; 600 is still more than twice
    # as smooth as that.
    min_value: 200
    max_value: 2000
    step: 10
    initial_value: 300
    optimistic: true
    restore_value: true

  - platform: template
    id: grow_wake_effect_min
    name: "Grow clock wake effect minutes"
    entity_category: config
    icon: mdi:party-popper
    unit_of_measurement: "min"
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
  # How long the clock reacts after a sound event -- see grow_sound_in.
  - platform: template
    id: grow_sound_secs
    name: "Grow clock sound response seconds"
    entity_category: config
    icon: mdi:ear-hearing
    unit_of_measurement: "s"
    min_value: 5
    max_value: 120
    step: 5
    initial_value: 20
    optimistic: true
    restore_value: true

select:
  # ---- WHICH SCREEN ----------------------------------------------------------
  # "auto" follows the strap on ${panel_detect}. The two explicit options are
  # an override for bench work and for the case where a cable was made without
  # the strap wire.
  #
  # This picks which display gets DRAWN. It cannot pick which driver is
  # COMPILED, and it does not need to: both are compiled, and each panel has
  # its own CS and RESET so neither ever sees the other's init sequence. See
  # the second display entry for why that separation is not optional.
  - platform: template
    id: panel_choice
    name: "Screen"
    entity_category: config
    icon: mdi:monitor-multiple
    options:
      - "auto"              # follow the strap
      - "round 360x360"     # force the GC9B72 round panel
      - "bar 320x170"       # force the ST7789 bar panel
    initial_option: "auto"
    optimistic: true
    restore_value: true

  - platform: template
    id: display_mode
    name: "Mode"
    entity_category: config
    options:
      - "auto"          # clock + timer + alert + ambient
      - "clock only"    # suppress ambient status, keep the timer arc
      - "clock bare"    # clock alone — fault-finding
      - "test chase"    # one pixel walks the ring: wiring / order / index check
    initial_option: "auto"
    optimistic: true
    restore_value: true

  # Face style for the LCD. The ring is always analogue — that is the point of
  # a ring — so this only changes the screen.
  - platform: template
    id: clock_face
    name: "Face"
    entity_category: config
    icon: mdi:clock-outline
    options:
      - "digital"       # big time, subtitle underneath
      - "minimal"       # time only, nothing else
      - "analog"        # drawn hands on the LCD as well as the ring
      - "analog ring"   # dial pushed to the rim, quantised to the LED positions
      - "colour test"   # three labelled swatches -- settles color_order by eye
    initial_option: "digital"
    optimistic: true
    restore_value: true

  # An ana-digi complication, and WHERE it sits rather than merely whether.
  # "bottom" is the default because that is where a watch puts a digital
  # sub-dial: below the hub, clear of the 12, and out of the way of the hour
  # hand for most of the day.
  #
  # The date takes the opposite end automatically, so the two can never stack
  # up on each other whichever way round you set this.
  - platform: template
    id: digi_pos
    name: "Digital time on analog"
    entity_category: config
    icon: mdi:clock-digital
    options:
      - "bottom"
      - "top"
      - "off"
    initial_option: "bottom"
    optimistic: true
    restore_value: true

  # How big the time is drawn. ESPHome compiles fonts at fixed sizes, so this
  # picks between real fonts rather than scaling one — a slider would imply a
  # smoothness that does not exist.
  #
  # Each surface gets its own ladder, because "large" means different things in
  # the two places the time appears:
  #   digital / minimal face   72 / 96 / 118 px   — it IS the face
  #   digital on an analog face 32 / 48 / 72 px   — it is a complication, and
  #                                                 must not swamp the dial
  # "large" is the default so the digital face looks exactly as it did before
  # this control existed.
  - platform: template
    id: digi_size
    name: "Digital time size"
    entity_category: config
    icon: mdi:format-size
    options:
      - "small"
      - "medium"
      - "large"
    initial_option: "large"
    optimistic: true
    restore_value: true

  # What the SCREEN does while a timer runs. The ring drains either way — that
  # is the ring's job and it is not affected by this.
  #
  # "keep clock" is the Amazon Echo Wall Clock's behaviour, and the reason it
  # works: the ring is already a countdown you can read from across the room,
  # so spending the screen on the same number twice buys nothing, while the one
  # thing you lose — the time — is the thing the object is for.
  - platform: template
    id: timer_screen
    name: "Screen during a timer"
    entity_category: config
    icon: mdi:timer-outline
    options:
      - "keep clock"
      - "countdown"
    initial_option: "keep clock"
    optimistic: true
    restore_value: true

  # A tick moves once a second; a sweep glides between them using the render
  # frame counter. Sweep costs nothing extra — the lambda already runs at 20fps
  # for the alert pulse.
  - platform: template
    id: sec_style
    name: "Second hand style"
    entity_category: config
    icon: mdi:timer-outline
    options:
      - "tick"
      - "sweep"
    initial_option: "tick"
    optimistic: true
    restore_value: true

  # HOUR MARKERS, ONE SELECT PER SURFACE.
  # Sam: "...only show the hours and minutes on the LED ring, but keep the
  # markers on the screen." One select drove both, so "none" took the screen's
  # markers away with the ring's. `marker_style` keeps its id and is now the
  # SCREEN's; `ring_markers` is the ring's, and it ships as "none" because that
  # is the state Sam asked for.
  #
  # On a 24-LED ring twelve markers use half the pixels, which can drown the
  # hands. Quarters keeps the orientation cue at a quarter of the cost -- which
  # is the setting to come back to if a bare ring turns out to be too bare.
  - platform: template
    id: marker_style
    name: "Screen hour markers"
    entity_category: config
    icon: mdi:format-list-bulleted
    options:
      - "twelve"
      - "quarters"
      - "none"
    initial_option: "twelve"
    optimistic: true
    restore_value: true

  - platform: template
    id: ring_markers
    name: "Ring hour markers"
    entity_category: config
    icon: mdi:format-list-bulleted
    options:
      - "twelve"
      - "quarters"
      - "none"
    initial_option: "none"
    optimistic: true
    restore_value: true

  # How the ring counts a timer down.
  #
  # "minutes" is the Echo Wall Clock's model and it is a COUNT, not a
  # proportion: one LED per whole minute remaining, so a 2 minute timer lights
  # 2 LEDs and a 10 minute timer lights 10. Inside the last minute it switches
  # to seconds and drains the other way round.
  #
  # That direction flip is the useful part, not decoration: it is how you can
  # tell from across the room that you are inside the final minute, without
  # counting anything.
  #
  # "proportion" is the older behaviour — the whole ring means the whole timer,
  # however long it is. Fine for one timer, but it makes a 2 minute and a
  # 2 hour timer look identical, which is exactly what the Echo avoids.
  #
  # "seconds" is new, and it is the default, because Sam asked for it directly:
  # "Make sure that when a timer is set, that the LED's count down the seconds."
  # It is "minutes" with the last stretch replaced by a literal per-second
  # countdown -- ONE LED PER SECOND REMAINING, one going out every second.
  #
  #     more than N seconds left   one LED per whole minute remaining (as
  #                                "minutes" does, so a long timer still reads)
  #     N seconds or fewer         one LED per second remaining, draining the
  #                                other way round
  #
  # N is the ring's LED count, and being honest about what that means: a
  # 60-LED ring gives a true per-second countdown for the whole final minute;
  # the 24-LED ring can only do it for the last 24 seconds and the 32 for the
  # last 32, because one LED per second is one LED per second. The changeover is
  # the same direction flip "minutes" already uses, so you can still see the
  # final stretch start without counting.
  - platform: template
    id: timer_style
    name: "Timer countdown style"
    entity_category: config
    icon: mdi:timer-sand
    options:
      - "seconds"
      - "minutes"
      - "proportion"
    initial_option: "seconds"
    optimistic: true
    restore_value: true

  # Which way the timer arc drains. Clockwise reads as "time passing"; some
  # people read a shrinking anticlockwise arc as "time left" instead.
  # In "minutes" style this sets the direction the MINUTES accumulate; the
  # final minute always runs the other way, which is the point.
  - platform: template
    id: arc_dir
    name: "Timer arc direction"
    entity_category: config
    icon: mdi:rotate-right
    options:
      - "clockwise"
      - "anticlockwise"
    initial_option: "clockwise"
    optimistic: true
    restore_value: true

  - platform: template
    id: alert_style
    name: "Alert pattern"
    entity_category: config
    icon: mdi:bell-ring-outline
    options:
      - "pulse"
      - "chase"
      - "solid"
    initial_option: "pulse"
    optimistic: true
    restore_value: true

  # Palette for hands and accents. "mono" is the accessible one — it drops all
  # hue coding, so nothing depends on telling red from green.
  #
  # "custom" hands control to the twelve Hue/Saturation/Value numbers below.
  # The four named presets are unchanged and stay one click away — custom is an
  # addition, not a replacement, so there is always a known-good palette to
  # return to after fiddling.
  - platform: template
    id: colour_theme
    name: "Colour theme"
    entity_category: config
    icon: mdi:palette
    options:
      - "default"
      - "warm"
      - "cool"
      - "mono"
      - "custom"
    initial_option: "default"
    optimistic: true
    restore_value: true

  # ---- Grow clock ----------------------------------------------------------
  # Blue is the Gro-Clock's night colour and what most children have seen. Red
  # is what sleep consultants tend to recommend -- it is the wavelength least
  # likely to suppress melatonin -- so it is here as a choice rather than a
  # default. "off" is for the child who sleeps better with nothing lit at all:
  # the ring goes dark in the sleep state and only the wake colour ever shows.
  - platform: template
    id: grow_sleep_colour
    name: "Grow clock sleep colour"
    entity_category: config
    icon: mdi:palette
    options:
      - "blue"
      - "red"
      - "purple"
      - "off"
    initial_option: "blue"
    optimistic: true
    restore_value: true
  - platform: template
    id: grow_wake_colour
    name: "Grow clock wake colour"
    entity_category: config
    icon: mdi:palette
    options:
      - "yellow"
      - "green"
      - "white"
    initial_option: "yellow"
    optimistic: true
    restore_value: true
  # The two in-between colours. Amber before wake is the convention; some
  # children do better with a colour that is clearly not the wake one.
  - platform: template
    id: grow_almost_colour
    name: "Grow clock almost colour"
    entity_category: config
    icon: mdi:palette
    options:
      - "amber"
      - "yellow"
      - "green"
      - "white"
    initial_option: "amber"
    optimistic: true
    restore_value: true
  - platform: template
    id: grow_bedtime_colour
    name: "Grow clock bedtime colour"
    entity_category: config
    icon: mdi:palette
    options:
      - "orange"
      - "red"
      - "purple"
      - "blue"
    initial_option: "orange"
    optimistic: true
    restore_value: true
  # The stars on the screen: plain dots, or little four-point sparkles.
  - platform: template
    id: grow_star_shape
    name: "Grow clock star shape"
    entity_category: config
    icon: mdi:star-four-points-outline
    options:
      - "dots"
      - "stars"
    initial_option: "stars"
    optimistic: true
    restore_value: true
  # What the ring does for the first minutes after wake: the wake colour, a
  # slow rainbow, or the wake colour with sparkles. A small celebration.
  - platform: template
    id: grow_wake_effect
    name: "Grow clock wake effect"
    entity_category: config
    icon: mdi:party-popper
    options:
      - "solid"
      - "rainbow"
      - "sparkle"
    initial_option: "rainbow"
    optimistic: true
    restore_value: true
  # What the panel draws. "sun and moon" is the Gro-Clock's picture;
  # "eyes" is the Deskimon look Sam asked for: two big rounded eyes glowing in
  # the state colour on a black field, no mouth, every expression an eyelid.
  # "eyes and sky" is the same with a sun or a moon above them and the stars
  # under them -- Sam: "the face and also the stars/moon or sun". The default.
  # "eyes on colour" is the same eyes in dark ink on a field of the state
  # colour, for a room where the whole screen should read as the colour.
  # "colour only" is just the field, for a child who finds faces too exciting.
  - platform: template
    id: grow_face
    name: "Grow clock face"
    entity_category: config
    icon: mdi:emoticon-outline
    options:
      - "eyes and sky"
      - "eyes"
      - "eyes on colour"
      - "sun and moon"
      - "colour only"
    initial_option: "eyes and sky"
    optimistic: true
    restore_value: true
  # Forces a state, for showing a child what each one looks like before the
  # first night, and for checking the colours in daylight. "auto" is the real
  # behaviour; the others hold that expression until this is put back.
  - platform: template
    id: grow_expression
    name: "Grow clock expression"
    entity_category: config
    icon: mdi:emoticon-happy-outline
    options:
      - "auto"
      - "sleeping"
      - "almost"
      - "awake"
      - "bedtime"
    initial_option: "auto"
    optimistic: true
    restore_value: true

switch:
  # ---------------------------------------------------------------------------
  # POWER: one master, two surfaces
  # ---------------------------------------------------------------------------
  # Sam: "Update the wall clock so you can control the screen and LED
  # seperately. I would like to turn off the LED's on the outside and only show
  # the hours and minutes on the LED ring, but keep the markers on the screen."
  #
  # `display_on` used to gate the RING -- one switch called "Display" that
  # actually turned the LEDs off -- so there was no way to have one surface
  # without the other. It is now the MASTER and keeps its id and its name, so
  # nothing already on a dashboard or in an automation breaks; the two new
  # switches under it are what pick a surface.
  #
  #     ring lit    iff  display_on AND ring_on
  #     screen lit  iff  display_on AND screen_on
  - platform: template
    id: display_on
    name: "Display"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # THE FIX, if the shape test below confirms the hypothesis. Default OFF, so
  # nothing changes unless Sam picks it.
  #
  # Flat art is the INSTRUMENT: a plain square, maximally pure, deliberately
  # ugly. This is what the art should actually become if edge structure turns
  # out to be the cause -- a pixel-art crescent and crossed-bar sparkles that
  # look intentional rather than like a fallback.
  #
  # I over-stated the constraint in my own notes: I wrote that a crescent from
  # stacked bars "will not do, that reintroduces the row-to-row change". Too
  # strict. A rasterised circle changes its run-length at EVERY row -- about
  # forty of them for this moon. Seven bands change it six times. The
  # hypothesis is about fine, repeated row-to-row structure, not about any
  # change anywhere, so a chunky shape keeps nearly all the benefit.
  #
  # The crescent is STEPPED FROM THE REAL GEOMETRY rather than hand-drawn:
  # outer disc, bite disc offset right and up, sampled at each band's centre.
  # Hand-picked bars read as the letter C; stepping the true shape reads as a
  # moon. Verified in preview/grow_faces.py -- see preview/shape-block.png.
  - platform: template
    id: grow_block_art
    name: "Grow clock blocky art"
    entity_category: config
    icon: mdi:moon-waning-crescent
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # THE SHAPE TEST, and it is the first hypothesis that fits every data point.
  #
  # Sam's two lists, laid out by what the elements are DRAWN AS rather than
  # where they are or how big:
  #
  #   eyes        rounded rectangles, straight edges          steady
  #   z's, time   text glyphs, straight strokes               steady
  #   moon        filled_circle x2, staircase edges           FLICKERS
  #   stars       filled_circle / filled_triangle, staircase  FLICKERS
  #
  # It is not size: the z's are small, bright and steady. It is not position:
  # the stars and part of the time share band 4. What is left is the EDGE
  # STRUCTURE. A rasterised circle's run-length changes row to row, and that
  # fine row-to-row structure is what beats against an LCD's polarity-inversion
  # scheme when VCOM is slightly off -- the classic cause of shimmer that hits
  # patterned regions and leaves flat blocks alone.
  #
  # ON: the moon and the star row are drawn with axis-aligned rectangles only.
  # Same positions, same colours, same code path, same frame -- ONLY the edge
  # structure changes. If the flicker goes with the shape, the cause is the
  # panel's inversion/VCOM and not one line of the renderer.
  #
  # Chosen over poking the init sequence's VCOM registers (0x7C/0xC3/0xC4/0xC9)
  # because there is no public GC9B72 datasheet, those values are the vendor's
  # own, and guessing at analogue drive levels on Sam's hardware is not a test,
  # it is a risk.
  - platform: template
    id: grow_flat_art
    name: "Grow clock flat art (test)"
    entity_category: config
    icon: mdi:square-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # SAM: "The first time you flashed the animations worked. Try that again but
  # with the fix that stopped the flicker on the eyes and clock."
  #
  # He is right, and it is worth being exact about WHY the first one worked.
  # In 7776635 the partial repaint was filled_rectangle(CX-124, 60, 248, 184) --
  # starting at y = 60. Band 0 is y 0-59, so band 0 always came back empty, and
  # mipi_spi RETURNS from the whole frame on the first empty band. Not one
  # animation frame ever reached the glass. The panel was repainted by exactly
  # one path, the full frame, and every band was painted in full every time.
  # That is the safest arrangement there is over a shared buffer nobody clears:
  # there is no such thing as a partially-touched band.
  #
  # So this switch is OFF by default and the partial path is off with it. Every
  # repaint is now a FULL frame, and what stops that being the once-a-second
  # sweep it used to be is the other half of his sentence -- the content key
  # from c635533, which repaints when the picture changes rather than when the
  # clock ticks. Those two together are what he asked for.
  #
  # 6702d52 also made animation frames full frames and it did not settle it --
  # but at that point the unconditional 1 Hz repaint was still running too, so
  # there were two full-frame paths at different rates walking down the glass
  # over each other. With the key in place there is only one.
  #
  # ON restores the partial path, for A/B on the glass without a reflash.
  - platform: template
    id: grow_partial
    name: "Grow clock partial redraw"
    entity_category: config
    icon: mdi:image-refresh
    optimistic: true
    # ON. An animation frame repaints the eye box and nothing else, so nothing
    # static is ever rewritten while the panel is scanning itself out. That is
    # the flicker fix -- see "THE ANIMATION BOX" in the round panel's lambda.
    # Turn it OFF to get the old behaviour back (every animation frame repaints
    # all 360 x 360) and the moon and the star row will start blinking again;
    # that is the A/B, and it is the evidence for the diagnosis.
    restore_mode: RESTORE_DEFAULT_ON

  # THE DECISIVE TEST, and it should have existed nine theories ago.
  # ON: the dispatcher stops calling component.update on the panel ENTIRELY.
  # No full frames, no animation frames, not one byte down the SPI bus. The
  # last picture drawn stays on the glass.
  #
  # If the screen STILL flickers with this on, then nothing the firmware draws
  # is responsible -- not the repaint rate, not the clip, not the animation --
  # because nothing is being drawn. It is then the panel, the wiring or the
  # backlight, and I stop editing the renderer for good.
  #
  # If it goes still, the flicker is in what we write, and the frame-time
  # sensor plus the repaint switch narrow it from there.
  #
  # Leave it OFF for normal use: with it on the clock never updates again.
  - platform: template
    id: screen_freeze
    name: "Screen freeze (test)"
    entity_category: config
    icon: mdi:pause-octagon
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Diagnostic, and an A/B. OFF (the default) is the fixed behaviour: the panel
  # is repainted when the picture changes. ON restores the old unconditional
  # 1 Hz full repaint, so the two can be compared on the glass in a few seconds
  # without a reflash.
  - platform: template
    id: grow_paint_1s
    name: "Grow clock repaint every second"
    entity_category: config
    icon: mdi:refresh-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: ring_on
    name: "Ring LEDs"
    icon: mdi:circle-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: screen_on
    name: "Screen on"
    icon: mdi:monitor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: fmt_24h
    name: "24 hour time"
    entity_category: config
    icon: mdi:clock-digital
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: show_date
    name: "Show date"
    entity_category: config
    icon: mdi:calendar
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: show_dow
    name: "Show day of week"
    entity_category: config
    icon: mdi:calendar-week
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Dimming still leaves a lit panel in a dark hallway. This blanks the SCREEN
  # only — the ring keeps the time, because the clock is the one thing that
  # must survive every setting on this page.
  - platform: template
    id: night_blank
    name: "Blank screen at night"
    entity_category: config
    icon: mdi:monitor-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # SPLIT. `show_seconds` is the SCREEN's second hand and keeps its id; the ring
  # has its own switch, because "only show the hours and minutes on the LED
  # ring" is a ring-only instruction and the screen is meant to keep everything.
  - platform: template
    id: show_seconds
    name: "Screen second hand"
    entity_category: config
    icon: mdi:timer-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: ring_seconds
    name: "Ring second hand"
    entity_category: config
    icon: mdi:timer-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: show_weather
    name: "Show weather"
    entity_category: config
    icon: mdi:weather-partly-cloudy
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # ---------------------------------------------------------------------------
  # THE AMBIENT HINTS, ONE SWITCH EACH
  # ---------------------------------------------------------------------------
  # Sam: "why is there a blue light on the LED, what else is showing on the LED
  # ring... I want to turn the [bin] light off."
  #
  # There was exactly one switch for the lot, so the only way to lose the bin
  # light was to lose the garage and the driveway with it. Every ambient pixel
  # now has its own switch AND its own place on the dial, so the answer to
  # "what is that?" is readable off this list:
  #
  #     bin night   12 o'clock  breathing green, or yellow when it is Recycling
  #     garage       3 o'clock  steady amber
  #     driveway     9 o'clock  blinking red
  #     presence   ~ 6 o'clock  up to four dots: Sam (0,40,90) BLUE,
  #                             Laura (90,0,70) magenta, Amanda (0,70,40) green,
  #                             Zac (70,50,0) amber
  #
  # THE BLUE ONE. Sam's own presence dot is (0,40,90) and it sits just left of 6
  # o'clock -- that is the single blue light. The twelve hour markers are also
  # very slightly blue, (14,14,18), but they are dim and there are twelve of
  # them, so a single blue dot is the presence pip. Both have a switch now.
  # `show_status` is kept as the master over the four, with its id unchanged.
  - platform: template
    id: show_status
    name: "Show status hints"
    entity_category: config
    icon: mdi:information-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # OFF BY DEFAULT -- the one Sam asked to turn off, in the message that asked.
  - platform: template
    id: st_bin
    name: "Status bin night"
    entity_category: config
    icon: mdi:trash-can-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: st_garage
    name: "Status garage open"
    entity_category: config
    icon: mdi:garage-open
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: st_driveway
    name: "Status driveway"
    entity_category: config
    icon: mdi:car-back
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: st_presence
    name: "Status who is home"
    entity_category: config
    icon: mdi:account-group
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Echo-style indicator LEDs for timers that are NOT the next to expire.
  - platform: template
    id: show_pips
    name: "Show extra timer pips"
    entity_category: config
    icon: mdi:circle-small
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: auto_dim
    name: "Auto dim at night"
    entity_category: config
    icon: mdi:brightness-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # ---- Grow clock ----------------------------------------------------------
  # THE MASTER. On, the whole clock becomes the child's clock: ring, panel and
  # backlight follow the sleep/wake schedule and nothing else -- no timers, no
  # status pixels, no hands. A nursery clock that lights up because the
  # kitchen timer finished is a bug, not a feature. Off, everything above this
  # comment behaves exactly as it did.
  - platform: template
    id: grow_mode
    name: "Grow clock"
    icon: mdi:baby-face-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # The digital time along the bottom of the face. On by default -- Sam asked
  # for it, and it is the parent at 3 a.m. who reads it, not the child. Off if
  # the numbers turn out to be a distraction: the colour is still the clock.
  - platform: template
    id: grow_show_time
    name: "Grow clock show time"
    entity_category: config
    icon: mdi:clock-digital
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # The Gro-Clock's best idea: stars that go out one by one through the night,
  # so "how long until morning" is something a child can count. Here the ring
  # is the stars -- a 60-LED ring loses one about every ten minutes over a
  # ten-hour night -- and the panel shows a row of eight.
  - platform: template
    id: grow_stars
    name: "Grow clock stars"
    entity_category: config
    icon: mdi:star-four-points
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # The eyes move: random looks, blinks, smiles, yawns at bedtime, a twitch in
  # the night. Off leaves the resting face of each state, still.
  - platform: template
    id: grow_animate
    name: "Grow clock animate"
    entity_category: config
    icon: mdi:motion-play-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # "12 min" under the eyes while it is almost morning, and again before bed:
  # for a child who can count, and for the parent who wants to know.
  - platform: template
    id: grow_show_countdown
    name: "Grow clock show countdown"
    entity_category: config
    icon: mdi:timer-sand
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # A grow clock at night, an ordinary clock by day: once the wake window has
  # held for grow_wake_hold_min, the normal face comes back until the bedtime
  # warning. Off keeps the grow face all day.
  - platform: template
    id: grow_day_clock
    name: "Grow clock clock by day"
    entity_category: config
    icon: mdi:clock-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # DIAGNOSTIC, and the only honest way left to split the last symptom in two.
  # On: animation frames keep running at exactly the same rate, but the pose
  # they draw never advances -- every frame writes the SAME pixels.
  #   still flickers  -> it is the act of writing to the panel (a burst on the
  #                      supply, or the write itself being visible), and no
  #                      amount of drawing differently will fix it.
  #   goes steady     -> it is the CONTENT changing, which is the animation
  #                      itself, and the answer is how the eyes move.
  # Four flashes have been spent guessing between those two. This settles it.
  - platform: template
    id: grow_freeze
    name: "Grow clock freeze the eyes (test)"
    entity_category: diagnostic
    icon: mdi:pause-octagon
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Holidays: the weekend times apply every day until this is turned off.
  - platform: template
    id: grow_holiday
    name: "Grow clock holiday"
    entity_category: config
    icon: mdi:beach
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: grow_weekend
    name: "Grow clock weekend times"
    entity_category: config
    icon: mdi:calendar-weekend
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: grow_dim
    name: "Grow clock dim at night"
    entity_category: config
    icon: mdi:brightness-4
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # WHAT "RESPOND TO SOUND" MEANS HERE, honestly. This board has no microphone.
  # The trigger is a Home Assistant entity (grow_sound_in) that anything can
  # drive -- a Voice PE hearing its wake word, a baby monitor, a noise sensor.
  # When it fires DURING SLEEP the clock brightens for grow_sound_secs and the
  # face says "shh", in the SLEEP colour, never the wake one: the point is to
  # answer "is it morning yet?" with a clear no, not to reward calling out.
  - platform: template
    id: grow_sound
    name: "Grow clock respond to sound"
    entity_category: config
    icon: mdi:ear-hearing
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# -----------------------------------------------------------------------------
# GROW CLOCK BUTTONS -- the parent's overrides
# -----------------------------------------------------------------------------
# An override holds until the SCHEDULE next changes state on its own, then lets
# go. So "wake now" at 6:40 gives the wake colour immediately and the schedule
# takes back over at bedtime; "sleep now" at 18:30 gives the sleep colour and
# lets go at the next wake. Nothing has to be remembered to be undone.
button:
  - platform: template
    id: grow_wake_now
    name: "Grow clock wake now"
    icon: mdi:weather-sunny
    on_press:
      - lambda: |-
          id(grow_nap_end) = 0;
          id(grow_sched_at_override) = id(grow_sched);
          id(grow_override) = 1;
  - platform: template
    id: grow_sleep_now
    name: "Grow clock sleep now"
    icon: mdi:weather-night
    on_press:
      - lambda: |-
          id(grow_nap_end) = 0;
          id(grow_sched_at_override) = id(grow_sched);
          id(grow_override) = 2;
  # A nap is a short sleep with its own countdown: the stars count the nap
  # down instead of the night, and the wake colour comes on at the end.
  - platform: template
    id: grow_nap_start
    name: "Grow clock start nap"
    icon: mdi:power-sleep
    on_press:
      - lambda: |-
          const auto now = id(ha_time).now();
          if (now.is_valid()) {
            id(grow_override) = 0;
            id(grow_nap_end) = (uint32_t) now.timestamp
                             + (uint32_t) lroundf(id(grow_nap_min).state * 60.0f);
          }
  - platform: template
    id: grow_nap_cancel
    name: "Grow clock cancel nap"
    icon: mdi:cancel
    on_press:
      - lambda: 'id(grow_nap_end) = 0;'
  # "Five more minutes": a short sleep in the sleep colour that ends itself in
  # the wake colour. It is a nap of grow_snooze_min, and the nap machinery
  # already does exactly that.
  - platform: template
    id: grow_snooze
    name: "Grow clock five more minutes"
    icon: mdi:alarm-snooze
    on_press:
      - lambda: |-
          const auto now = id(ha_time).now();
          if (now.is_valid()) {
            id(grow_override) = 0;
            id(grow_nap_end) = (uint32_t) now.timestamp
                             + (uint32_t) lroundf(id(grow_snooze_min).state * 60.0f);
          }
  - platform: template
    id: grow_clear_override
    name: "Grow clock back to schedule"
    icon: mdi:calendar-clock
    on_press:
      - lambda: |-
          id(grow_override) = 0;
          id(grow_nap_end) = 0;

globals:
  # ---- Grow clock state, resolved ONCE a second by the dispatcher ----------
  # so the ring, the panel, the backlight and the HA sensor all read the same
  # answer. 0 sleep, 1 almost, 2 awake, 3 bedtime, 4 nap.
  - id: grow_st
    type: int
    restore_value: no
    initial_value: '2'
  # the schedule's own state, ignoring overrides -- what an override is measured
  # against to know when to let go
  - id: grow_sched
    type: int
    restore_value: no
    initial_value: '2'
  - id: grow_sched_at_override
    type: int
    restore_value: no
    initial_value: '-1'
  - id: grow_override          # 0 none, 1 force awake, 2 force sleep
    type: int
    restore_value: no
    initial_value: '0'
  - id: grow_nap_end           # epoch seconds; 0 = no nap running
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: grow_frac              # fraction of the night (or nap) still to go
    type: float
    restore_value: no
    initial_value: '1.0'
  - id: grow_sound_since       # millis() at the last sound event
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: grow_sound_count
    type: int
    restore_value: no
    initial_value: '0'

  # ---- Grow eye animator. Written by the 100 ms interval, read by both panel
  # lambdas, so a full frame from the dispatcher and an animation frame draw
  # the same eyes. Mirrored in preview/grow_anim.py.
  - id: an_seed                # 32-bit LCG state
    type: uint32_t
    restore_value: no
    initial_value: '2463534242'
  - id: an_clip                # running clip, 0 = resting
    type: int
    restore_value: no
    initial_value: '0'
  - id: an_t0                  # millis() the clip started
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: an_dur                 # its length, ms
    type: uint32_t
    restore_value: no
    initial_value: '1'
  - id: an_next                # millis() the next clip may start
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: an_p1
    type: int
    restore_value: no
    initial_value: '0'
  - id: an_p2
    type: int
    restore_value: no
    initial_value: '0'
  - id: an_p3
    type: int
    restore_value: no
    initial_value: '0'
  - id: an_p4
    type: int
    restore_value: no
    initial_value: '0'
  - id: an_stlast              # state the animator last saw
    type: int
    restore_value: no
    initial_value: '-1'
  # per-frame outputs
  - id: an_gx                  # gaze, px at round scale
    type: float
    restore_value: no
    initial_value: '0'
  - id: an_gy
    type: float
    restore_value: no
    initial_value: '0'
  - id: an_lidl                # share of the left eye covered from the top
    type: float
    restore_value: no
    initial_value: '0'
  - id: an_lidr
    type: float
    restore_value: no
    initial_value: '0'
  - id: an_smile               # 0 open .. 1 a happy arch
    type: float
    restore_value: no
    initial_value: '0'
  - id: an_hs                  # eye height scale (bounce, wide)
    type: float
    restore_value: no
    initial_value: '1'
  - id: an_mouth               # 0 .. 1, the yawn
    type: float
    restore_value: no
    initial_value: '0'
  - id: an_zph                 # phase of the drifting z's, 0 .. 1
    type: float
    restore_value: no
    initial_value: '0'
  # TRUE WHILE AN ANIMATION FRAME IS BEING DRAWN, and this time it is sound.
  #
  # The first attempt was not. mipi_spi flushes the BOUNDING BOX of what was
  # drawn, out of a buffer one band tall that is reused for all six bands and
  # never cleared while auto_clear is off -- so any pixel inside that box which
  # the pass did not draw is sent to the panel as a different slice of the
  # screen. Drawing just the eye box left most of its own bounding box
  # untouched on the band straddling its bottom edge, and that is what erased
  # Sam's clock time ten times a second.
  #
  # What makes it work is CLIPPING, which I dismissed without reading:
  # Display::fill() is filled_rectangle over the whole screen, and every pixel
  # of it goes through the clipping test. So with a clip set, a fill touches
  # exactly the clipped region and marks exactly it dirty. The drawn set IS
  # its own bounding box, which is the property the first attempt lacked.
  #
  # The clip starts at y = 0 on purpose. The driver abandons the whole frame
  # at the first band that comes back empty, so a region starting at y = 66
  # would abort in band 0 before anything reached the glass. Starting at the
  # top means the bands that abort are the ones BELOW the region -- the ones
  # with nothing to say, whose time and countdown keep what they have.
  #
  # Why it is worth the trouble: a full frame is 360 x 360 x 2 bytes, which
  # the bench measured at 207 ms at 10 MHz, so 52 at 40. A panel refresh is
  # about 16. No clock rate makes a full-frame change arrive inside one
  # refresh -- that is arithmetic, and it is why raising the SPI clock alone
  # could not fix this. The clipped region is 248 x 244, about 121 KB, which
  # is roughly one refresh at 40 MHz.
  - id: an_partial
    type: bool
    restore_value: no
    initial_value: 'false'
  # WHICH BAND THE DRIVER IS ASKING FOR, 0..5. mipi_spi runs the display lambda
  # once per band, top to bottom, and gives it no way to ask which one -- so it
  # is counted. Incremented on the FIRST LINE of the lambda so every early
  # return is covered, wrapped at 6, and reset to 0 immediately before each
  # component.update so a lost frame cannot leave it out of step.
  #
  # It is only ever used to NARROW what gets drawn, never to move anything. If
  # it ever did drift, a band would come back with the marker alone: a missed
  # repaint, not a corrupted one.
  - id: an_band
    type: int
    restore_value: no
    initial_value: '0'
  # WHAT THE PANEL IS ALREADY SHOWING. The animation frame used to be drawn
  # ten times a second whether or not anything had moved, which is most of the
  # time: the animator spends far longer in an idle gap holding a resting pose
  # than it does inside a clip. Every one of those repaints is six lambda
  # passes and four banded flushes, and on the panel it reads as the graphics
  # flickering. These hold the pose as last DRAWN, and the frame is skipped
  # unless the pose has actually changed. Set after the update, not before, so
  # a frame that never made it to the panel is not recorded as shown.
  - id: an_dgx
    type: float
    restore_value: no
    initial_value: '-999'
  - id: an_dgy
    type: float
    restore_value: no
    initial_value: '-999'
  - id: an_dlidl
    type: float
    restore_value: no
    initial_value: '-999'
  - id: an_dlidr
    type: float
    restore_value: no
    initial_value: '-999'
  - id: an_dsmile
    type: float
    restore_value: no
    initial_value: '-999'
  - id: an_dhs
    type: float
    restore_value: no
    initial_value: '-999'
  - id: an_dmouth
    type: float
    restore_value: no
    initial_value: '-999'
  - id: an_dzq                 # the z-drift, quantised: 8 steps a cycle, not 10 a second
    type: int
    restore_value: no
    initial_value: '-1'
  - id: an_dzph                # ...and the phase itself, as drawn
    type: float
    restore_value: no
    initial_value: '0'
  - id: an_lastdraw            # millis() of the last animation repaint
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: an_frame_t0            # millis() when the current frame started
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: grow_paint_key         # hash of everything a FULL frame draws that an
    type: uint32_t              # animation frame does not; a change means repaint
    restore_value: no
    initial_value: '0'
  - id: grow_paint_at          # millis() of the last full repaint
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: grow_paint_want        # dispatcher -> the update action, this tick
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: grow_bl_last           # backlight level last set by grow mode; -1 = none
    type: float
    restore_value: no
    initial_value: '-1.0'
  - id: grow_since_wake        # minutes since the scheduled wake; -1 outside the wake window
    type: int
    restore_value: no
    initial_value: '-1'
  - id: grow_min_to            # minutes to the next change of state; -1 unknown
    type: int
    restore_value: no
    initial_value: '-1'
  - id: grow_daytime           # "clock by day" has handed the panel back to the clock
    type: bool
    restore_value: no
    initial_value: 'false'

  # Drives pulses and the test chase. Deliberately independent of wall-clock
  # time so animations still run before the first sync.
  - id: frame
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ha_connected
    type: bool
    restore_value: no
    initial_value: 'false'

  # Resolved once per tick from panel_choice + the strap, so the render
  # interval and both lambdas all read the same answer.
  - id: bar_active
    type: bool
    restore_value: no
    initial_value: 'false'

  # ---------------------------------------------------------------------------
  # RESOLVED PALETTE — the single place colour is decided
  # ---------------------------------------------------------------------------
  # Both renderers read plain ints from here and do no colour maths of their
  # own. That is deliberate, and it is the same argument the brightness cap
  # makes further down: a value computed in one auditable place can be reasoned
  # about, and one scattered across two lambdas cannot. The ring lambda is also
  # a bare function pointer that cannot capture, so a shared helper was never
  # an option — a global is.
  #
  # Layout is flat rather than [5][3] because ESPHome global arrays take a
  # single initial_value literal, and a flat one is unambiguous.
  #   pal_ring: hour 0-2, minute 3-5, second 6-8, timer 9-11, pip 12-14
  #   pal_scr : hour 0-2, minute 3-5, second 6-8, timer 9-11
  #
  # Initial values are the "default" preset already resolved, so the very first
  # frames are correct in the gap before the resolver's first tick.
  # 0-2 hour, 3-5 minute, 6-8 second, 9-11 timer, 12-14 pip, 15-17 alert.
  # millis() at the moment the alert flag last went true. See `alert_seconds`.
  # Not restored: an alarm does not survive a reboot, and a stale stamp would
  # make the first alert after power-up expire immediately.
  - id: alert_since
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: pal_ring
    type: int[18]
    restore_value: no
    initial_value: '{255,90,20, 30,120,255, 90,90,90, 0,90,80, 0,60,55, 255,85,0}'
  - id: pal_scr
    type: int[12]
    restore_value: no
    initial_value: '{235,144,105, 106,153,224, 158,158,158, 94,235,219}'

# -----------------------------------------------------------------------------
# PALETTE RESOLVER
# -----------------------------------------------------------------------------
# Runs the theme (or the twelve custom numbers) through HSV -> RGB once every
# 250 ms. A quarter second is imperceptible when dragging a slider and costs
# nothing next to the 20 fps render.
#
# The ring and the screen get DIFFERENT values from the same hue, which is the
# whole reason the palette is authored in HSV:
#
#   ring   — value as authored. These are bare emitters seen from a metre away,
#            and the timer arc is deliberately dim so it never reads as a hand.
#   screen — saturation x0.6 and a value set by the element's ROLE, not by the
#            ring's. Fully saturated text on a dark panel is harsh, and the
#            ring's value encodes LED power, not importance. The timer
#            countdown is the hero element when a timer runs and has to stay
#            bright even though its ring counterpart is dim.
interval:
  # ---------------------------------------------------------------------------
  # PANEL SELECTION — which screen is fitted, and which one gets drawn
  # ---------------------------------------------------------------------------
  # WHY THIS IS A STRAP AND NOT A PROBE. The obvious auto-detect is to read the
  # controller's ID register and branch on it. That is not available here, and
  # the reason is in the hardware rather than the software: BOTH modules are
  # write-only. The round panel brings SDO out on its header but it is left
  # unconnected and `spi:` below declares no miso_pin; the bar module has no
  # such pin AT ALL -- Waveshare's own wiki says the slave-to-host data pin "is
  # hidden as it only needs to display", and done.land's teardown of the same
  # module lists eight pins with no SDO and no TE. There is no bus to ask the
  # question over.
  #
  # So the answer comes from the cable. The bar panel needs its own cable
  # anyway -- eight pins in a different order against the round one's ten -- and
  # one more wire from ${panel_detect} to GND in that cable makes the detection
  # deterministic instead of inferred.
  #
  # WHY BOTH DRIVERS ARE COMPILED IN AND NEITHER IS RE-INITIALISED. ESPHome's
  # mipi_spi sends its init sequence once, in setup(), and then does
  # `this->init_sequence_.clear()` -- verified in mipi_spi.h at 2026.8.0. The
  # sequence is gone after boot, so "re-init the panel the user just picked"
  # is not a thing that can be done at runtime, by any lambda, at all.
  #
  # What makes two panels coexist anyway is that each has its OWN CS and its
  # OWN RESET. Both init sequences go out at boot; each is addressed to its own
  # chip select, so neither panel ever sees the other's. Sharing the reset line
  # would break exactly this -- the second component's reset pulse would clear
  # the first panel after it had been initialised -- which is why lcd_reset_bar
  # exists rather than reusing ${lcd_reset}.
  - interval: 1s
    then:
      # ---- GROW CLOCK STATE MACHINE ----------------------------------------
      # Runs whether or not grow mode is on, so flipping the switch shows the
      # right state on the very next frame instead of one second later.
      - lambda: |-
          const auto now = id(ha_time).now();
          int st = 2, sched = 2; float frac = 1.0f;
          if (now.is_valid()) {
            const int m   = now.hour * 60 + now.minute;
            const int dow = now.day_of_week;             // 1 = Sunday .. 7 = Saturday
            const bool wknd = id(grow_holiday).state
                           || (id(grow_weekend).state && (dow == 1 || dow == 7));
            const int wake = wknd
              ? (int) id(grow_wake_h_wknd).state * 60 + (int) id(grow_wake_m_wknd).state
              : (int) id(grow_wake_h).state * 60      + (int) id(grow_wake_m).state;
            const int bed   = (int) id(grow_bed_h).state * 60 + (int) id(grow_bed_m).state;
            const int warn  = (int) id(grow_warn_min).state;
            const int bwarn = (int) id(grow_bed_warn_min).state;
            // Half-open windows on a 1440-minute circle. a <= b is an ordinary
            // window; a > b is one that crosses midnight, which the sleep window
            // always does and the "almost" window does for anyone waking before
            // their warning length past midnight.
            auto inwin = [](int a, int b, int x) {
              return a <= b ? (x >= a && x < b) : (x >= a || x < b);
            };
            auto span = [](int a, int b) { return ((b - a) % 1440 + 1440) % 1440; };
            const int almost0 = ((wake - warn)  % 1440 + 1440) % 1440;
            const int bwarn0  = ((bed  - bwarn) % 1440 + 1440) % 1440;
            if      (warn  > 0 && inwin(almost0, wake, m)) sched = 1;
            else if (inwin(wake, bwarn0, m))               sched = 2;
            else if (bwarn > 0 && inwin(bwarn0, bed, m))   sched = 3;
            else                                           sched = 0;

            // An override lasts until the schedule moves on by itself.
            if (id(grow_override) != 0 && sched != id(grow_sched_at_override))
              id(grow_override) = 0;
            st = sched;
            if (id(grow_override) == 1) st = 2;
            if (id(grow_override) == 2) st = 0;

            // Stars: the fraction of the night still to go. Measured from bed
            // to wake so a "sleep now" at 18:30 still counts down to 7:00.
            if (st == 0) {
              int total = span(bed, wake); if (total <= 0) total = 1;
              int left  = span(m, wake);   if (left > total) left = total;
              frac = (float) left / (float) total;
            }

            // A nap beats everything, and ends itself.
            const uint32_t ts = (uint32_t) now.timestamp;
            if (id(grow_nap_end) > ts) {
              st = 4;
              const float tot = id(grow_nap_min).state * 60.0f;
              frac = (float) (id(grow_nap_end) - ts) / (tot > 1.0f ? tot : 1.0f);
              if (frac > 1.0f) frac = 1.0f;
            } else if (id(grow_nap_end) != 0) {
              id(grow_nap_end) = 0;                      // nap over: back to schedule
            }

            // Minutes since the scheduled wake (the sunrise fade, the wake
            // effect and "clock by day" all count from it), and minutes to
            // whatever comes next, for the countdown and the sensor.
            id(grow_since_wake) = (sched == 2 && id(grow_override) == 0 && st == 2)
                                ? span(wake, m) : -1;
            int nxt;
            if      (st == 2) nxt = span(m, bwarn > 0 ? bwarn0 : bed);
            else if (st == 3) nxt = span(m, bed);
            else              nxt = span(m, wake);
            id(grow_min_to) = nxt;
            const float mtw = (float) span(m, wake);
            if (isnan(id(grow_minutes_to_wake).state)
                || fabsf(id(grow_minutes_to_wake).state - mtw) >= 0.5f)
              id(grow_minutes_to_wake).publish_state(mtw);
            // "Clock by day": the wake window has held long enough, hand the
            // panel and the ring back to the ordinary clock.
            id(grow_daytime) = id(grow_day_clock).state && st == 2
                               && id(grow_since_wake) >= (int) id(grow_wake_hold_min).state;
          } else {
            id(grow_since_wake) = -1; id(grow_min_to) = -1; id(grow_daytime) = false;
          }
          // A forced expression, for demos and daylight checks.
          const std::string fx = id(grow_expression).current_option().str();
          if      (fx == "sleeping") st = 0;
          else if (fx == "almost")   st = 1;
          else if (fx == "awake")    st = 2;
          else if (fx == "bedtime")  st = 3;
          if (fx != "auto") id(grow_daytime) = false;   // a demo shows the face

          id(grow_sched) = sched;
          id(grow_st)    = st;
          id(grow_frac)  = frac;
          static const char *names[] = {"sleep", "almost", "awake", "bedtime", "nap"};
          if (id(grow_state).state != names[st]) id(grow_state).publish_state(names[st]);

          // ---- the backlight follows the state -----------------------------
          // Only touched when the wanted level CHANGES, so this does not fight
          // the Backlight light entity every second. Leaving grow mode puts the
          // backlight back to full, once, and then leaves it alone.
          // MY FREEZE TEST HAD A HOLE IN IT. screen_freeze stops
          // component.update on the panel, so no PIXELS go down the SPI bus --
          // but it never stopped this block, which drives the BACKLIGHT. So
          // "still flickers while frozen" did not prove the hardware after
          // all: the backlight was still being written the whole time.
          // Frozen now means frozen: no pixels and no backlight changes.
          if (id(screen_freeze).state) {
            // leave the backlight exactly where it is
          } else if (id(grow_mode).state && !id(grow_daytime)) {
            const bool nightish = (st == 0 || st == 3 || st == 4);
            const float bn = id(grow_night_bright).state / 100.0f;
            const float bd = id(grow_day_bright).state / 100.0f;
            float b = (nightish && id(grow_dim).state) ? bn : bd;
            // sunrise: fade up from the night level over grow_fade_min
            const int fade = (int) id(grow_fade_min).state, sw = id(grow_since_wake);
            if (st == 2 && fade > 0 && sw >= 0 && sw < fade)
              b = bn + (bd - bn) * ((float) sw + 0.5f) / (float) fade;
            const bool sound = id(grow_sound).state && (st == 0 || st == 4)
                && id(grow_sound_since) != 0
                && (uint32_t)(millis() - id(grow_sound_since))
                   < (uint32_t) lroundf(id(grow_sound_secs).state * 1000.0f);
            if (sound && b < 0.6f) b = 0.6f;
            if (fabsf(b - id(grow_bl_last)) > 0.005f) {
              auto c = id(backlight).turn_on(); c.set_brightness(b); c.perform();
              id(grow_bl_last) = b;
            }
          } else if (id(grow_bl_last) >= 0.0f) {
            auto c = id(backlight).turn_on(); c.set_brightness(1.0f); c.perform();
            id(grow_bl_last) = -1.0f;
          }
      - lambda: |-
          // current_option(), not .state. The compiler says: "'Select::state' is
          // deprecated: Use current_option() instead of .state. Will be removed
          // in 2026.7.0". This still built, but it is the LAST release where it
          // does -- and 2026.7.0 does not exist yet, so this would have turned
          // into a hard build failure on Sam's next ESPHome update, months from
          // now, with nothing obviously connecting it to this file.
          const std::string want = id(panel_choice).current_option().str();
          bool bar = id(bar_active);
          if      (want == "bar 320x170")   bar = true;
          else if (want == "round 360x360") bar = false;
          else                              bar = id(panel_strap).state;
          id(bar_active) = bar;
      # ---- REPAINT ON CHANGE, NOT ON THE TICK -------------------------------
      # This dispatcher used to end with an unconditional full repaint, every
      # second, forever. That is more expensive than it looks. An animation
      # frame sets a clipping window, and mipi_spi's fill() falls back to the
      # base implementation when clipping is set, so only the eye box is marked
      # dirty. A FULL frame has no clip, so fill() takes its fast path: it wipes
      # the band buffer and marks the ENTIRE band dirty. Every one of those
      # repaints therefore pushed all 360 x 360 x 16 bits down the bus --
      # 259200 bytes, about 52 ms at 40 MHz -- at a panel that refreshes in
      # roughly 16, sixty times a minute, on a screen where between one second
      # and the next almost nothing has changed.
      #
      # The key below covers everything a full frame draws that an animation
      # frame does NOT: the field outside the eye box, the star row, the
      # countdown, and the digital time. The eyes, the z's, the sky and "shh"
      # all sit inside the animation clip and the partial frames keep them
      # current, so they are deliberately absent -- putting them in would repaint
      # the whole panel on every blink, which is the behaviour being removed.
      #
      # Gated in grow mode only. The ordinary clock face has a second hand and
      # has earned its second. And a 10 s floor underneath, so if the key is
      # ever missing an input the panel goes stale for ten seconds rather than
      # forever -- a bounded bug instead of an unbounded one.
      - lambda: |-
          bool want = true;
          uint32_t key = 0;
          auto mix  = [&key](uint32_t v) { key = (key ^ v) * 16777619u; };
          auto mixs = [&mix](const std::string &v) {
            for (char c : v) mix((uint32_t)(uint8_t) c);
          };
          if (id(grow_mode).state && !id(grow_daytime) && !id(grow_paint_1s).state) {
            const auto now = id(ha_time).now();
            const int st = id(grow_st);
            mix((uint32_t) st);
            mix(id(display_on).state ? 1u : 0u);
            mix(id(screen_on).state ? 2u : 0u);
            mixs(id(grow_face).current_option().str());
            mixs(id(grow_sleep_colour).current_option().str());
            mixs(id(grow_wake_colour).current_option().str());
            mixs(id(grow_almost_colour).current_option().str());
            mixs(id(grow_bedtime_colour).current_option().str());
            // "shh" lives inside the clip, but it is one bit and it changes
            // about twice a night, so it costs nothing to be safe about it.
            const bool sound = id(grow_sound).state && (st == 0 || st == 4)
                && id(grow_sound_since) != 0
                && (uint32_t)(millis() - id(grow_sound_since))
                   < (uint32_t) lroundf(id(grow_sound_secs).state * 1000.0f);
            mix(sound ? 4u : 0u);
            // The star row: what is drawn is the COUNT lit, not the fraction,
            // so hash the count. grow_frac slides continuously and would
            // otherwise force a repaint every single second for a row of dots
            // that changes about once every few minutes.
            if (id(grow_stars).state && (st == 0 || st == 4)) {
              const int NS = std::max(3, std::min(12, (int) id(grow_star_count).state));
              int lit = (int) ceilf(id(grow_frac) * NS); if (lit > NS) lit = NS;
              mix(0xA1u); mix((uint32_t) NS); mix((uint32_t) lit);
              mixs(id(grow_star_shape).current_option().str());
            }
            if (id(grow_show_countdown).state && (st == 1 || st == 3) && id(grow_min_to) >= 0) {
              mix(0xB2u); mix((uint32_t) id(grow_min_to));
            }
            if (id(grow_show_time).state && now.is_valid()) {
              mix(0xC3u); mix((uint32_t) now.hour); mix((uint32_t) now.minute);
              mix(id(fmt_24h).state ? 8u : 0u);
            }
            want = key != id(grow_paint_key)
                || (uint32_t)(millis() - id(grow_paint_at)) >= 10000u;
          }
          // The freeze switch wins over everything, including the 10 s floor
          // and the non-grow path that is otherwise never gated. Nothing goes
          // to the panel while it is on.
          if (id(screen_freeze).state) want = false;
          if (want) { id(grow_paint_key) = key; id(grow_paint_at) = millis(); }
          id(grow_paint_want) = want;
      - if:
          condition:
            lambda: 'return id(grow_paint_want);'
          then:
            - if:
                condition:
                  lambda: 'return id(bar_active);'
                then:
                  - component.update: bar_lcd
                else:
                  - lambda: 'id(an_band) = 0;'
                  - component.update: face_lcd

  # ---- Grow eye animator, 10 fps -----------------------------------------------
  # A clip library and a scheduler. Each state has a table of clips with
  # weights and an idle gap; the scheduler draws the next clip, its length
  # and its gaze targets from a 32-bit LCG, plays it through envelopes, and
  # rests the eyes between clips. The outputs are per-frame numbers (gaze,
  # lids, smile, height, mouth) that both panel lambdas turn into pixels.
  #
  # This is the SAME engine as preview/grow_anim.py, constant for constant;
  # that file renders it to GIFs so a change can be watched before a flash.
  # Awake draws about 225 clips in 20 minutes, none of them identical -- the
  # variety is in the parameters, the sequence period is 2^32 draws.
  #
  # 100 ms. It was briefly 50, to allow 20 fps once the clipped repaint made
  # a frame cheap -- and that is the change that made the ORDINARY CLOCK
  # start flickering too, which it never had. A clipped frame being cheap is
  # not the same as the loop being free: at 50 ms of animator plus 10 fps of
  # repaint the board stopped keeping up, and everything sharing that loop --
  # the clock face, the ring -- went with it. Reverted, and the lesson is
  # that the budget is the LOOP, not the SPI.
  - interval: 100ms
    then:
      - lambda: |-
          if (!id(grow_mode).state || id(grow_daytime)) { id(an_clip) = 0; return; }
          const uint32_t ms = millis();
          const int st = id(grow_st);

          // resting pose: how much of the eye the lid covers, and the smile
          float base_lid, base_smile;
          if      (st == 0 || st == 4) { base_lid = 1.0f;  base_smile = 0.0f;  }
          else if (st == 1)            { base_lid = 0.45f; base_smile = 0.0f;  }
          else if (st == 2)            { base_lid = 0.0f;  base_smile = 0.35f; }
          else                         { base_lid = 0.55f; base_smile = 0.0f;  }

          auto rnd = [&]() -> uint32_t {
            id(an_seed) = id(an_seed) * 1664525u + 1013904223u;
            return (id(an_seed) >> 8) & 0xFFFFFFu;
          };
          auto rr = [&](int lo, int hi) -> int {
            return lo + (int) (rnd() % (uint32_t) (hi - lo + 1));
          };
          auto ease = [](float u) -> float {
            u = u < 0 ? 0 : u > 1 ? 1 : u; return u * u * (3 - 2 * u);
          };
          auto tri = [](float u) -> float { return u < 0.5f ? u * 2 : 2 - u * 2; };
          auto hold = [&](float u, float a, float b) -> float {
            return u < a ? ease(u / a) : u < b ? 1.0f : ease((1 - u) / (1 - b));
          };

          // clips
          enum { NONE, BLINK, DBLINK, LOOK, LOOK_AROUND, SMILE, WINK, BOUNCE, WIDE,
                 SQUINT, ROLL, WIGGLE, YAWN, SLOW_BLINK, PEEK, DRIFT, NOD, TWITCH, DANCE };
          static const uint16_t DLO[19] = {0, 360, 800, 1500, 4000, 2000, 700, 900, 1200,
                                           1500, 1600, 900, 3000, 1200, 1800, 4000, 2400, 400, 2400};
          static const uint16_t DHI[19] = {0, 360, 800, 3500, 6000, 4000, 700, 900, 1200,
                                           2500, 1600, 900, 3000, 1200, 1800, 6000, 2400, 400, 2400};
          // {clip, weight} per state, weights sum to 100
          static const uint8_t T_AWAKE[12][2]   = {{LOOK, 22}, {LOOK_AROUND, 14}, {BLINK, 14},
                                                   {DBLINK, 5}, {SMILE, 16}, {WINK, 4}, {BOUNCE, 6},
                                                   {WIDE, 3}, {SQUINT, 4}, {ROLL, 3}, {WIGGLE, 4},
                                                   {DANCE, 5}};
          static const uint8_t T_ALMOST[8][2]   = {{SLOW_BLINK, 22}, {BLINK, 10}, {LOOK, 15},
                                                   {YAWN, 15}, {PEEK, 12}, {DRIFT, 14}, {SQUINT, 6},
                                                   {SMILE, 6}};
          static const uint8_t T_BEDTIME[7][2]  = {{YAWN, 26}, {SLOW_BLINK, 20}, {NOD, 16},
                                                   {DRIFT, 14}, {LOOK, 10}, {BLINK, 9}, {SQUINT, 5}};
          static const uint8_t T_SLEEP[1][2]    = {{TWITCH, 100}};
          const uint8_t (*tbl)[2]; int tn; int glo, ghi;
          if      (st == 2) { tbl = T_AWAKE;   tn = 12; glo = 1500;  ghi = 5000;  }
          else if (st == 1) { tbl = T_ALMOST;  tn = 8;  glo = 2000;  ghi = 6000;  }
          else if (st == 3) { tbl = T_BEDTIME; tn = 7;  glo = 2000;  ghi = 7000;  }
          else              { tbl = T_SLEEP;   tn = 1;  glo = 12000; ghi = 30000; }
          const int GAZE_X = 20, GAZE_Y = 12;

          if (st != id(an_stlast)) {
            // a state change cancels the clip and rests the eyes. The first
            // one after boot also stirs the seed, so two clocks do not blink
            // in step.
            if (id(an_stlast) < 0) id(an_seed) ^= ms * 2654435761u;
            id(an_clip) = 0; id(an_next) = ms + 1500; id(an_stlast) = st;
          }
          if (id(grow_animate).state && (int32_t) (ms - id(an_next)) >= 0) {
            const int r = rr(0, 99);
            int acc = 0, c = tbl[tn - 1][0];
            for (int i = 0; i < tn; i++) { acc += tbl[i][1]; if (r < acc) { c = tbl[i][0]; break; } }
            id(an_clip) = c; id(an_t0) = ms; id(an_dur) = rr(DLO[c], DHI[c]);
            const float k = st == 2 ? 1.0f : 0.6f;       // small looks when sleepy
            id(an_p1) = (int) (rr(-GAZE_X, GAZE_X) * k); id(an_p2) = (int) (rr(-GAZE_Y, GAZE_Y) * k);
            id(an_p3) = (int) (rr(-GAZE_X, GAZE_X) * k); id(an_p4) = (int) (rr(-GAZE_Y, GAZE_Y) * k);
            id(an_next) = ms + id(an_dur) + rr(glo, ghi);
          }

          int c = id(an_clip);
          float u = c ? (float) (ms - id(an_t0)) / (float) id(an_dur) : 1.0f;
          if (u >= 1.0f) { c = NONE; u = 1.0f; id(an_clip) = 0; }

          float lidl = base_lid, lidr = base_lid, smile = base_smile, hs = 1.0f, mouth = 0.0f;
          float tx = 0, ty = 0; bool direct = false; float dx = 0, dy = 0;
          const int p1 = id(an_p1), p2 = id(an_p2), p3 = id(an_p3), p4 = id(an_p4);
          const float PI2 = 6.2831853f;
          switch (c) {
            case BLINK:      lidl = lidr = std::max(base_lid, tri(u)); break;
            case DBLINK:     lidl = lidr = std::max(base_lid, tri(fmodf(u * 2, 1.0f))); break;
            case LOOK:       tx = p1; ty = p2; break;
            case LOOK_AROUND:
              if (u < 0.45f) { tx = p1; ty = p2; } else if (u < 0.9f) { tx = p3; ty = p4; }
              break;
            case SMILE:      smile = std::max(base_smile, hold(u, 0.2f, 0.75f)); break;
            case WINK:
              lidr = std::max(base_lid, hold(u, 0.25f, 0.65f));
              smile = std::max(base_smile, 0.6f * hold(u, 0.25f, 0.65f));
              break;
            case BOUNCE:     hs = 1 + 0.16f * sinf(PI2 * u) * (1 - u); break;
            case WIDE:
              lidl = lidr = 0; hs = 1 + 0.15f * hold(u, 0.2f, 0.7f); ty = -3 * hold(u, 0.2f, 0.7f);
              break;
            case SQUINT:
              lidl = lidr = std::max(base_lid, 0.45f * hold(u, 0.25f, 0.75f)); tx = p1; ty = -6;
              break;
            case ROLL:       direct = true; dx = 14 * cosf(PI2 * u); dy = 9 * sinf(PI2 * u); break;
            case WIGGLE:     direct = true; dx = 10 * sinf(2 * PI2 * u) * (1 - u); break;
            case YAWN: {
              const float e = hold(u, 0.3f, 0.8f);
              lidl = lidr = std::max(base_lid, e); mouth = hold(u, 0.35f, 0.7f); ty = 4 * mouth;
              break;
            }
            case SLOW_BLINK: lidl = lidr = std::max(base_lid, tri(u)); break;
            case PEEK: {
              const float e = hold(u, 0.3f, 0.7f);
              lidl = lidr = base_lid * (1 - e); ty = -3 * e;
              break;
            }
            case DRIFT:      lidl = lidr = std::min(0.95f, base_lid + 0.25f * sinf(3.14159265f * u)); break;
            case NOD:
              if (u < 0.55f) {
                const float e = ease(u / 0.55f);
                lidl = lidr = base_lid + (0.95f - base_lid) * e; ty = 10 * e;
              } else if (u < 0.7f) { lidl = lidr = 0.15f; ty = -4; }
              else {
                const float e = 1 - ease((u - 0.7f) / 0.3f);
                lidl = lidr = base_lid + (0.15f - base_lid) * e;
              }
              break;
            case TWITCH:     direct = true; dx = 3 * sinf(2 * PI2 * u) * (1 - u); break;
            case DANCE:
              smile = 1; hs = 1 + 0.14f * sinf(2 * PI2 * u) * (1 - 0.5f * u);
              direct = true; dx = 10 * sinf(PI2 * u);
              break;
            default: break;
          }
          if (direct) { id(an_gx) = dx; id(an_gy) = dy; }
          else {
            id(an_gx) += (tx - id(an_gx)) * 0.4f;
            id(an_gy) += (ty - id(an_gy)) * 0.4f;
          }
          id(an_lidl) = lidl; id(an_lidr) = lidr; id(an_smile) = smile;
          id(an_hs) = hs; id(an_mouth) = mouth;
          id(an_zph) = (ms % 3000) / 3000.0f;
      # An animation frame: only when there is something to animate and the
      # panel is showing it. The lambda sees an_partial and repaints just the
      # eye box, so the driver flushes just that.
      - if:
          condition:
            lambda: |-
              if (id(screen_freeze).state) return false;      // see screen_freeze
              if (!id(grow_mode).state || id(grow_daytime) || !id(grow_animate).state) return false;
              if (!id(display_on).state || !id(screen_on).state) return false;
              if (id(clock_face).current_option().str() == "colour test") return false;
              const std::string fs = id(grow_face).current_option().str();
              if (!(fs == "eyes" || fs == "eyes and sky" || fs == "eyes on colour"))
                return false;
              // ...AND ONLY IF THE EYES HAVE MOVED. Without this the panel is
              // repainted ten times a second through an idle gap in which
              // nothing changes, which is what Sam saw as the graphics
              // flickering. The thresholds are below what a pixel can show:
              // the gaze moves the pupil by a few pixels per unit, and the
              // lids, the smile, the squash and the yawn are all 0..1 over
              // the eye's own height.
              // A full frame is 104 ms of SPI plus six passes of drawing, so
              // the repaint cannot run at the animator's own 100 ms tick --
              // and if a frame starts before the last one has finished
              // walking down the panel, the glass never shows one whole
              // picture. That is the flicker. grow_anim_ms is the floor
              // between repaints and it is Sam's to turn, because the right
              // value is something you look at.
              // A BLINK IS THE FAST PART, and it was the part being dropped.
              // The lid crosses its whole range in a couple of hundred
              // milliseconds; at the dial's own interval that is one frame, and
              // one frame of a blink is a snap, not a blink. So while a lid, the
              // squash or the mouth is actually moving, the floor halves --
              // never below 150 ms, which is where the loop stops keeping up.
              // The idle gap keeps the dial's value, so nothing is spent on a
              // face that is holding still.
              const float mv = std::max(
                  std::max(fabsf(id(an_lidl) - id(an_dlidl)),
                           fabsf(id(an_lidr) - id(an_dlidr))),
                  std::max(fabsf(id(an_hs)   - id(an_dhs)),
                           fabsf(id(an_mouth) - id(an_dmouth))));
              const uint32_t dial = (uint32_t) id(grow_anim_ms).state;
              const uint32_t floor_ms = mv > 0.06f
                  ? std::max<uint32_t>(150u, dial / 2u) : dial;
              if (millis() - id(an_lastdraw) < floor_ms)
                return false;
              // Frozen: keep drawing at the same cadence, same picture. The
              // dirty check below would otherwise stop the test dead, since
              // by definition nothing has moved.
              if (id(grow_freeze).state) return true;
              const int zq = (int) (id(an_zph) * 8.0f);
              return fabsf(id(an_gx)    - id(an_dgx))    > 0.02f
                  || fabsf(id(an_gy)    - id(an_dgy))    > 0.02f
                  || fabsf(id(an_lidl)  - id(an_dlidl))  > 0.01f
                  || fabsf(id(an_lidr)  - id(an_dlidr))  > 0.01f
                  || fabsf(id(an_smile) - id(an_dsmile)) > 0.01f
                  || fabsf(id(an_hs)    - id(an_dhs))    > 0.01f
                  || fabsf(id(an_mouth) - id(an_dmouth)) > 0.01f
                  || zq != id(an_dzq);
          then:
            # Advance the drawn pose FIRST: the lambda renders from these, so
            # this is what makes the frame show something new. Unless the
            # freeze switch is on, in which case the frame still runs and
            # still writes to the panel -- it just writes the same picture.
            - lambda: |-
                if (!id(grow_freeze).state) {
                  id(an_dgx)    = id(an_gx);    id(an_dgy)    = id(an_gy);
                  id(an_dlidl)  = id(an_lidl);  id(an_dlidr)  = id(an_lidr);
                  id(an_dsmile) = id(an_smile); id(an_dhs)    = id(an_hs);
                  id(an_dmouth) = id(an_mouth); id(an_dzph)   = id(an_zph);
                  id(an_dzq)    = (int) (id(an_zph) * 8.0f);
                }
                id(an_frame_t0) = millis();
                // PARTIAL by default now. A full animation frame walks all
                // 360 rows past a scan that is walking them too, and every
                // crossing shows on anything that is being redrawn unchanged.
                // See grow_partial and "THE ANIMATION BOX".
                id(an_partial) = id(grow_partial).state;
            - if:
                condition:
                  lambda: 'return id(bar_active);'
                then:
                  - component.update: bar_lcd
                else:
                  - lambda: 'id(an_band) = 0;'
                  - component.update: face_lcd
            - lambda: |-
                id(an_partial) = false;
                const uint32_t now_ms = millis();
                id(an_lastdraw) = now_ms;
                // A full animation frame has just repainted the whole panel,
                // so the 1 s dispatcher must not turn round and do it again a
                // few milliseconds later. Resetting the floor here is what
                // keeps the two paths from walking down the glass over each
                // other, which is the thing 6702d52 got wrong.
                if (!id(grow_partial).state) id(grow_paint_at) = now_ms;
                const float dt = (float) (now_ms - id(an_frame_t0));
                if (isnan(id(grow_frame_ms).state)
                    || fabsf(id(grow_frame_ms).state - dt) >= 1.0f)
                  id(grow_frame_ms).publish_state(dt);

  - interval: 250ms
    then:
      - lambda: |-
          // h 0-360, s 0-100, v 0-100 -> RGB 0-255.
          auto hsv = [](float h, float s, float v, int *out) {
            h = fmodf(h, 360.0f); if (h < 0.0f) h += 360.0f;
            s = s < 0.0f ? 0.0f : (s > 100.0f ? 100.0f : s) / 100.0f;
            v = v < 0.0f ? 0.0f : (v > 100.0f ? 100.0f : v) / 100.0f;
            const float c = v * s;
            const float x = c * (1.0f - fabsf(fmodf(h / 60.0f, 2.0f) - 1.0f));
            const float m = v - c;
            float r = 0.0f, g = 0.0f, b = 0.0f;
            if      (h <  60.0f) { r = c; g = x; }
            else if (h < 120.0f) { r = x; g = c; }
            else if (h < 180.0f) { g = c; b = x; }
            else if (h < 240.0f) { g = x; b = c; }
            else if (h < 300.0f) { r = x; b = c; }
            else                 { r = c; b = x; }
            out[0] = (int) lroundf((r + m) * 255.0f);
            out[1] = (int) lroundf((g + m) * 255.0f);
            out[2] = (int) lroundf((b + m) * 255.0f);
          };

          // hue, saturation, value for hour, minute, second, timer, pip.
          // The presets are the previous hardcoded RGB triples converted to
          // HSV, so they round-trip to within a unit or two of what they were.
          float T[6][3] = {
            { 17.9f,  92.2f, 100.0f},   // hour
            {216.0f,  88.2f, 100.0f},   // minute
            {  0.0f,   0.0f,  35.3f},   // second
            {173.3f, 100.0f,  35.3f},   // timer
            {175.0f, 100.0f,  23.5f},   // pip
            { 20.0f, 100.0f, 100.0f},   // alert — overwritten below
          };

          const std::string th = id(colour_theme).current_option().str();
          if (th == "warm") {
            T[0][0]= 16.5f; T[0][1]=100.0f; T[0][2]=100.0f;
            T[1][0]= 33.5f; T[1][1]= 84.3f; T[1][2]=100.0f;
            T[2][0]= 24.0f; T[2][1]= 83.3f; T[2][2]= 47.1f;
            T[3][0]= 24.0f; T[3][1]=100.0f; T[3][2]= 78.4f;
            T[4][0]= 25.0f; T[4][1]=100.0f; T[4][2]= 47.1f;
          } else if (th == "cool") {
            T[0][0]=204.4f; T[0][1]= 52.9f; T[0][2]=100.0f;
            T[1][0]=226.0f; T[1][1]= 84.3f; T[1][2]=100.0f;
            T[2][0]=210.0f; T[2][1]= 50.0f; T[2][2]= 47.1f;
            T[3][0]=198.0f; T[3][1]=100.0f; T[3][2]= 78.4f;
            T[4][0]=200.0f; T[4][1]=100.0f; T[4][2]= 47.1f;
          } else if (th == "mono") {
            // Saturation pinned to zero on every element. This is the
            // accessible palette: nothing on the face may depend on telling
            // one hue from another, so custom must never leak into it.
            T[0][0]=0.0f; T[0][1]=0.0f; T[0][2]=100.0f;
            T[1][0]=0.0f; T[1][1]=0.0f; T[1][2]= 58.8f;
            T[2][0]=0.0f; T[2][1]=0.0f; T[2][2]= 23.5f;
            T[3][0]=0.0f; T[3][1]=0.0f; T[3][2]= 35.3f;
            T[4][0]=0.0f; T[4][1]=0.0f; T[4][2]= 21.6f;
          } else if (th == "custom") {
            T[0][0]=id(hour_hue).state;  T[0][1]=id(hour_sat).state;  T[0][2]=id(hour_val).state;
            T[1][0]=id(min_hue).state;   T[1][1]=id(min_sat).state;   T[1][2]=id(min_val).state;
            T[2][0]=id(sec_hue).state;   T[2][1]=id(sec_sat).state;   T[2][2]=id(sec_val).state;
            T[3][0]=id(timer_hue).state; T[3][1]=id(timer_sat).state; T[3][2]=id(timer_val).state;
            // Pips follow the arc at 62%, which is what all four presets
            // already do to within a few percent. One fewer control, and the
            // two can never drift into looking like unrelated features.
            T[4][0]=T[3][0]; T[4][1]=T[3][1]; T[4][2]=T[3][2] * 0.62f;
          }

          // The alert colour is NOT part of the theme. It is a single state
          // with nothing to be distinguished from, so the only axis worth
          // exposing is which hue catches the eye — full saturation and value,
          // straight from its own number. mono still drops it to grey, because
          // mono's promise is that nothing on the face depends on hue.
          T[5][0] = id(alert_hue).state;
          T[5][1] = (th == "mono") ? 0.0f : 100.0f;
          T[5][2] = 100.0f;

          for (int e = 0; e < 6; e++)
            hsv(T[e][0], T[e][1], T[e][2], &id(pal_ring)[e * 3]);

          // Role values for the screen, in the panel's own hierarchy.
          const float role_v[4] = {92.0f, 88.0f, 62.0f, 92.0f};
          for (int e = 0; e < 4; e++)
            hsv(T[e][0], T[e][1] * 0.6f, role_v[e], &id(pal_scr)[e * 3]);

# -----------------------------------------------------------------------------
# LIGHTS
# -----------------------------------------------------------------------------
light:
  - platform: monochromatic
    output: backlight_out
    id: backlight
    name: "Backlight"
    restore_mode: ALWAYS_ON
    # 0s, and this was a real defect. ESPHome's default_transition_length is
    # ONE SECOND, and this light never set it -- the ring sets 0s and says why,
    # the backlight was simply missed. So every brightness change here has been
    # a one-second RAMP of the panel's backlight rather than a step. Anything
    # that nudges the level repeatedly (the sunrise fade moves it every second
    # by design) has therefore been continuously modulating the backlight, and
    # backlight modulation on an LCD is most visible on small bright features
    # against a flat dark field -- a 32 px moon, a row of 6 px dots -- and
    # least visible inside a large solid block like an eye.
    #
    # That is not a claim that it IS the flicker. It is a defect that was
    # sitting in the one subsystem I never looked at, with a symptom profile
    # that matches, and it costs nothing to remove.
    default_transition_length: 0s
    # Sam: "the screen is too low". The light's default gamma is 2.8, so the
    # grow clock's 10% night level was a 0.16% duty -- the panel was off in all
    # but name. With gamma 1.0 a percentage is a duty, 10% is a real glow, and
    # the two screen-brightness numbers mean what they say.
    gamma_correct: 1.0

  - platform: esp32_rmt_led_strip
    id: ring
    internal: true      # not exposed to HA — the number/select/switch above are
                        # the intended surface. Exposing the raw light too
                        # invites a state fight between HA's brightness slider
                        # and the cap, with no way to tell which one won.
    pin: ${led_pin}
    num_leds: ${max_leds}       # ceiling; actual count is the ring_size number

    # `WS2812B` is NOT valid here. The accepted set is exactly WS2811, WS2812,
    # SK6812, APA106, SM16703 — a WS2812B ring uses WS2812. (fastled_clockless
    # DID accept WS2812B, so a copy-paste from an old config fails validation.)
    chipset: WS2812

    # `rgb_order`, and it is the VERSION-PORTABLE choice rather than the current
    # one. Two corrections to what this comment used to claim, both from the
    # bench, where 2026.8.1 is installed and the firmware actually flashes:
    #
    #   1. I wrote here that "there is no 2026.8.0" and that 2026.6.5 was the
    #      newest ESPHome in existence. WRONG. 2026.7 and 2026.8 both exist.
    #      What I actually checked was a package index through a proxy, and I
    #      reported what it served as what exists.
    #   2. I wrote that `channel_colors` "is not a key at all". WRONG. It exists,
    #      and on 2026.8.x `rgb_order` is Optional and deprecated in favour of
    #      it, with removal scheduled for 2027.3.0.
    #
    # What was right: on 2026.6.5, `cv.Required(CONF_RGB_ORDER)` really is
    # required and `channel_colors` really is unknown, so a file using
    # channel_colors fails there. Since rgb_order still WORKS on 2026.8.x -- it
    # only warns -- rgb_order is the one setting that validates on both, which is
    # why it stays. Swap to channel_colors when 2027.3.0 is close, not before.
    # Accepted values: RGB RBG GRB GBR BGR BRG.
    #
    # If red and green come out swapped on the ring, change this to RGB. Note
    # that this is the RING's byte order and has nothing to do with the screen's
    # `color_order:` -- different component, different chip, different bug.
    rgb_order: GRB

    # Gamma OFF by design. The default of 2.8 would make the brightness number
    # non-linear (50% would be ~14% duty), and the cap has to double as the
    # power story. We want it honest: 50% means 50% of current.
    gamma_correct: 1.0

    default_transition_length: 0s   # transitions fight per-pixel rendering
    restore_mode: ALWAYS_ON

    effects:
      # An addressable_lambda only runs while that effect is SELECTED — it does
      # NOT run with effect "None". on_boot selects it and nothing deselects it;
      # all mode logic lives inside.
      #
      # The lambda becomes a plain FUNCTION POINTER, so it cannot capture.
      # All state arrives via id(). Inner lambdas may capture freely.
      - addressable_lambda:
          name: "Face"
          update_interval: 50ms     # 20fps: smooth second hand, light main loop
          lambda: |-
            // The strip is COMPILED at ${max_leds}, but the ring physically
            // present is whatever "Ring LED count" says in Home Assistant.
            // Render to that and leave the surplus dark, so one firmware drives
            // any ring up to the ceiling with no reflash.
            const int PHYS = it.size();
            int N = (int) lroundf(id(ring_size).state);
            if (N < 4 || N > PHYS) N = PHYS;      // unset or nonsense -> whole strip
            if (N > 256) N = 256;
            id(frame)++;

            // Layers composite here at FULL brightness and get scaled once on
            // write-out. That makes the cap a single auditable multiply that no
            // layer can bypass, and avoids reading pixels back off the strip.
            static Color buf[256];
            for (int i = 0; i < N; i++) buf[i] = Color(0, 0, 0);

            // Fractions of the circle, so the face is correct at any ring size.
            const int off = (int) lroundf(id(twelve_offset).state);
            auto P = [N, off](float frac) -> int {
              int p = (int) lroundf(frac * N) + off;
              p %= N; return p < 0 ? p + N : p;
            };
            auto add = [](int i, int r, int g, int b) {   // buf is static
              buf[i].r = (uint8_t) std::min(255, (int) buf[i].r + r);
              buf[i].g = (uint8_t) std::min(255, (int) buf[i].g + g);
              buf[i].b = (uint8_t) std::min(255, (int) buf[i].b + b);
            };

            // ---- Current budget, applied to whatever was just written ------
            // Called immediately before every return from this lambda, and at
            // the end. It reads the strip back rather than the compositing
            // buffer on purpose: grow mode writes it[] directly and never
            // touches buf, so the buffer is not the whole truth. One estimate,
            // one multiply, no layer can bypass it.
            //
            // 20 mA per channel at full is the WS2812B datasheet figure, so a
            // white pixel is 60 mA. get_red() returns the value as WRITTEN --
            // before the light's own correction -- which equals the byte on the
            // wire only because this config pins gamma_correct to 1.0 and the
            // master brightness to 100%. If either of those ever changes, this
            // estimate stops being current and starts being a fiction.
            //
            // Quiescent draw (about 1 mA per LED, always there) is deliberately
            // NOT in the sum: it cannot be scaled away, so including it would
            // only make the limiter clamp harder for no gain.
            auto cap = [&it, PHYS]() {
              const float lim = id(ring_ma).state;
              if (!(lim > 0.0f)) return;                    // 0 or NaN = off
              float ma = 0.0f;
              for (int i = 0; i < PHYS; i++)
                ma += (it[i].get_red() + it[i].get_green() + it[i].get_blue())
                      * (20.0f / 255.0f);
              if (ma <= lim) return;
              const float sc = lim / ma;
              for (int i = 0; i < PHYS; i++)
                it[i] = Color((uint8_t) lroundf(it[i].get_red()   * sc),
                              (uint8_t) lroundf(it[i].get_green() * sc),
                              (uint8_t) lroundf(it[i].get_blue()  * sc));
            };

            const std::string mode  = id(display_mode).current_option().str();
            const auto now = id(ha_time).now();
            // The ring has its own switch under the master now, so "turn off
            // the LED's on the outside" does not take the screen with it.
            if (!id(display_on).state || !id(ring_on).state) {
              it.all() = Color::BLACK; return;
            }

            // ---- GROW CLOCK: the ring is the colour, and the stars ---------
            // Takes the whole ring and returns. Nothing below -- hands, timers,
            // status -- is for a child's bedroom.
            if (id(grow_mode).state && !id(grow_daytime)) {
              const int st = id(grow_st);
              const std::string sc = id(grow_sleep_colour).current_option().str();
              const std::string wc = id(grow_wake_colour).current_option().str();
              const std::string ac = id(grow_almost_colour).current_option().str();
              const std::string bc = id(grow_bedtime_colour).current_option().str();
              int r = 0, g = 0, b = 0;
              float k = 1.0f;
              const float ph = (id(frame) % 80) / 80.0f;               // 4 s breathe
              const float breathe = 0.55f + 0.45f * fabsf(1.0f - 2.0f * ph);
              bool stars = false;
              if (st == 0 || st == 4) {
                if      (sc == "red")    { r = 120; g = 0;  b = 0;   }
                else if (sc == "purple") { r = 60;  g = 0;  b = 90;  }
                else if (sc == "off")    { r = 0;   g = 0;  b = 0;   }
                else                     { r = 0;   g = 20; b = 120; }
                stars = id(grow_stars).state;
              } else if (st == 1) {
                if      (ac == "yellow") { r = 255; g = 200; b = 0;   }
                else if (ac == "green")  { r = 0;   g = 200; b = 40;  }
                else if (ac == "white")  { r = 200; g = 200; b = 200; }
                else                     { r = 255; g = 120; b = 0;   }
                k = breathe;
              } else if (st == 2) {
                if      (wc == "green") { r = 0;   g = 200; b = 40;  }
                else if (wc == "white") { r = 200; g = 200; b = 200; }
                else                    { r = 255; g = 200; b = 0;   }
              } else {
                if      (bc == "red")    { r = 120; g = 0;  b = 0;   }
                else if (bc == "purple") { r = 60;  g = 0;  b = 90;  }
                else if (bc == "blue")   { r = 0;   g = 20; b = 120; }
                else                     { r = 200; g = 80; b = 0;   }
                k = breathe;
              }

              // Sound during sleep: brighter and pulsing, in the SLEEP colour.
              const bool sound = id(grow_sound).state && (st == 0 || st == 4)
                  && id(grow_sound_since) != 0
                  && (uint32_t)(millis() - id(grow_sound_since))
                     < (uint32_t) lroundf(id(grow_sound_secs).state * 1000.0f);
              // The RING's own brightness numbers; the screen has its own pair.
              const bool nightish = (st == 0 || st == 3 || st == 4);
              const float bn = id(grow_ring_night_bright).state / 100.0f;
              const float bd = id(grow_ring_day_bright).state / 100.0f;
              float bri = (nightish && id(grow_dim).state) ? bn : bd;
              const int fade = (int) id(grow_fade_min).state, sw = id(grow_since_wake);
              if (st == 2 && fade > 0 && sw >= 0 && sw < fade)
                bri = bn + (bd - bn) * ((float) sw + 0.5f) / (float) fade;   // sunrise
              if (sound) {
                if (bri < 0.6f) bri = 0.6f;
                k = 0.6f + 0.4f * fabsf(1.0f - 2.0f * ((id(frame) % 20) / 20.0f));
              }

              // The wake-up effect: for the first grow_wake_effect_min of the
              // wake window the ring celebrates -- a slow rainbow, or the wake
              // colour with sparkles. Then it settles to the plain colour.
              const std::string fx = id(grow_wake_effect).current_option().str();
              if (st == 2 && fx != "solid" && sw >= 0
                  && sw < (int) id(grow_wake_effect_min).state) {
                for (int i = 0; i < PHYS; i++) it[i] = Color::BLACK;
                uint32_t seed = id(frame) * 2654435761u;
                for (int i = 0; i < N; i++) {
                  int rr = r, gg = g, bb = b;
                  if (fx == "rainbow") {
                    // hue walks once round the ring and once round every 8 s
                    const float h = fmodf((float) i / N + (id(frame) % 160) / 160.0f, 1.0f) * 6.0f;
                    const int   q = (int) h; const float f = h - q;
                    const int   x = (int) (255 * (1 - f)), y = (int) (255 * f);
                    switch (q) {
                      case 0: rr = 255; gg = y;   bb = 0;   break;
                      case 1: rr = x;   gg = 255; bb = 0;   break;
                      case 2: rr = 0;   gg = 255; bb = y;   break;
                      case 3: rr = 0;   gg = x;   bb = 255; break;
                      case 4: rr = y;   gg = 0;   bb = 255; break;
                      default: rr = 255; gg = 0;  bb = x;   break;
                    }
                  } else {
                    // sparkle: about one pixel in six flashes white this frame
                    seed = seed * 1664525u + 1013904223u;
                    if (((seed >> 8) % 6) == 0) { rr = 255; gg = 255; bb = 255; }
                  }
                  it[P((float) i / N)] = Color((uint8_t) lroundf(rr * bri),
                                               (uint8_t) lroundf(gg * bri),
                                               (uint8_t) lroundf(bb * bri));
                }
                cap();
                return;
              }

              // Stars go out from the far end, anticlockwise from 12, so the
              // last one standing is at the top -- where the sun comes up.
              int lit = N;
              if (stars) {
                lit = (int) ceilf(id(grow_frac) * N);
                if (lit < 0) lit = 0; if (lit > N) lit = N;
              }
              for (int i = 0; i < PHYS; i++) it[i] = Color::BLACK;
              for (int i = 0; i < lit; i++) {
                const int p = P(stars ? -(float) i / N : (float) i / N);
                it[p] = Color((uint8_t) lroundf(r * k * bri),
                              (uint8_t) lroundf(g * k * bri),
                              (uint8_t) lroundf(b * k * bri));
              }
              cap();
              return;
            }

            // ---- THEME ------------------------------------------------------
            // Already resolved. The palette resolver up in `interval:` turns
            // the selected theme — or the twelve custom HSV numbers — into
            // plain RGB, so this lambda does no colour maths at all and there
            // is exactly one place a colour can be wrong.
            const int *P_ = id(pal_ring);
            const int *hourC  = P_ + 0;
            const int *minC   = P_ + 3;
            const int *secC   = P_ + 6;
            const int *timerC = P_ + 9;
            const int *pipC   = P_ + 12;
            const int *alertC = P_ + 15;

            // ---- TEST CHASE: wiring, LED count, colour order, index 0 ------
            if (mode == "test chase") {
              add((id(frame) / 6) % N, 255, 255, 255);
              add(P(0.0f), 160, 0, 0);            // red marks 12 o'clock
            }

            // ---- NO TIME YET -----------------------------------------------
            // A confidently wrong clock is worse than an obviously broken one.
            else if (!now.is_valid()) {
              add((id(frame) / 12) % N, 40, 20, 0);
            }

            // ---- ALERT (highest priority) ----------------------------------
            // ALARM: shown until cancelled, or for alert_seconds, whichever
            // comes first. alert_seconds == 0 means "as long as it sounds".
            // The cancel path is the `.state` term and it needs no timer, so
            // "when it is cancelled the wall clock stops showing the alarm too"
            // holds within one 50 ms frame whatever the timeout is set to.
            // Unsigned subtraction, so a millis() wrap costs one frame, not
            // 49 days of no alarm.
            else if (id(timer_alert).state && mode != "clock bare"
                     && (id(alert_seconds).state <= 0.0f
                         || (uint32_t)(millis() - id(alert_since))
                            < (uint32_t) lroundf(id(alert_seconds).state * 1000.0f))) {
              const std::string astyle = id(alert_style).current_option().str();
              if (astyle == "solid") {
                for (int i = 0; i < N; i++)
                  add(i, alertC[0], alertC[1], alertC[2]);
              } else if (astyle == "chase") {
                // A comet with a four-pixel tail. Reads as motion from across
                // the room even when the whole ring is one colour.
                const int head = (id(frame) / 2) % N;
                for (int d = 0; d < 4 && d < N; d++) {
                  const float k = 1.0f - d * 0.25f;
                  const int i = ((head - d) % N + N) % N;
                  add(i, (int)(alertC[0]*k), (int)(alertC[1]*k), (int)(alertC[2]*k));
                }
              } else {
                const float ph = (id(frame) % 20) / 20.0f;    // ~1Hz at 20fps
                const float k = 0.35f + 0.65f * fabsf(1.0f - 2.0f * ph);
                for (int i = 0; i < N; i++)
                  add(i, (int)(alertC[0]*k), (int)(alertC[1]*k), (int)(alertC[2]*k));
              }
            }

            // ---- NORMAL FACE -----------------------------------------------
            else {
              // Markers. On a 24-LED ring twelve of them use half the pixels,
              // so "quarters" exists to keep the orientation cue without the
              // hands having to fight it.
              {
                // ring_markers, NOT marker_style: marker_style is the
                // screen's now. These are the twelve slightly-blue (14,14,18)
                // pixels, and they ship as "none" on the ring.
                const std::string ms = id(ring_markers).current_option().str();
                if (ms != "none") {
                  const float mb = id(marker_bright).state / 100.0f;
                  const int step = (ms == "quarters") ? 3 : 1;
                  for (int m = 0; m < 12; m += step)
                    add(P(m / 12.0f), (int)(14*mb), (int)(14*mb), (int)(18*mb));
                }
              }

              bool timer_running = false;
              if (mode == "auto" || mode == "clock only") {
                const float fin = id(timer_finish_epoch).state;
                const float tot = id(timer_total_seconds).state;
                if (!std::isnan(fin) && fin > 0) {
                  const float left = fin - (float) now.timestamp;
                  if (left > 0) {
                    timer_running = true;
                    // Teal by default, so it can never be mistaken for a hand.
                    // P() normalises negatives, so running the index backwards
                    // is all "anticlockwise" needs.
                    const bool acw =
                      id(arc_dir).current_option().str() == "anticlockwise";
                    const std::string tstyle =
                      id(timer_style).current_option().str();
                    const bool secs_style = tstyle == "seconds";
                    const bool mins_style = secs_style || tstyle == "minutes";

                    if (secs_style && left <= 60.0f) {
                      // ---- SECONDS: one LED per second remaining ----------
                      // Sam: "when a timer is set, that the LED's count down
                      // the seconds." Literally that -- lit == whole seconds
                      // left, so one LED goes out every second, and the ring
                      // empties as the timer expires.
                      //
                      // ceilf, so the last LED is still lit through the last
                      // whole second and the ring reaches empty exactly as the
                      // alert starts, rather than a second early.
                      //
                      // BEING STRAIGHT ABOUT WHAT A 24-LED RING CAN DO. One LED
                      // per second needs 60 LEDs to cover a minute. The 60-LED
                      // build counts every second of the final minute. The 24
                      // can only count the last 24 and the 32 the last 32, so
                      // above that the ring simply sits FULL -- 36 seconds on
                      // the 24, 28 on the 32, none on the 60 -- and starts
                      // draining, one LED per second, when the count fits.
                      //
                      // min(N, ...) rather than a second scale for that stretch
                      // is deliberate: it keeps the arc MONOTONIC. It never
                      // grows as time runs down, so the ring can never look
                      // like the timer got longer. If you would rather see
                      // movement across the whole final minute, "minutes" style
                      // is the one that gives it -- at 2.5 s per LED on the 24.
                      //
                      // Drains the OTHER way, same as the final minute of
                      // "minutes" style -- the reversal is how you see the
                      // final stretch begin without counting pixels.
                      int lit = (int) ceilf(left);
                      if (lit > N) lit = N;
                      for (int i = 0; i < lit; i++)
                        add(P(acw ? (float) i / N : -(float) i / N),
                            timerC[0], timerC[1], timerC[2]);
                    } else if (mins_style) {
                      if (left > 60.0f) {
                        // ---- MINUTES: a COUNT, not a proportion ------------
                        // One LED per whole minute remaining, rounded up, so
                        // 61 s already reads as 2. It needs no total at all,
                        // which is why the `tot` guard above was dropped:
                        // "add five minutes" simply lights another LED instead
                        // of silently rescaling the whole ring.
                        int mins = (int) ceilf(left / 60.0f);
                        if (mins > N) mins = N;      // ring full past N minutes
                        for (int i = 0; i < mins; i++)
                          add(P(acw ? -(float) i / N : (float) i / N),
                              timerC[0], timerC[1], timerC[2]);
                      } else {
                        // ---- FINAL MINUTE ("minutes" style only; "seconds"
                        // style took its own branch above) -------------------
                        // The reversal is the signal. You do not have to count
                        // pixels to know you are inside the last minute; the
                        // arc simply starts unwinding backwards.
                        const int lit = (int) ceilf((left / 60.0f) * N);
                        for (int i = 0; i < lit; i++)
                          add(P(acw ? (float) i / N : -(float) i / N),
                              timerC[0], timerC[1], timerC[2]);
                      }
                    } else if (!std::isnan(tot) && tot > 0) {
                      // ---- PROPORTION: whole ring = whole timer ------------
                      float ratio = left / tot;
                      if (ratio > 1.0f) ratio = 1.0f;   // "add 5 minutes" clamp
                      const int lit = (int) ceilf(ratio * N);
                      for (int i = 0; i < lit; i++)
                        add(P(acw ? -(float) i / N : (float) i / N),
                            timerC[0], timerC[1], timerC[2]);
                    }
                  }
                }

                // ---- ECHO-STYLE PIPS for the OTHER running timers ----------
                // The real Echo Wall Clock gives the next-expiring timer the
                // full depleting arc, and every OTHER running timer a single
                // LED sitting where it will finish. This is that.
                //
                // Position is the finish time mapped onto the minute dial, so
                // two timers ending at different times land in different places
                // and can be told apart at a glance.
                //
                // The timer that already owns the arc is skipped, or the
                // soonest timer would draw a redundant dot on itself.
                if (id(show_pips).state) {
                  const float nextfin = id(timer_finish_epoch).state;
                  const float fins[5] = { id(t1_fin).state, id(t2_fin).state,
                                          id(t3_fin).state, id(t4_fin).state,
                                          id(t5_fin).state };
                  for (int k = 0; k < 5; k++) {
                    const float f = fins[k];
                    if (std::isnan(f) || f <= 0) continue;
                    if (f <= (float) now.timestamp) continue;
                    if (!std::isnan(nextfin) && fabsf(f - nextfin) < 0.5f) continue;
                    // Where that wall-clock time falls on the minute dial.
                    const long secs = (long) f;
                    const float frac = (float) (secs % 3600L) / 3600.0f;
                    add(P(frac), pipC[0], pipC[1], pipC[2]);
                  }
                }
              }

              // ---- AMBIENT: accent pixels only, never anything hand-like ----
              if (mode == "auto" && !timer_running && id(show_status).state
                  && id(status_bright).state > 0.0f) {
                // One scale for every ambient pixel, so status can be turned
                // down as a group without touching the hands.
                const float sb = id(status_bright).state / 100.0f;
                if (id(bin_night).state && id(st_bin).state) {   // 12 o'clock
                  const float ph = (id(frame) % 60) / 60.0f;
                  const float k = (0.4f + 0.6f * fabsf(1.0f - 2.0f * ph)) * sb;
                  if (id(next_bin).state == "Recycling")
                    add(P(0.0f), (int)(160*k), (int)(140*k), 0);   // yellow
                  else
                    add(P(0.0f), 0, (int)(150*k), (int)(30*k));    // green
                }
                if (id(garage_open).state && id(st_garage).state)   // 3 o'clock
                  add(P(0.25f), (int)(150*sb), (int)(70*sb), 0);
                if (id(driveway_unknown).state && id(st_driveway).state) {
                  const float k = (((id(frame) / 10) % 2) ? 1.0f : 0.25f) * sb;
                  add(P(0.75f), (int)(200*k), 0, 0);
                }
                // The presence dots, just either side of 6 o'clock. Sam's own
                // is (0,40,90) -- THE blue light, and now behind its own switch.
                const bool who[4] = { id(home_sam).state && id(st_presence).state,
                                      id(home_laura).state && id(st_presence).state,
                                      id(home_amanda).state && id(st_presence).state,
                                      id(home_zac).state && id(st_presence).state };
                const int rgb[4][3] = { {0,40,90}, {90,0,70}, {0,70,40}, {70,50,0} };
                for (int w = 0; w < 4; w++)
                  if (who[w])
                    add(P(0.5f + (w - 1.5f) / N),
                        (int)(rgb[w][0]*sb), (int)(rgb[w][1]*sb), (int)(rgb[w][2]*sb));
              }

              // ---- HANDS, drawn last so they sit on top --------------------
              const float hf = fmodf((float) now.hour, 12.0f) / 12.0f
                             + now.minute / 720.0f;
              // On a 24-LED ring one pixel is 2.5 minutes, so the hour hand
              // gets no shoulders — they would swamp the dial. The same code on
              // a 60-LED ring gives a genuinely per-minute face.
              add(P(hf), hourC[0], hourC[1], hourC[2]);
              add(P(now.minute / 60.0f + now.second / 3600.0f), minC[0], minC[1], minC[2]);
              if (id(ring_seconds).state) {
                // Sweep interpolates between ticks with the render counter,
                // which is already running at 20fps for the alert pulse — so a
                // gliding hand costs nothing beyond this line.
                float sfrac = now.second / 60.0f;
                if (id(sec_style).current_option().str() == "sweep")
                  sfrac = (now.second + (id(frame) % 20) / 20.0f) / 60.0f;
                add(P(sfrac), secC[0], secC[1], secC[2]);
              }

              // HA dropped: tint 6 o'clock so it is visible from the room that
              // STATUS is stale. The time itself is still trustworthy.
              if (!id(ha_connected)) add(P(0.5f), 30, 0, 0);
            }

            // ---- BRIGHTNESS + WRITE-OUT: the single place it is applied ----
            // Night window is inclusive of start, exclusive of end, and handles
            // the wrap over midnight. Start == end means "no night window",
            // which is how you disable dimming by hours alone. If the time is
            // unknown we cannot tell day from night, so fall back to dimmer.
            float bri = id(day_brightness).state / 100.0f;
            if (!id(auto_dim).state) {
              // Auto dim off: day brightness around the clock.
            } else if (now.is_valid()) {
              const int h = now.hour;
              const int ns = (int) lroundf(id(night_start).state);
              const int ne = (int) lroundf(id(night_end).state);
              const bool night = (ns == ne) ? false
                               : (ns > ne)  ? (h >= ns || h < ne)
                                            : (h >= ns && h < ne);
              if (night) bri = id(night_brightness).state / 100.0f;
            } else {
              bri = id(night_brightness).state / 100.0f;
            }
            for (int i = 0; i < N; i++)
              it[i] = Color((uint8_t) lroundf(buf[i].r * bri),
                            (uint8_t) lroundf(buf[i].g * bri),
                            (uint8_t) lroundf(buf[i].b * bri));
            // Anything past the configured ring size stays dark, so a short
            // ring on a long-compiled strip does not show stale pixels.
            for (int i = N; i < PHYS; i++) it[i] = Color::BLACK;
            cap();

# =============================================================================
# DISPLAY — verified GC9B72 init sequence (working on hardware 2026-08-24)
# =============================================================================
# If `esphome config` rejects anything here, or the panel comes up blank or
# garbled, fall back to mini-round-clock.yaml (ring only, known good) and read
# docs/gc9b72-display-block.yaml for what to do next. The ring does not depend
# on any of this.
# =============================================================================

spi:
  - id: lcd_bus
    clk_pin: ${lcd_clk}       # SCL
    mosi_pin: ${lcd_mosi}     # SDA

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 118
    bpp: 4                # anti-aliased; 1bpp digits look ragged this large
    glyphs: "0123456789:"
  - file: "gfonts://Roboto"
    id: font_med
    size: 32
    bpp: 4
    glyphs: "0123456789.:-°% abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
  # Extra sizes for the time, DIGITS AND COLON ONLY. A 4bpp glyph costs about
  # size^2/2 bytes, so a full alphabet at 96 px would be ~320 KB while eleven
  # glyphs is ~51 KB. Nothing here ever prints a letter, so the alphabet would
  # be pure waste.
  #
  # 132 px is deliberately absent. Roboto digits run about 0.55*size wide and
  # the colon about 0.28, so "12:34" is roughly 2.48*size: 293 px at 118, which
  # fits 360 with room to spare, but 327 px at 132 — and on a ROUND screen the
  # full width only exists on the centre line. 118 is the largest honest size.
  - file: "gfonts://Roboto"
    id: font_t48
    size: 48
    bpp: 4
    glyphs: "0123456789:"
  - file: "gfonts://Roboto"
    id: font_t72
    size: 72
    bpp: 4
    glyphs: "0123456789:"
  - file: "gfonts://Roboto"
    id: font_t96
    size: 96
    bpp: 4
    glyphs: "0123456789:"
  - file: "gfonts://Roboto"
    id: font_small
    size: 22
    bpp: 4
    glyphs: "0123456789.:-°% abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"

# -----------------------------------------------------------------------------
# THE ROUND DISPLAY
# -----------------------------------------------------------------------------

display:
  - platform: mipi_spi
    model: CUSTOM
    id: face_lcd
    spi_id: lcd_bus
    cs_pin: ${lcd_cs}
    # allow_other_uses, because the bar panel shares this DC line. Without it
    # ESPHome refuses the whole file with "Pin 13 is used in multiple places" --
    # its pin validator counts every declaration, and does not know that two SPI
    # devices with their own chip selects can share D/C safely. The sharing is
    # deliberate and is safe for the same reason the bus itself is: DC is only
    # sampled by a chip whose CS is low, and only one CS is ever low.
    #
    # It goes on BOTH declarations. ESPHome requires every user of a shared pin
    # to opt in; marking one and not the other still fails.
    dc_pin:
      number: ${lcd_dc}
      allow_other_uses: true
    reset_pin: ${lcd_reset}
    dimensions:
      width: 360
      height: 360
    # 40, not 20. What is left of the flicker is the TIME A FRAME TAKES: any
    # change to the face is written to the glass in six strips top to bottom,
    # and at 20 MHz a 360 x 360 frame is 104 ms of SPI before the drawing is
    # counted. Sam's test settles that this is what it is -- with "Grow clock
    # animate" off the panel is redrawn every second and is perfectly steady,
    # so a redraw of unchanged pixels is invisible and only the CHANGED region
    # shows the sweep. The only lever left is making the sweep shorter.
    #
    # See the lcd_hz substitution at the top of this file for why this is back
    # at 20MHz and how to A/B it. Short version: 40 was a guess I made during
    # the flicker hunt, on a link I have no datasheet for, and a marginal SPI
    # clock corrupts thin strokes while leaving solid blocks looking perfect --
    # which is the symptom.
    data_rate: ${lcd_hz}
    # PINNED, AND THE ANIMATION BOX DEPENDS ON IT. Left alone, ESPHome picks
    # the fraction itself: with no psram it aims at a ~20 kB buffer and lands
    # on 1/8, so the bands come out 45 rows. 17% asks for "no bigger than a
    # sixth"; the resolver takes the first divisor of 360 that is small enough,
    # which is 6, so the buffer is 360*360*2/6 = 43200 bytes and THE BANDS ARE
    # EXACTLY 60 ROWS.
    #
    # That number is load-bearing. The eye box in the lambda runs y 60..239 and
    # BOTH edges have to land on a band boundary, or the driver sends a band
    # whose bounding box contains pixels that pass never wrote. 45-row bands
    # cannot do it: the only alignment that clears the sun's rays at the top
    # would be y 90, and that cuts through the z's. CHANGE ONE, CHANGE BOTH.
    #
    # It costs 10.8 kB of internal SRAM over the default, and there is no psram
    # on this board (see the note at the top of the file). If the log ever says
    # "Buffer allocation failed", this is the line: the fallback is to drop the
    # animation box back to a full repaint (grow_partial off) and remove this.
    buffer_size: 17%
    pixel_mode: 16bit         # MUST match COLMOD 0x05 in the table above
    invert_colors: false      # flip if the image looks like a photo negative

    # RGB, AND THIS IS THE FIX FOR "the colours seem to be opposite on the
    # screen" / "the hour hand on the screen is blue but it's orange on the LED
    # ring. And the opposite to the minutes."
    #
    # IT IS NOT A SWAP IN THE CODE. Both surfaces read the SAME palette slots --
    # ring hourC = pal_ring[0..2], screen c_hour = pal_scr[0..2], and the same
    # for the minute at [3..5]. There is no index anywhere that crosses them
    # over. What was wrong is the order the bytes leave in: red and blue are
    # arriving in each other's channel, so every colour comes out as its
    # opposite. Run the two default hand colours through that swap:
    #
    #     hour   (235,144,105) orange  ->  (105,144,235)  a medium BLUE
    #     minute (106,153,224) blue    ->  (224,153,106)  ORANGE
    #     second (158,158,158) grey    ->  (158,158,158)  unchanged
    #
    # -- which is Sam's report exactly, down to why only the two coloured hands
    # looked wrong while the grey second hand and the white hand boss did not.
    #
    # RULED OUT: invert_colors. A negative swaps orange and blue too, but it
    # would also turn the near-black ground (10,12,18) into near-WHITE, and the
    # screen is not white. An R/B swap leaves greys and the background exactly
    # where they are, which is what is on the wall.
    #
    # WHY rgb AND NOT bgr -- I had this backwards for about ten minutes, so the
    # evidence is written down rather than the conclusion. Three sources, all
    # pointing the same way:
    #
    #   1. xboot's fb-gc9b72.c -- the verified reference driver this whole init
    #      table came from -- sets MADCTL to 0x00. Bit 3 clear is RGB. The
    #      vendor drives this panel in RGB order.
    #   2. ESPHome's mipi_spi APPENDS its own MADCTL after the custom table,
    #      derived from color_order/rotation/mirror, exactly as it does with
    #      COLMOD. The table's [0x36, 0x00] below never reaches the panel.
    #   3. samuel-d-young/esphome-gc9b72-360x360 (this panel's own repo)
    #      records the resolved config for a `model: CUSTOM` block with no
    #      color_order line: `color_order: BGR`. So the default was overriding
    #      the vendor's RGB with BGR -- and that repo's troubleshooting table
    #      says it in one line: "Red shows as blue -> ... Default is BGR; try
    #      RGB."
    #
    # So this line is not a guess at the hardware, it is putting back the order
    # the vendor driver uses and ESPHome was silently replacing.
    #
    # DO NOT "fix" this by editing [0x36, 0x00] in the table below. It is
    # overridden, so the edit would appear to do nothing -- the identical trap
    # this file already documents for 0x3A. color_order is the knob that works.
    # The vendor table stays byte-for-byte as verified.
    #
    # The bar panel below keeps `color_order: bgr`. Different controller,
    # different answer; that one has been right since the day it was added.
    #
    # IF THIS IS NOW BACKWARDS -- if the hour hand has gone blue and the minute
    # orange -- this single word is the whole fix. `clock_face: "colour test"`
    # in Home Assistant puts three labelled swatches on the panel so you can
    # settle it in one look instead of by memory.
    color_order: rgb
    # never, not 1s: the dispatcher under `interval:` decides which panel gets
    # drawn. Left self-polling, the panel that is NOT fitted would still push a
    # full framebuffer down the shared bus every second -- 253 KB at 20 MHz is
    # about 100 ms, a tenth of the bus, spent on a panel that is not there, and
    # the panel that IS there would stutter for it.
    update_interval: never
    # The driver flushes only the rectangle that was drawn on since the last
    # update. With auto-clear on, every update clears the whole buffer and so
    # flushes the whole panel: 360 x 360 x 16 bit at 20 MHz is 104 ms. With it
    # off, a grow-clock animation frame repaints the eye box alone (248 x 184,
    # 36 ms) and a full frame clears itself, first thing, exactly as auto-clear
    # did. This is what makes 10 fps eyes possible without touching the SPI
    # clock that the bench has proven at 20 MHz.
    auto_clear_enabled: false
    init_sequence:
      # =====================================================================
      # GENUINE GC9B72 INIT SEQUENCE
      # ---------------------------------------------------------------------
      # Source: xboot/xstar, xstar/driver/framebuffer/fb-gc9b72.c (MIT,
      # Jianjun Jiang). Cross-checked byte-for-byte against the independent
      # port in MaliosDark/Arduino_GC9B72 (src/Arduino_GC9B72.h). These are
      # the only two known-good public GC9B72 inits and they agree exactly.
      #
      # This REPLACES the borrowed GC9B71 table that was here before. That
      # table was a different chip's and produced stripes on a solid fill.
      #
      # xboot drives this panel as plain 4-wire SPI, mode 0, at 50 MHz, with
      # separate CS / D-C / RST — which is exactly how this board is wired.
      # ---------------------------------------------------------------------
      # 0x11 SLPOUT and 0x29 DISPON are NOT listed here: mipi_spi appends
      # both, with the correct delays. Verified in components/mipi/__init__.py
      # at tag 2026.8.0, Model.get_sequence().
      #
      # 0x3A and 0x36 ARE listed, in their original position, because the
      # vendor sequence sets them mid-table. mipi_spi appends its own copies
      # afterwards regardless (get_sequence() appends PIXFMT unconditionally,
      # despite its docstring claiming otherwise) — so `pixel_mode` below MUST
      # stay 16bit, or ESPHome's trailing 0x3A will contradict this table.
      # =====================================================================

      # ---- unlock the inner (vendor) register page ------------------------
      - [0xFE]
      - [0xEF]

      # ---- power / regulator / gate timing --------------------------------
      - [0x80, 0x19]
      - [0x82, 0x09]
      - [0x83, 0x03]
      - [0x88, 0x00]
      - [0x89, 0x38]
      - [0x8A, 0x40]
      - [0x8B, 0x0A]
      - [0x8C, 0x00]
      - [0x81, 0xFF]
      - [0x84, 0xFF]
      - [0x85, 0xFF]
      - [0x86, 0xFF]
      - [0x87, 0xFF]
      - [0x8E, 0xFF]
      - [0x8F, 0xFF]
      - [0x98, 0x3E]
      - [0x99, 0x3E]
      - [0x7D, 0x72]
      - [0x70, 0x02, 0x03, 0x03, 0x06, 0x03, 0x03, 0x09, 0x07, 0x09, 0x03]
      - [0x90, 0x06, 0x06, 0x01, 0x01]
      - [0x93, 0x02, 0xFF, 0x00]
      - [0xCB, 0x02]
      - [0xFB, 0x00, 0x00]
      - [0xF6, 0xC0]
      - [0x6C, 0x00, 0x00, 0x22, 0x00, 0xCC, 0x04, 0x58]
      - [0xAA, 0x0B, 0x00]
      - [0xEC, 0x07]
      - [0xF9, 0x40]
      - [0xEB, 0x01, 0x67]
      - [0x74, 0x01, 0x60, 0x00, 0x00, 0x00, 0x00]
      - [0xB5, 0x14, 0x14, 0x14]

      # ---- gate driver / source mux mapping (32 bytes) ---------------------
      - [0x6E, 0x0B, 0x0B, 0x09, 0x09, 0x13, 0x13, 0x11, 0x11, 0x16, 0x15, 0x01, 0x04, 0x00, 0x0D, 0x1D, 0x00, 0x00, 0x1D, 0x0D, 0x00, 0x04, 0x08, 0x15, 0x16, 0x12, 0x12, 0x14, 0x14, 0x0A, 0x0A, 0x0C, 0x0C]

      # ---- panel drive waveforms ------------------------------------------
      - [0x60, 0x38, 0x1C, 0x13, 0x56]
      - [0x61, 0xF8, 0x0A, 0x13, 0x56]
      - [0x62, 0xF8, 0x0B, 0x13, 0x56]
      - [0x63, 0x38, 0x1C, 0x13, 0x56]
      - [0x64, 0x38, 0x20, 0x72, 0xF8, 0x13, 0x56]
      - [0x65, 0x78, 0x1A, 0x70, 0x0B, 0x56, 0x13]
      - [0x66, 0x38, 0x24, 0x72, 0xFC, 0x13, 0x56]
      - [0x68, 0xB3, 0x08, 0x0E, 0x08, 0x0E, 0x0A, 0x0A]
      - [0x69, 0xB3, 0x08, 0x0E, 0x08, 0x0E, 0x0A, 0x0A]
      - [0x6A, 0x00, 0x00]

      # ---- pixel format + memory access ------------------------------------
      - [0x3A, 0x05]            # COLMOD: 16 bit/px, RGB565
      # MADCTL. NEVER REACHES THE PANEL -- mipi_spi appends its own, built from
      # color_order/rotation/mirror, after this table. Kept because it is what
      # the vendor sequence sends and this table is verbatim, and because the
      # 0x00 here is the evidence for `color_order: rgb` above: bit 3 clear is
      # RGB, so RGB is what xboot drives this panel in.
      - [0x36, 0x00]            # MADCTL: no mirror, no swap, RGB order

      # ---- VCOM / power levels ---------------------------------------------
      - [0x7C, 0xB6, 0x29]
      - [0xAC, 0x40]
      - [0xC3, 0x1A]
      - [0xC4, 0x24]
      - [0xC9, 0x2F]

      # ---- gamma (positive/negative, both banks) ---------------------------
      - [0xF0, 0x11, 0x17, 0x08, 0x06, 0x05, 0x38]
      - [0xF1, 0x4D, 0x72, 0x72, 0x2D, 0x34, 0x8F]
      - [0xF2, 0x11, 0x17, 0x08, 0x06, 0x05, 0x38]
      - [0xF3, 0x4D, 0x72, 0x72, 0x2D, 0x34, 0x8F]

      - [0xB4, 0x0A]
      - [0x35, 0x00]            # TE line on, mode 0

      # ---- lock the inner register page ------------------------------------
      - [0xFE]
      - [0xEE]
    lambda: |-
      // FIRST LINE, so the early returns below cannot skip it. See an_band.
      const int band = id(an_band);
      id(an_band) = (band + 1) % 6;
      if (!id(an_partial)) {
        it.fill(Color::BLACK);                     // what auto-clear used to do
        // A full frame draws the eyes from the SAME drawn-pose globals the
        // animation frame does, so it repaints them exactly as they already
        // are and changes nothing. It deliberately does NOT advance that
        // pose. This is the whole fix: the 1 s dispatcher redraw used to
        // draw the LIVE pose, so however slowly the animation frames were
        // throttled, the eyes still jumped a whole second's worth of
        // movement once a second -- which is what Sam has been seeing, and
        // why no value of the interval ever helped. Now the only thing that
        // moves the eyes is an animation frame, at the rate the dial sets.
      }
      const int CX = 180, CY = 180;
      const auto now = id(ha_time).now();
      const std::string face = id(clock_face).current_option().str();
      const bool h24 = id(fmt_24h).state;

      // ---- COLOUR TEST: settles color_order in one look --------------------
      // Three swatches, each LABELLED with the colour it is supposed to be, in
      // black text on the swatch. If the word RED is on a blue block, red and
      // blue are swapped and `color_order:` on this component is the one line
      // to change -- see the long note beside it.
      //
      // Drawn as an early return, before the weather tint and everything else,
      // so nothing else on the panel can be blamed for what you are looking at.
      // Green is in the middle because green is the channel a swap never
      // touches: if the middle block is green and the outer two disagree with
      // their labels, it is an R/B swap. If the middle one is wrong TOO, it is
      // not colour order -- look at invert_colors instead.
      if (face == "colour test") {
        const int W = 360, BH = 92;
        it.fill(Color(0, 0, 0));
        const Color sw[3] = { Color(255,0,0), Color(0,255,0), Color(0,0,255) };
        const char *nm[3] = { "RED", "GREEN", "BLUE" };
        for (int k = 0; k < 3; k++) {
          const int y = 46 + k * BH;
          it.filled_rectangle(40, y, W - 80, BH - 10, sw[k]);
          it.print(W / 2, y + (BH - 10) / 2, id(font_med), Color(0, 0, 0),
                   TextAlign::CENTER, nm[k]);
        }
        it.print(W / 2, 20, id(font_small), Color(200, 200, 200),
                 TextAlign::CENTER, "each word on its own colour = correct");
        return;
      }

      // 12/24 hour. Done by hand rather than with strftime %I because %I pads
      // to "09:30", which reads wrong on a clock face. This drops the zero.
      auto hour12 = [](int h) -> int { int v = h % 12; return v == 0 ? 12 : v; };

      // ---- background: weather wash ------------------------------------
      // Kept dark on purpose. This sits inside a lit LED ring; a bright
      // background would wash the ring out and be unreadable at night.
      std::string cond = id(weather_condition).state;
      // Screen palette, resolved by the interval up top. Saturation and value
      // are already set for a backlit panel, so these are used as-is; the
      // dimmed variants below are for subordinate text.
      const int *S_ = id(pal_scr);
      const Color c_hour  = Color(S_[0],  S_[1],  S_[2]);
      const Color c_min   = Color(S_[3],  S_[4],  S_[5]);
      const Color c_sec   = Color(S_[6],  S_[7],  S_[8]);
      const Color c_timer = Color(S_[9],  S_[10], S_[11]);
      auto dim = [](const Color &c, float k) {
        return Color((uint8_t) lroundf(c.r * k),
                     (uint8_t) lroundf(c.g * k),
                     (uint8_t) lroundf(c.b * k));
      };

      // The screen's own switch, under the master. Sam asked to be able to
      // turn one surface off without the other; this is that end of it.
      if (!id(display_on).state || !id(screen_on).state) {
        it.fill(Color::BLACK); return;
      }

      // ---- GROW CLOCK ------------------------------------------------------
      // Before the night-blank check on purpose: a grow clock's whole job is
      // to be visible at night. Before the weather and the timers because none
      // of that belongs in a child's room. The backlight level is set by the
      // dispatcher, so the field here can be drawn at full colour.
      if (id(grow_mode).state && !id(grow_daytime)) {
        const int st = id(grow_st);
        const std::string sc = id(grow_sleep_colour).current_option().str();
        const std::string wc = id(grow_wake_colour).current_option().str();
        const std::string ac = id(grow_almost_colour).current_option().str();
        const std::string bc = id(grow_bedtime_colour).current_option().str();
        const std::string fs = id(grow_face).current_option().str();
        // Two palettes. "eyes" and "eyes and sky" are the Deskimon look: a
        // black field with everything drawn in the state colour, so the eyes
        // glow. The other faces put the state colour on the whole field with
        // dark ink on it. Mirrored in preview/grow_faces.py -- change both.
        const bool glow = fs == "eyes" || fs == "eyes and sky";
        const bool sky  = fs == "eyes and sky";
        const bool partial = id(an_partial);
        if (partial && !glow && fs != "eyes on colour") return;
        Color field, ink;
        if (glow) {
          field = Color(0, 0, 0);
          if (st == 0 || st == 4) {
            ink = sc == "red"    ? Color(255, 40, 30)
                : sc == "purple" ? Color(170, 60, 255)
                : sc == "off"    ? Color(50, 50, 60)
                :                  Color(40, 100, 255);
          } else if (st == 1) {
            ink = ac == "yellow" ? Color(255, 220, 60)
                : ac == "green"  ? Color(60, 230, 80)
                : ac == "white"  ? Color(240, 240, 240)
                :                  Color(255, 150, 30);
          } else if (st == 2) {
            ink = wc == "green" ? Color(60, 230, 80)
                : wc == "white" ? Color(240, 240, 240)
                :                 Color(255, 210, 40);
          } else {
            ink = bc == "red"    ? Color(255, 40, 30)
                : bc == "purple" ? Color(170, 60, 255)
                : bc == "blue"   ? Color(40, 100, 255)
                :                  Color(255, 120, 50);
          }
        } else if (st == 0 || st == 4) {
          field = sc == "red"    ? Color(90, 10, 10)
                : sc == "purple" ? Color(50, 10, 80)
                : sc == "off"    ? Color(0, 0, 0)
                :                  Color(10, 18, 80);
          ink = Color(225, 228, 240);
        } else if (st == 1) {
          field = ac == "yellow" ? Color(230, 200, 40)
                : ac == "green"  ? Color(40, 160, 60)
                : ac == "white"  ? Color(200, 200, 200)
                :                  Color(200, 120, 20);
          ink = ac == "green" ? Color(10, 40, 16) : Color(40, 24, 4);
        } else if (st == 2) {
          field = wc == "green" ? Color(40, 180, 60)
                : wc == "white" ? Color(220, 220, 220)
                :                 Color(240, 200, 40);
          ink = Color(40, 32, 8);
        } else {
          field = bc == "red"    ? Color(90, 10, 10)
                : bc == "purple" ? Color(50, 10, 80)
                : bc == "blue"   ? Color(10, 18, 80)
                :                  Color(140, 60, 20);
          ink = Color(240, 225, 200);
        }
        if (!partial) it.fill(field);
        const bool sound = id(grow_sound).state && (st == 0 || st == 4)
            && id(grow_sound_since) != 0
            && (uint32_t)(millis() - id(grow_sound_since))
               < (uint32_t) lroundf(id(grow_sound_secs).state * 1000.0f);

        // rrect: a rounded rectangle from two rectangles and four circles,
        // the only way to get one out of Display without a bitmap.
        auto rrect = [&](int x, int y, int w, int h, int r, Color c) {
          it.filled_rectangle(x + r, y, w - 2 * r, h, c);
          it.filled_rectangle(x, y + r, w, h - 2 * r, c);
          it.filled_circle(x + r, y + r, r, c);
          it.filled_circle(x + w - 1 - r, y + r, r, c);
          it.filled_circle(x + r, y + h - 1 - r, r, c);
          it.filled_circle(x + w - 1 - r, y + h - 1 - r, r, c);
        };

        if (glow || fs == "eyes on colour") {
          // Deskimon-style: two big rounded eyes, no mouth, and every
          // expression is an eyelid painted over an open eye in the field
          // colour -- which only works because nothing is drawn behind them.
          // The numbers come from the animator's globals, so the dispatcher's
          // full frame and the 100 ms animation frame draw the same eyes.
          // Geometry is mirrored in preview/grow_faces.py; change both.
          const int EX = 60, EY = CY - 34, EW = 80, EH = 112, ER = 28, BAR = 16;
          // ---- THE ANIMATION BOX, AND THE FLICKER --------------------------
          // The panel scans itself out of GRAM continuously, about 60 times a
          // second. We write GRAM over SPI, asynchronously, and a whole
          // 360 x 360 frame is 259200 bytes -- 104 ms at 20 MHz, six scans
          // long. So the write walks down the glass while the scan walks down
          // the glass, they cross each other several times on the way, and
          // every crossing is visible. Over a region that is CHANGING that
          // reads as motion. Over a region being rewritten with the pixels it
          // already had it reads as a blink.
          //
          // That is the whole thing, and it is exactly how Sam's list sorted:
          //
          //   eyes    change every frame          looked like animation
          //   z's     change every frame          looked like animation
          //   time    was not being redrawn       steady
          //   moon    redrawn, never changes      FLICKERED
          //   stars   redrawn, never changes      FLICKERED
          //
          // It also explains the one measurement that never fitted any of the
          // ten theories: with the animator OFF the panel is perfectly steady,
          // because then a full frame only goes out when something actually
          // changed, and one crossing a minute is not a flicker.
          //
          // The init sequence turns TE on (0x35 above) but mipi_spi has no TE
          // input, so the write cannot be synced to the scan. The only lever
          // left is to WRITE LESS. An animation frame now repaints the eye box
          // and nothing else. The sky above it and the star row, the "shh" and
          // the time below it are left exactly as they are and are redrawn
          // only by a full frame -- which is already gated on the content
          // actually changing. Nothing static is ever rewritten again.
          //
          // KEEP EVERY BAND ALIVE. mipi_spi does not run this lambda once per
          // frame: with a partial buffer it runs it once per BAND, top to
          // bottom, flushing each band's dirty rectangle as it goes -- and if
          // a band comes back with nothing drawn in it, the driver does not
          // skip that band, it RETURNS and abandons the whole rest of the
          // frame (mipi_spi.h, the loop over start_line_). The eye box lives
          // in the middle bands, so left alone the first band comes back empty
          // and every animation frame is thrown away before a pixel reaches
          // the glass.
          //
          // So: a 4 px column of FIELD-coloured pixels down the far left,
          // drawn ONLY in the rows the box does not cover. On a round 360
          // panel the glass at those rows does not reach x = 4 -- the chord at
          // y = 59 runs x 47..313 and only narrows from there, and the same
          // below y = 240 -- so the marker is off the picture entirely, and it
          // is field-coloured anyway.
          //
          // AND THE MARKER MUST NEVER SHARE A BAND WITH THE BOX. The driver
          // flushes the BOUNDING BOX of what was drawn, not the pixels that
          // were drawn; anything inside that box which this pass did not write
          // still holds the previous band's contents and goes out as garbage.
          // A band with marker rows and box rows in it would have a bounding
          // box of x 0..303 with only x 0..3 written. So the box is aligned to
          // the band grid: buffer_size is pinned at 17% on the display above,
          // which makes the bands exactly 60 rows, and 60 and 240 are both
          // multiples of 60. CHANGE ONE, CHANGE THE OTHER.
          //
          //   rows   0.. 59   band  0    marker only   (the sky lives here)
          //   rows  60..239   bands 1-3  the box
          //   rows 240..359   bands 4-5  marker only   (stars, shh, the time)
          //
          // What has to fit inside 60..239: the eyes (90..202), the three z's
          // (a 32 px glyph centred 82..106, so 66..122), the yawn (centred
          // 222, r <= 16, so 206..238) and the countdown, which is why the
          // countdown moved up to CY + 40 and why it suppresses the yawn.
          // What has to stay outside: the sky (moved up to CY - 144 so its
          // longest ray stops at 58), the star row (243..261), "shh" (261..299)
          // and the time (272..328).
          //
          // AND IT HAS TO BE DRAWN BAND BY BAND. The first version drew the
          // whole 248 x 180 rectangle on every one of the six passes and let
          // draw_pixel_at throw away five sixths of it -- 268000 calls a frame
          // for 45000 pixels. Measured on the bench: 385 ms a frame with the
          // clip on against 269 ms with it off. The clipped path was SLOWER
          // than the full repaint it replaced, which is the opposite of the
          // point. The bottleneck was never the SPI bus; a clipped frame sends
          // 90 kB instead of 259, but it walks the draw loop six times over.
          //
          // So every rectangle here is intersected with the band first, and the
          // eye block is skipped outright in the three bands it cannot reach.
          const int AN_L = CX - 124, AN_R = CX + 124;   // x 56..303
          const int AN_T = 60,       AN_B = 240;        // y 60..239
          const int AN_MK = 4;                          // marker column width
          const int b0 = band <= 5 ? band*60 : 0;       // this band's rows;
          const int b1 = band <= 5 ? b0 + 60 : 360;     // 0..359 if ever unsure
          auto strip = [&it, &field](int x, int w, int y0, int y1) {
            if (y1 > y0) it.filled_rectangle(x, y0, w, y1 - y0, field);
          };
          if (partial) {
            it.start_clipping(0, 0, AN_MK, 360);
            strip(0, AN_MK, b0, std::min(b1, AN_T));
            strip(0, AN_MK, std::max(b0, AN_B), b1);
            it.end_clipping();
            it.start_clipping(AN_L, AN_T, AN_R, AN_B);
            strip(AN_L, AN_R - AN_L, std::max(b0, AN_T), std::min(b1, AN_B));
          }
          // The eyes, the z's, the yawn and "shh" all live between y 66 and
          // 238. On an animation frame the other three bands have nothing to
          // draw and every pixel of them would be rejected one at a time.
          const bool eyeband = !partial || (b1 > AN_T && b0 < AN_B);
          const float droop = st == 3 ? 1.0f : 0.0f;
          auto eye = [&](int cx, int cy, float lid, float smile, float hs, bool outer_left) {
            const int h = (int) (EH * hs), w = EW;
            const int r = std::min(ER, h / 2 - 1);
            if (lid >= 0.9f) {                       // closed: a flat bar
              rrect(cx - w / 2, cy - BAR / 2, w, BAR, BAR / 2, ink);
              return;
            }
            rrect(cx - w / 2, cy - h / 2, w, h, r, ink);
            const int x0 = cx - w / 2 - 1, top = cy - h / 2 - 1;
            if (lid > 0.02f) {                       // the lid, from the top
              const int L = (int) (h * lid);
              it.filled_rectangle(x0, top, w + 2, L + 1, field);
              if (droop > 0.0f) {                    // outer corner droops: tired
                const int d = std::max(4, (int) (EH / 8.0f * droop));
                if (outer_left) it.filled_triangle(x0, top + L, x0 + w + 2, top + L, x0, top + L + d, field);
                else            it.filled_triangle(x0, top + L, x0 + w + 2, top + L, x0 + w + 2, top + L + d, field);
              }
            }
            if (smile > 0.02f) {                     // a bite from below: a happy arch
              // CLIPPED TO THE EYE, and it has to be. The bite is a circle of
              // radius 0.9w whose centre sits BELOW the eye, so most of it is
              // outside it: at the resting awake smile of 0.35 it reaches
              // about 70 px past the eye's bottom. On the round panel that is
              // over the countdown and the digital time; on the bar it is
              // over the time. A full frame redraws both, so there was never
              // anything wrong to look at -- until the animation frames
              // started reaching the panel, and then the time was being
              // erased and repainted at the animation rate. That is what Sam
              // saw as the graphics flickering. Drawn as spans rather than as
              // a circle so it cannot reach past the eye it is biting.
              const int Rb = (int) (w * 0.9f);
              const int yc = cy + h / 2 + Rb - (int) (smile * h * 0.78f);
              const int y0 = std::max(cy - h / 2, yc - Rb);
              const int y1 = std::min(cy + h / 2, yc + Rb);
              for (int yy = y0; yy <= y1; yy++) {
                const int dy = yy - yc;
                const int dx = (int) sqrtf((float) (Rb * Rb - dy * dy));
                if (dx > 0) it.filled_rectangle(cx - dx, yy, 2 * dx + 1, 1, field);
              }
            }
          };
          const int gx = (int) lroundf(id(an_dgx)), gy = (int) lroundf(id(an_dgy));
          if (eyeband) {
          eye(CX - EX + gx, EY + gy, id(an_dlidl), id(an_dsmile), id(an_dhs), true);
          eye(CX + EX + gx, EY + gy, id(an_dlidr), id(an_dsmile), id(an_dhs), false);
          // The countdown lands where the yawn does, and only one of them can
          // have it. The number wins: it is information, the yawn is decoration.
          const bool cdown = id(grow_show_countdown).state
                             && (st == 1 || st == 3) && id(grow_min_to) >= 0;
          if (id(an_dmouth) > 0.05f && !cdown) {      // the yawn
            const int r = 4 + (int) (12 * id(an_dmouth));
            it.filled_circle(CX + gx, EY + EH / 2 + 20 + gy, r, ink);
            if (r > 6) it.filled_circle(CX + gx, EY + EH / 2 + 20 + gy, r - 5, field);
          }
          if (st == 0 || st == 4) {                  // three z's, rising and fading
            for (int i = 0; i < 3; i++) {
              const float ph = fmodf(id(an_dzph) + i / 3.0f, 1.0f);
              it.print(CX + 70 + (int) (14 * ph), CY - 74 - (int) (24 * ph), id(font_med),
                       dim(ink, 1.0f - ph * 0.9f), TextAlign::CENTER, "z");
            }
          }
          if (sound) it.print(CX, CY + 40, id(font_med), ink, TextAlign::CENTER, "shh");
          // The sky, above the eyes: a moon at night and bedtime, a sun by
          // day, a sun half-risen when it is almost morning.
          // OUTSIDE THE BOX ON PURPOSE, and 144 not 138 for the same reason:
          // the longest sun ray is 22 px and 36 + 22 = 58, which clears the
          // box's top edge at 60 with two rows to spare. An animation frame
          // does not draw the sky at all -- it is not clipped away, it is not
          // reached -- so the moon is never rewritten and cannot blink. A full
          // frame redraws it, and full frames only happen when something has
          // actually changed.
          if (sky && !partial) {
            const int sy = CY - 144;
            const bool flat = id(grow_flat_art).state;
            if (st == 0 || st == 4 || st == 3) {
              if (!flat && id(grow_block_art).state) {
                // Pixel-art crescent, stepped from the real geometry: outer
                // disc R, bite disc Rb offset right and up, sampled at each
                // band's centre. Seven bands, so the run-length changes six
                // times instead of the circle's forty-odd.
                const float R = 20.0f, Rb = 15.0f, bx = 9.0f, by = -4.5f;
                const int N = 7;
                for (int i = 0; i < N; i++) {
                  const int y0 = (int) (-R + (2.0f * R * i) / N);
                  const int y1 = (int) (-R + (2.0f * R * (i + 1)) / N);
                  const float ym = (y0 + y1) * 0.5f;
                  if (fabsf(ym) >= R) continue;
                  const float half = sqrtf(R * R - ym * ym);
                  float xl = -half, xr = half;
                  const float d = Rb * Rb - (ym - by) * (ym - by);
                  if (d > 0.0f) xr = std::min(xr, bx - sqrtf(d));
                  if (xr - xl < 2.0f) continue;
                  it.filled_rectangle(CX + (int) xl, sy + y0, (int) (xr - xl), y1 - y0, ink);
                }
              } else if (flat) {
                // A PLAIN SQUARE, no bite. The first attempt kept the crescent
                // by subtracting an offset square, which renders as an L -- and
                // an L is two widths stacked, so its run-length still changes
                // row to row and the test would have proved nothing. The whole
                // point is a shape whose width is CONSTANT down every row.
                // It does not look like a moon. It is not meant to; it is an
                // instrument, and it goes back off after the reading.
                it.filled_rectangle(CX - 16, sy - 16, 32, 32, ink);
              } else {
                it.filled_circle(CX, sy, 16, ink);
                it.filled_circle(CX + 7, sy - 4, 13, field);
              }
            } else {
              if (flat) it.filled_rectangle(CX - 11, sy - 11, 22, 22, ink);
              else       it.filled_circle(CX, sy, 11, ink);
              // The rays are diagonal lines, which are staircases too -- they
              // have to go in flat mode or they contaminate the reading.
              for (int i = 0; !flat && i < 8; i++) {
                const float a = i * 3.14159265f / 4.0f;
                it.line(CX + (int) lroundf(15 * cosf(a)), sy + (int) lroundf(15 * sinf(a)),
                        CX + (int) lroundf(22 * cosf(a)), sy + (int) lroundf(22 * sinf(a)), ink);
              }
              if (st == 1)                          // the horizon: half a sun
                it.filled_rectangle(CX - 26, sy + 2, 52, 24, field);
            }
          }
        } else if (fs == "sun and moon") {
          if (st == 0 || st == 4 || st == 3) {
            it.filled_circle(CX, CY - 10, 70, ink);              // moon...
            it.filled_circle(CX + 28, CY - 24, 62, field);       // ...with a bite out
            const int sx[5] = {-120, -95, 105, 125, 60}, sy[5] = {-60, 70, -80, 20, -125};
            for (int i = 0; i < 5; i++) it.filled_circle(CX + sx[i], CY + sy[i], 5, ink);
          } else {
            it.filled_circle(CX, CY - 10, 60, ink);
            for (int i = 0; i < 12; i++) {
              const float a = i * 3.14159265f / 6.0f;
              it.line(CX + (int) lroundf(78 * cosf(a)),  CY - 10 + (int) lroundf(78 * sinf(a)),
                      CX + (int) lroundf(105 * cosf(a)), CY - 10 + (int) lroundf(105 * sinf(a)), ink);
            }
          }
          if (sound) it.print(CX, CY + 100, id(font_med), ink, TextAlign::CENTER, "shh");
          }   // eyeband
        }
        // The countdown: minutes to wake while it is almost morning, minutes
        // to bed in the bedtime warning. Where the stars would be.
        if (id(grow_show_countdown).state && (st == 1 || st == 3) && id(grow_min_to) >= 0) {
          char cb[12]; snprintf(cb, sizeof(cb), "%d min", id(grow_min_to));
          // CY + 40, not CY + 72. It used to sit on the star row, which is
          // below the animation box now -- the box would have chopped the top
          // off the glyphs on every animation frame and a full frame would have
          // put them back once a minute. Directly under the eyes it is inside
          // the box, redrawn with them, and where the yawn would have been.
          // On the sun-and-moon face the picture owns the middle, so it goes
          // up top where the chord is still 100 px wide.
          const int cy_ = (fs == "sun and moon") ? CY - 150 : CY + 40;
          it.print(CX, cy_, id(font_med), ink, TextAlign::CENTER, cb);
        }

        // An animation frame ends here. EVERYTHING BELOW IS STATIC between
        // full frames -- the star row, the time -- and static is precisely
        // what must not be rewritten while the panel is scanning. It keeps
        // what it already has.
        if (partial) { it.end_clipping(); return; }

        // Stars until morning: a row under the eyes, lit ones solid, spent
        // ones faint. The row is grow_star_count wide at up to 28 px pitch;
        // y = CY + 72 has 165 px of half-width on the round panel.
        if (id(grow_stars).state && (st == 0 || st == 4)) {
          const int NS = std::max(3, std::min(12, (int) id(grow_star_count).state));
          const int pitch = std::min(28, 220 / std::max(1, NS - 1));
          const bool pointy = id(grow_star_shape).current_option().str() == "stars";
          int lit = (int) ceilf(id(grow_frac) * NS); if (lit > NS) lit = NS;
          for (int i = 0; i < NS; i++) {
            const int x = CX - (NS - 1) * pitch / 2 + i * pitch, y = CY + 72;
            const Color c = i < lit ? ink : dim(ink, 0.18f);
            if (id(grow_flat_art).state) {         // straight edges only
              it.filled_rectangle(x - 6, y - 6, 13, 13, c);
            } else if (id(grow_block_art).state) {  // a sparkle from two bars
              it.filled_rectangle(x - 2, y - 7, 5, 15, c);
              it.filled_rectangle(x - 7, y - 2, 15, 5, c);
            } else if (pointy) {                   // a four-point sparkle
              it.filled_triangle(x, y - 9, x - 3, y, x + 3, y, c);
              it.filled_triangle(x, y + 9, x - 3, y, x + 3, y, c);
              it.filled_triangle(x - 9, y, x, y - 3, x, y + 3, c);
              it.filled_triangle(x + 9, y, x, y - 3, x, y + 3, c);
            } else it.filled_circle(x, y, 6, c);
          }
        }

        // The time, digital, along the bottom. 48 px digits centred at
        // CY + 120: "12:34" is about 119 px wide and the chord there is 249.
        if (id(grow_show_time).state && now.is_valid()) {
          char tb[8]; int hh = now.hour;
          if (!h24) { hh %= 12; if (hh == 0) hh = 12; }
          snprintf(tb, sizeof(tb), "%d:%02d", hh, now.minute);
          if (h24) {
            it.print(CX, CY + 120, id(font_t48), ink, TextAlign::CENTER, tb);
          } else {
            // "7:05 am". font_small so it reads as a suffix rather than a
            // fourth digit, and THE PAIR is centred, not the digits -- centre
            // the digits alone and the whole time shifts sideways when the
            // hour goes from 9 to 10.
            //
            // Baselines are aligned, not boxes. Bottom-aligning two line boxes
            // of different sizes leaves the small one floating, because most of
            // the difference is descender that neither string uses.
            const char *ap = now.hour < 12 ? "am" : "pm";
            int gx_, gy_, tw, th, aw, ah;
            it.get_text_bounds(0, 0, tb, id(font_t48), TextAlign::TOP_LEFT,
                               &gx_, &gy_, &tw, &th);
            it.get_text_bounds(0, 0, ap, id(font_small), TextAlign::TOP_LEFT,
                               &gx_, &gy_, &aw, &ah);
            const int GAP = 7;
            const int top  = CY + 120 - th/2;
            const int left = CX - (tw + GAP + aw)/2;
            const int base = top + id(font_t48)->get_baseline();
            it.print(left, top, id(font_t48), ink, TextAlign::TOP_LEFT, tb);
            it.print(left + tw + GAP, base - id(font_small)->get_baseline(),
                     id(font_small), ink, TextAlign::TOP_LEFT, ap);
          }
        }
        return;
      }

      // Night blanks the SCREEN only. The ring keeps the time, because the
      // clock is the one thing that must survive every setting on this page.
      if (id(night_blank).state && id(auto_dim).state && now.is_valid()) {
        const int h = now.hour;
        const int ns = (int) lroundf(id(night_start).state);
        const int ne = (int) lroundf(id(night_end).state);
        const bool night = (ns == ne) ? false
                         : (ns > ne)  ? (h >= ns || h < ne)
                                      : (h >= ns && h < ne);
        if (night) { it.fill(Color::BLACK); return; }
      }

      const Color ground = Color(10, 12, 18);
      Color bg = ground;
      if (id(show_weather).state) {
        if      (cond == "sunny")            bg = Color(46, 34,  6);
        else if (cond == "clear-night")      bg = Color( 8, 10, 26);
        else if (cond == "partlycloudy")     bg = Color(28, 30, 38);
        else if (cond == "cloudy")           bg = Color(22, 24, 28);
        else if (cond == "fog")              bg = Color(26, 26, 30);
        else if (cond == "rainy" ||
                 cond == "pouring")          bg = Color( 8, 20, 40);
        else if (cond == "lightning" ||
                 cond == "lightning-rainy")  bg = Color(38, 24, 46);
        else if (cond == "snowy")            bg = Color(30, 36, 44);
        else if (cond == "windy")            bg = Color(16, 30, 30);

        // Blend the weather colour back towards the plain ground. 0% leaves
        // the near-black the rest of the face was designed against; 100% is
        // the full tint.
        const float ts = id(tint_strength).state / 100.0f;
        bg = Color((uint8_t) lroundf(ground.r + (bg.r - ground.r) * ts),
                   (uint8_t) lroundf(ground.g + (bg.g - ground.g) * ts),
                   (uint8_t) lroundf(ground.b + (bg.b - ground.b) * ts));
      }

      // ---- work out what this screen should be showing ------------------
      // Same rule as the ring, deliberately: a timeout that clears one surface
      // and not the other would be a bug you only meet at 6 a.m.
      bool alert = id(timer_alert).state
                   && (id(alert_seconds).state <= 0.0f
                       || (uint32_t)(millis() - id(alert_since))
                          < (uint32_t) lroundf(id(alert_seconds).state * 1000.0f));
      int  left  = -1;
      if (!alert && now.is_valid()) {
        const float fin = id(timer_finish_epoch).state;
        if (!std::isnan(fin) && fin > 0) {
          const int rem = (int) lroundf(fin - (float) now.timestamp);
          if (rem > 0) left = rem;
        }
      }

      if (alert) {
        // Timer finished. The whole screen becomes the alert, pulsing in step
        // with the ring so the two read as one object.
        const bool on = (now.second % 2) == 0;
        it.filled_circle(CX, CY, 180, on ? Color(120, 40, 0) : Color(40, 14, 0));
        it.print(CX, CY - 12, id(font_big), Color(255, 255, 255),
                 TextAlign::CENTER, "0:00");
        const std::string lbl = id(timer_label).state;
        it.printf(CX, CY + 78, id(font_med), Color(255, 220, 190),
                  TextAlign::CENTER, "%s finished",
                  lbl.empty() ? "timer" : lbl.c_str());
        return;
      }

      it.filled_circle(CX, CY, 180, bg);

      // The Echo Wall Clock leaves the time in the middle and lets the ring do
      // the counting. That is the default here. `countdown` restores the older
      // behaviour where the timer takes the screen and the clock drops to a
      // subtitle. Either way the RING drains — that part is not optional.
      if (left >= 0 && id(timer_screen).current_option().str() == "countdown") {
        // A timer is running and has been given the screen: it gets the big
        // numerals, the clock drops to a subtitle.
        const int m = left / 60, s = left % 60;
        it.printf(CX, CY - 34, id(font_big), c_timer,
                  TextAlign::CENTER, "%d:%02d", m, s);

        // Whose timer, when it was given a name.
        const std::string lbl = id(timer_label).state;
        if (!lbl.empty() && lbl != "unknown")
          it.printf(CX, CY + 40, id(font_small), dim(c_timer, 0.84f),
                    TextAlign::CENTER, "%s", lbl.c_str());

        if (h24)
          it.strftime(CX, CY + 74, id(font_med), Color(150, 162, 185),
                      TextAlign::CENTER, "%H:%M", now);
        else
          it.printf(CX, CY + 74, id(font_med), Color(150, 162, 185),
                    TextAlign::CENTER, "%d:%02d", hour12(now.hour), now.minute);

        // ---- THE OTHER TIMERS -------------------------------------------
        // The ring can only give these a single pip each. The screen is where
        // a third and fourth timer are actually legible, so they are listed
        // here as a row of remaining times, soonest first.
        const float nextfin = id(timer_finish_epoch).state;
        float others[5]; int no = 0;
        const float fins[5] = { id(t1_fin).state, id(t2_fin).state,
                                id(t3_fin).state, id(t4_fin).state,
                                id(t5_fin).state };
        for (int k = 0; k < 5; k++) {
          const float f = fins[k];
          if (std::isnan(f) || f <= 0) continue;
          if (f <= (float) now.timestamp) continue;
          if (!std::isnan(nextfin) && fabsf(f - nextfin) < 0.5f) continue;
          others[no++] = f;
        }
        for (int a = 0; a < no; a++)          // tiny list, insertion sort
          for (int b = a + 1; b < no; b++)
            if (others[b] < others[a]) { float t = others[a]; others[a] = others[b]; others[b] = t; }

        for (int k = 0; k < no && k < 3; k++) {
          const int r = (int) lroundf(others[k] - (float) now.timestamp);
          it.printf(CX, CY + 106 + k * 22, id(font_small), dim(c_timer, 0.63f),
                    TextAlign::CENTER, "+ %d:%02d", r / 60, r % 60);
        }

      } else if (now.is_valid()) {

        if (face == "analog ring") {
          // ---- ANALOG RING ---------------------------------------------------
          // The dial is pushed out to the rim so the screen and the physical
          // LED ring read as ONE instrument rather than two clocks that happen
          // to agree.
          //
          // The trick is quantisation. A smooth drawn hand and a ring that can
          // only light whole LEDs disagree by up to half a pixel-step, and the
          // eye catches it immediately — the screen looks right and the ring
          // looks wrong. So every outer mark here snaps to the SAME positions
          // the ring can light: round(f * N) / N.
          //
          // No twelve_oclock_offset is applied, and that is deliberate. The
          // offset renumbers which LED is twelve; it does not move where twelve
          // physically sits. Twelve is the top of the object on both surfaces,
          // so both use frac 0 -> -90 degrees and they line up by construction.
          const int RN = std::max(4, std::min(60, (int) lroundf(id(ring_size).state)));
          const float TAU = 6.28318f;

          // The panel is 360 px, so the last drawable pixel is r=179. The dial
          // is built OUT from that edge rather than in from a comfortable
          // margin — the point is for the drawn dial and the LED ring beyond
          // the bezel to look like one continuous instrument, and a visible gap
          // between them destroys that in a way nothing else can fix.
          const int RIM = 179;

          auto ang  = [TAU](float f) { return f * TAU - 1.5708f; };
          auto qang = [TAU, RN](float f) {
            return (roundf(f * RN) / (float) RN) * TAU - 1.5708f;
          };

          // Marks are RADIAL, not dots. A dot can never reach the edge: its own
          // radius has to fit inside the panel, so a 4 px dot centred at 175
          // already overhangs. A line lying along the radius ends exactly where
          // you tell it to.
          auto radial = [&](float f, int r0, int r1, int w, Color c) {
            const float a = qang(f), ca = cosf(a), sa = sinf(a);
            const float px = -sa, py = ca;
            for (int o = -(w / 2); o <= w / 2; o++) {
              const int dx = (int) lroundf(px * o), dy = (int) lroundf(py * o);
              it.line(CX + (int) lroundf(ca * r0) + dx,
                      CY + (int) lroundf(sa * r0) + dy,
                      CX + (int) lroundf(ca * r1) + dx,
                      CY + (int) lroundf(sa * r1) + dy, c);
            }
          };
          // ESPHome lines are one pixel and one pixel vanishes at this size, so
          // hands are several parallel lines offset along the normal.
          auto hand = [&](float a, int r, int w, Color c) {
            const float ca = cosf(a), sa = sinf(a), px = -sa, py = ca;
            for (int o = -(w / 2); o <= w / 2; o++)
              it.line(CX + (int) lroundf(px * o), CY + (int) lroundf(py * o),
                      CX + (int) lroundf(ca * r) + (int) lroundf(px * o),
                      CY + (int) lroundf(sa * r) + (int) lroundf(py * o), c);
          };

          // ---- dial: one tick per LED, every tick ending at the rim ---------
          {
            const float mb = id(marker_bright).state / 100.0f;
            const Color tk = Color((uint8_t)(78*mb), (uint8_t)(84*mb), (uint8_t)(100*mb));
            const Color hr = Color((uint8_t)(170*mb), (uint8_t)(178*mb), (uint8_t)(200*mb));
            const std::string ms = id(marker_style).current_option().str();
            if (ms != "none") {
              for (int k = 0; k < RN; k++) {
                const float f = (float) k / RN;
                const float h12 = f * 12.0f;
                const bool is_hour = fabsf(h12 - roundf(h12)) < 0.02f;
                if (ms == "quarters" && !(is_hour && ((int) roundf(h12)) % 3 == 0))
                  continue;
                if (is_hour) radial(f, 156, RIM, 3, hr);
                else         radial(f, 170, RIM, 1, tk);
              }
            }
          }

          // ---- timer echo: a band at the very rim, draining with the LEDs ---
          // Deliberately the same model as the ring, including the final
          // minute's reversal. If the screen and the LEDs disagreed about what
          // a timer looks like, the two would stop reading as one instrument —
          // which is the whole point of this face.
          if (left > 0) {
            const bool acw =
              id(arc_dir).current_option().str() == "anticlockwise";
            const float tot = id(timer_total_seconds).state;
            if (id(timer_style).current_option().str() == "minutes") {
              if (left > 60) {
                int mins = (int) ceilf(left / 60.0f);
                if (mins > RN) mins = RN;
                for (int i = 0; i < mins; i++)
                  radial(acw ? -(float) i / RN : (float) i / RN,
                         172, RIM, 3, dim(c_timer, 0.85f));
              } else {
                const int lit = (int) ceilf((left / 60.0f) * RN);
                for (int i = 0; i < lit; i++)
                  radial(acw ? (float) i / RN : -(float) i / RN,
                         172, RIM, 3, dim(c_timer, 0.85f));
              }
            } else if (!std::isnan(tot) && tot > 0.0f) {
              float ratio = left / tot;
              if (ratio > 1.0f) ratio = 1.0f;
              const int lit = (int) ceilf(ratio * RN);
              for (int i = 0; i < lit; i++)
                radial(acw ? -(float) i / RN : (float) i / RN,
                       172, RIM, 3, dim(c_timer, 0.85f));
            }
          }

          // ---- hands, running all the way out to the dial -------------------
          const float hf = fmodf((float) now.hour, 12.0f) / 12.0f
                         + now.minute / 720.0f;
          const float mf = now.minute / 60.0f + now.second / 3600.0f;
          hand(ang(hf), 112, 9, c_hour);
          hand(ang(mf), 162, 5, c_min);

          // The quantised rim mark for each hand — this is the piece that
          // literally lands on the same step the LED can light, so the hand and
          // the lit LED are radially in line.
          radial(hf, 150, RIM, 9, c_hour);
          radial(mf, 164, RIM, 5, c_min);

          if (id(show_seconds).state) {
            float sf = now.second / 60.0f;
            if (id(sec_style).current_option().str() == "sweep")
              sf = (now.second + (id(frame) % 20) / 20.0f) / 60.0f;
            const float sa = ang(sf);
            it.line(CX, CY, CX + (int) lroundf(cosf(sa) * 168),
                            CY + (int) lroundf(sinf(sa) * 168), c_sec);
            radial(sf, 168, RIM, 1, c_sec);
          }

          it.filled_circle(CX, CY, 7, Color(220, 220, 220));
          it.filled_circle(CX, CY, 3, Color(40, 44, 54));

          // ---- ana-digi complications, drawn last so hands never hide them --
          // The readout takes the end you chose and the date takes the other,
          // so no combination of the two can ever stack up on itself. Both sit
          // inside the sweep of the hands rather than fighting the dial at the
          // rim, and both are drawn after the hands — legibility is the whole
          // reason for putting a number on an analogue face.
          {
            const std::string dp = id(digi_pos).current_option().str();
            const std::string dz = id(digi_size).current_option().str();
            const int OFF = 96;
            if (dp != "off") {
              // A complication, not the face: this ladder tops out at 72 so it
              // stays inside the dial instead of colliding with the ticks.
              auto *fc = dz == "small"  ? id(font_med)
                       : dz == "medium" ? id(font_t48)
                                        : id(font_t72);
              const int ty = (dp == "top") ? -OFF : OFF;
              if (h24)
                it.strftime(CX, CY + ty, fc, Color(236, 241, 250),
                            TextAlign::CENTER, "%H:%M", now);
              else
                it.printf(CX, CY + ty, fc, Color(236, 241, 250),
                          TextAlign::CENTER, "%d:%02d", hour12(now.hour), now.minute);
            }
            const bool dd = id(show_date).state, ww = id(show_dow).state;
            const char *df = (dd && ww) ? "%a %d %b"
                           : dd         ? "%d %b"
                           : ww         ? "%A"
                                        : nullptr;
            if (df) {
              const int dy = (dp == "top") ? OFF : -OFF;
              it.strftime(CX, CY + dy, id(font_small), Color(150, 160, 182),
                          TextAlign::CENTER, df, now);
            }
          }

        } else if (face == "analog") {
          // Drawn hands on the LCD as well as the ring. Deliberately thin and
          // unfilled — the ring is the primary analogue read, this echoes it.
          it.circle(CX, CY, 150, Color(60, 66, 80));
          for (int m = 0; m < 12; m++) {
            const float a = (m / 12.0f) * 6.28318f - 1.5708f;
            it.filled_circle(CX + (int)(cosf(a) * 150), CY + (int)(sinf(a) * 150),
                             3, Color(90, 98, 118));
          }
          const float ha = ((fmodf((float) now.hour, 12.0f) / 12.0f)
                            + now.minute / 720.0f) * 6.28318f - 1.5708f;
          const float ma = (now.minute / 60.0f + now.second / 3600.0f)
                            * 6.28318f - 1.5708f;
          it.line(CX, CY, CX + (int)(cosf(ha) * 80),  CY + (int)(sinf(ha) * 80),
                  c_hour);
          it.line(CX, CY, CX + (int)(cosf(ma) * 125), CY + (int)(sinf(ma) * 125),
                  c_min);
          if (id(show_seconds).state) {
            const float sa = (now.second / 60.0f) * 6.28318f - 1.5708f;
            it.line(CX, CY, CX + (int)(cosf(sa) * 138), CY + (int)(sinf(sa) * 138),
                    c_sec);
          }
          it.filled_circle(CX, CY, 5, Color(220, 220, 220));

          // ---- ana-digi complications, drawn last so hands never hide them --
          // The readout takes the end you chose and the date takes the other,
          // so no combination of the two can ever stack up on itself. Both sit
          // inside the sweep of the hands rather than fighting the dial at the
          // rim, and both are drawn after the hands — legibility is the whole
          // reason for putting a number on an analogue face.
          {
            const std::string dp = id(digi_pos).current_option().str();
            const std::string dz = id(digi_size).current_option().str();
            const int OFF = 88;
            if (dp != "off") {
              // A complication, not the face: this ladder tops out at 72 so it
              // stays inside the dial instead of colliding with the ticks.
              auto *fc = dz == "small"  ? id(font_med)
                       : dz == "medium" ? id(font_t48)
                                        : id(font_t72);
              const int ty = (dp == "top") ? -OFF : OFF;
              if (h24)
                it.strftime(CX, CY + ty, fc, Color(236, 241, 250),
                            TextAlign::CENTER, "%H:%M", now);
              else
                it.printf(CX, CY + ty, fc, Color(236, 241, 250),
                          TextAlign::CENTER, "%d:%02d", hour12(now.hour), now.minute);
            }
            const bool dd = id(show_date).state, ww = id(show_dow).state;
            const char *df = (dd && ww) ? "%a %d %b"
                           : dd         ? "%d %b"
                           : ww         ? "%A"
                                        : nullptr;
            if (df) {
              const int dy = (dp == "top") ? OFF : -OFF;
              it.strftime(CX, CY + dy, id(font_small), Color(150, 160, 182),
                          TextAlign::CENTER, df, now);
            }
          }

        } else {
          // digital and minimal share the big numerals
          const std::string dsz = id(digi_size).current_option().str();
          auto *ftime = dsz == "small"  ? id(font_t72)
                      : dsz == "medium" ? id(font_t96)
                                        : id(font_big);
          if (h24)
            it.strftime(CX, CY - 22, ftime, Color(255, 255, 255),
                        TextAlign::CENTER, "%H:%M", now);
          else
            it.printf(CX, CY - 22, ftime, Color(255, 255, 255),
                      TextAlign::CENTER, "%d:%02d", hour12(now.hour), now.minute);

          if (face == "digital") {
            // Subtitle lines stack down a cursor rather than sitting at fixed
            // offsets, so turning any of them on or off closes the gap instead
            // of leaving a hole — and nothing can ever land on top of anything
            // else. The screen is round: past about CY+150 a centred line is
            // already running out of width, which is why the cursor stops.
            int y = CY + 62;
            const int STEP = 40;
            const int Y_LIMIT = CY + 150;

            const bool d = id(show_date).state, w = id(show_dow).state;
            const char *dfmt = (d && w) ? "%a %d %b"
                             : d        ? "%d %b"
                             : w        ? "%A"
                                        : nullptr;
            if (dfmt && y <= Y_LIMIT) {
              it.strftime(CX, y, id(font_med), Color(196, 206, 226),
                          TextAlign::CENTER, dfmt, now);
              y += STEP;
            }

            if (id(show_weather).state) {
              if (!std::isnan(id(weather_temp).state) && y <= Y_LIMIT) {
                it.printf(CX, y, id(font_med), Color(210, 220, 240),
                          TextAlign::CENTER, "%.0f°C", id(weather_temp).state);
                y += STEP;
              }
              if (!cond.empty() && cond != "unknown" && y <= Y_LIMIT) {
                // HA conditions are hyphenated slugs; make them readable.
                std::string pretty = cond;
                for (auto &ch : pretty) if (ch == '-') ch = ' ';
                it.printf(CX, y, id(font_small), Color(140, 152, 175),
                          TextAlign::CENTER, "%s", pretty.c_str());
                y += STEP;
              }
            }

            if (!h24 && y <= Y_LIMIT)
              it.printf(CX, y, id(font_small), Color(120, 130, 150),
                        TextAlign::CENTER, "%s", now.hour < 12 ? "AM" : "PM");
          }
        }

      } else {
        // Deliberate "I don't know the time" state, matching the ring's crawl.
        it.print(CX, CY - 22, id(font_big), Color(90, 70, 30),
                 TextAlign::CENTER, "--:--");
        it.print(CX, CY + 62, id(font_small), Color(90, 80, 60),
                 TextAlign::CENTER, "waiting for time");
      }

      // Stale-status hint, matching the ring's red tint at 6 o'clock.
      if (!id(ha_connected))
        it.filled_circle(CX, CY + 140, 4, Color(120, 30, 30));

# -----------------------------------------------------------------------------
# THE BAR DISPLAY — 1.9" ST7789V2, 170x320 native, drawn landscape as 320x170
# -----------------------------------------------------------------------------
# Sam has a couple of these and wanted the clock to take either panel. It is a
# genuinely different shape, not a smaller round one, so it gets its own layout
# rather than a scaled copy of the round face. What survives the change of shape
# is the DESIGN PRIORITY at the top of this file:
#
#     reliable clock  >  timers  >  status
#
# which on a 320x170 strip means: the time is always drawn and always the
# largest thing on the panel; a running timer takes the middle third and pushes
# the time up rather than replacing it; weather and date fill what is left.
#
# The round face's analogue styles are NOT offered here. `clock_face` = analog
# on a bar would be a circle in a letterbox with two thirds of the panel wasted,
# and pretending otherwise would make a control that does nothing useful. The
# bar is digital; the ring is the analogue movement, which is the whole idea.
#
# GEOMETRY, and where the numbers come from:
#   native      170 (H) x 320 (V), ST7789V2, per Waveshare's module page
#   offset      35 in the width. The ST7789 controller has 240x320 of RAM and a
#               170-wide panel is centred in it, so (240-170)/2 = 35. This is
#               the same figure ESPHome's own T-EMBED and T-DISPLAY-S3 models
#               carry for their 170x320 panels -- see mipi_spi/models/lilygo.py.
#   rotation    90 deg, so the long axis lies across the clock face.
#
# color_order and invert_colors are the values ESPHome uses for every other
# 170x320 ST7789 it ships (BGR, inverted). If the image comes out as a photo
# negative flip invert_colors; if red and blue swap, flip color_order. Those are
# the only two things about this panel that are taken on inheritance rather than
# measured, and each is a one-line change. (unverified on this exact module)
#
# NOTE THE INDENTATION: this is a SECOND ITEM in the display: list opened
# further up, not a second display: key. A duplicate top-level key is not an
# error in YAML -- the later one silently REPLACES the earlier -- and the
# first draft of this block did exactly that, deleting the round panel. The
# comment block above sits at column 0 on purpose; comments have no
# indentation semantics, so the list continues straight through it.
  - platform: mipi_spi
    model: ST7789V
    id: bar_lcd
    spi_id: lcd_bus
    cs_pin: ${lcd_cs_bar}         # its own — never the round panel's
    dc_pin:                       # shared: only meaningful while CS is low
      number: ${lcd_dc}
      allow_other_uses: true
    reset_pin: ${lcd_reset_bar}   # its own — see the dispatcher's comment
    dimensions:
      width: 170
      height: 320
      offset_width: 35
      offset_height: 0
    color_order: bgr
    invert_colors: true
    rotation: 90°
    data_rate: 40MHz
    pixel_mode: 16bit
    update_interval: never        # the dispatcher drives this
    auto_clear_enabled: false     # see face_lcd: partial flushes for the eyes
    lambda: |-
      if (!id(an_partial)) it.fill(Color::BLACK);   // what auto-clear used to do
      // Canvas after rotation: 320 wide, 170 tall.
      const int W = 320, H = 170;
      auto now = id(ha_time).now();

      // ---- power, then night blank: identical rule to the round face --------
      // Same guards, same order, deliberately: a setting that blanks one panel
      // and not the other would be a bug that only shows up at 3 a.m.
      if (!id(display_on).state || !id(screen_on).state) {
        it.fill(Color::BLACK); return;
      }

      // ---- GROW CLOCK, on the bar: the same states, laid out for 320 x 170 --
      if (id(grow_mode).state && !id(grow_daytime)) {
        const int st = id(grow_st);
        const std::string sc = id(grow_sleep_colour).current_option().str();
        const std::string wc = id(grow_wake_colour).current_option().str();
        const std::string ac = id(grow_almost_colour).current_option().str();
        const std::string bc = id(grow_bedtime_colour).current_option().str();
        const std::string fs = id(grow_face).current_option().str();
        // Same two palettes as the round panel; see there.
        const bool glow = fs == "eyes" || fs == "eyes and sky";
        const bool sky  = fs == "eyes and sky";
        const bool partial = id(an_partial);
        if (partial && !glow && fs != "eyes on colour") return;
        Color field, ink;
        if (glow) {
          field = Color(0, 0, 0);
          if (st == 0 || st == 4) {
            ink = sc == "red" ? Color(255, 40, 30) : sc == "purple" ? Color(170, 60, 255)
                : sc == "off" ? Color(50, 50, 60) : Color(40, 100, 255);
          } else if (st == 1) {
            ink = ac == "yellow" ? Color(255, 220, 60) : ac == "green" ? Color(60, 230, 80)
                : ac == "white" ? Color(240, 240, 240) : Color(255, 150, 30);
          } else if (st == 2) {
            ink = wc == "green" ? Color(60, 230, 80) : wc == "white" ? Color(240, 240, 240)
                : Color(255, 210, 40);
          } else {
            ink = bc == "red" ? Color(255, 40, 30) : bc == "purple" ? Color(170, 60, 255)
                : bc == "blue" ? Color(40, 100, 255) : Color(255, 120, 50);
          }
        } else if (st == 0 || st == 4) {
          field = sc == "red" ? Color(90, 10, 10) : sc == "purple" ? Color(50, 10, 80)
                : sc == "off" ? Color(0, 0, 0) : Color(10, 18, 80);
          ink = Color(225, 228, 240);
        } else if (st == 1) {
          field = ac == "yellow" ? Color(230, 200, 40) : ac == "green" ? Color(40, 160, 60)
                : ac == "white" ? Color(200, 200, 200) : Color(200, 120, 20);
          ink = ac == "green" ? Color(10, 40, 16) : Color(40, 24, 4);
        } else if (st == 2) {
          field = wc == "green" ? Color(40, 180, 60) : wc == "white" ? Color(220, 220, 220)
                : Color(240, 200, 40);
          ink = Color(40, 32, 8);
        } else {
          field = bc == "red" ? Color(90, 10, 10) : bc == "purple" ? Color(50, 10, 80)
                : bc == "blue" ? Color(10, 18, 80) : Color(140, 60, 20);
          ink = Color(240, 225, 200);
        }
        if (!partial) it.fill(field);
        const bool sound = id(grow_sound).state && (st == 0 || st == 4)
            && id(grow_sound_since) != 0
            && (uint32_t)(millis() - id(grow_sound_since))
               < (uint32_t) lroundf(id(grow_sound_secs).state * 1000.0f);
        auto rrect = [&](int x, int y, int w, int h, int r, Color c) {
          it.filled_rectangle(x + r, y, w - 2 * r, h, c);
          it.filled_rectangle(x, y + r, w, h - 2 * r, c);
          it.filled_circle(x + r, y + r, r, c);
          it.filled_circle(x + w - 1 - r, y + r, r, c);
          it.filled_circle(x + r, y + h - 1 - r, r, c);
          it.filled_circle(x + w - 1 - r, y + h - 1 - r, r, c);
        };
        auto dim = [](Color c, float k) {
          return Color((uint8_t) (c.r * k), (uint8_t) (c.g * k), (uint8_t) (c.b * k));
        };
        const int FX = W / 2;
        if (glow || fs == "eyes on colour") {
          // The round panel's eyes at bar scale, from the same animator
          // globals. Mirrored in preview/grow_faces.py; change both.
          const int EX = 40, EY = 56, EW = 48, EH = 72, ER = 18, BAR = 10;
          // Every band alive, exactly as on the round panel -- see the long
          // comment there. This panel is 170 tall after rotation.
          // Clipped animation frame, as on the round panel. FULL WIDTH here:
          // this panel's sky sits top-left at x = 30 and its "shh" top-right,
          // both outside any box drawn round the eyes. To y = 116, so the
          // countdown at 120 and the time at 148 are untouched.
          if (partial) {
            it.start_clipping(0, 0, W, 116);
            // filled_rectangle, not fill(): see the round panel above. Same
            // pixels, same dirty box, without walking the whole panel per band.
            it.filled_rectangle(0, 0, W, 116, field);
          }
          const float droop = st == 3 ? 1.0f : 0.0f;
          auto eye = [&](int cx, int cy, float lid, float smile, float hs, bool outer_left) {
            const int h = (int) (EH * hs), w = EW;
            const int r = std::min(ER, h / 2 - 1);
            if (lid >= 0.9f) {
              rrect(cx - w / 2, cy - BAR / 2, w, BAR, BAR / 2, ink);
              return;
            }
            rrect(cx - w / 2, cy - h / 2, w, h, r, ink);
            const int x0 = cx - w / 2 - 1, top = cy - h / 2 - 1;
            if (lid > 0.02f) {
              const int L = (int) (h * lid);
              it.filled_rectangle(x0, top, w + 2, L + 1, field);
              if (droop > 0.0f) {
                const int d = std::max(4, (int) (EH / 8.0f * droop));
                if (outer_left) it.filled_triangle(x0, top + L, x0 + w + 2, top + L, x0, top + L + d, field);
                else            it.filled_triangle(x0, top + L, x0 + w + 2, top + L, x0 + w + 2, top + L + d, field);
              }
            }
            if (smile > 0.02f) {                     // the same bite, same clip
              // CLIPPED TO THE EYE, and it has to be. The bite is a circle of
              // radius 0.9w whose centre sits BELOW the eye, so most of it is
              // outside it: at the resting awake smile of 0.35 it reaches
              // about 70 px past the eye's bottom. On the round panel that is
              // over the countdown and the digital time; on the bar it is
              // over the time. A full frame redraws both, so there was never
              // anything wrong to look at -- until the animation frames
              // started reaching the panel, and then the time was being
              // erased and repainted at the animation rate. That is what Sam
              // saw as the graphics flickering. Drawn as spans rather than as
              // a circle so it cannot reach past the eye it is biting.
              const int Rb = (int) (w * 0.9f);
              const int yc = cy + h / 2 + Rb - (int) (smile * h * 0.78f);
              const int y0 = std::max(cy - h / 2, yc - Rb);
              const int y1 = std::min(cy + h / 2, yc + Rb);
              for (int yy = y0; yy <= y1; yy++) {
                const int dy = yy - yc;
                const int dx = (int) sqrtf((float) (Rb * Rb - dy * dy));
                if (dx > 0) it.filled_rectangle(cx - dx, yy, 2 * dx + 1, 1, field);
              }
            }
          };
          // gaze at 0.6 of the round panel's, like everything else here
          const int gx = (int) lroundf(id(an_dgx) * 0.6f), gy = (int) lroundf(id(an_dgy) * 0.6f);
          eye(FX - EX + gx, EY + gy, id(an_dlidl), id(an_dsmile), id(an_dhs), true);
          eye(FX + EX + gx, EY + gy, id(an_dlidr), id(an_dsmile), id(an_dhs), false);
          if (id(an_dmouth) > 0.05f) {
            const int r = 3 + (int) (7 * id(an_dmouth));
            it.filled_circle(FX + gx, EY + EH / 2 + 12 + gy, r, ink);
            if (r > 5) it.filled_circle(FX + gx, EY + EH / 2 + 12 + gy, r - 4, field);
          }
          if (st == 0 || st == 4) {
            for (int i = 0; i < 3; i++) {
              const float ph = fmodf(id(an_dzph) + i / 3.0f, 1.0f);
              it.print(FX + 62 + (int) (10 * ph), 24 - (int) (16 * ph), id(font_med),
                       dim(ink, 1.0f - ph * 0.9f), TextAlign::CENTER, "z");
            }
          }
          if (sky) {                               // top-left, inside the clip
            const int sx = 30, sy = 24;
            if (st == 0 || st == 4 || st == 3) {
              it.filled_circle(sx, sy, 11, ink); it.filled_circle(sx + 5, sy - 3, 9, field);
            } else {
              it.filled_circle(sx, sy, 8, ink);
              for (int i = 0; i < 8; i++) {
                const float a = i * 3.14159265f / 4.0f;
                it.line(sx + (int) lroundf(11 * cosf(a)), sy + (int) lroundf(11 * sinf(a)),
                        sx + (int) lroundf(16 * cosf(a)), sy + (int) lroundf(16 * sinf(a)), ink);
              }
              if (st == 1) it.filled_rectangle(sx - 18, sy + 2, 36, 16, field);
            }
          }
        } else if (fs == "sun and moon") {
          if (st == 0 || st == 4 || st == 3) {
            it.filled_circle(FX, 70, 46, ink); it.filled_circle(FX + 18, 60, 40, field);
          } else {
            it.filled_circle(FX, 70, 40, ink);
            for (int i = 0; i < 12; i++) {
              const float a = i * 3.14159265f / 6.0f;
              it.line(FX + (int) lroundf(52 * cosf(a)), 70 + (int) lroundf(52 * sinf(a)),
                      FX + (int) lroundf(68 * cosf(a)), 70 + (int) lroundf(68 * sinf(a)), ink);
            }
          }
        }
        if (sound) it.print(W - 12, 10, id(font_med), ink, TextAlign::TOP_RIGHT, "shh");
        if (partial) { it.end_clipping(); return; }
        if (id(grow_stars).state && (st == 0 || st == 4)) {
          const int NS = std::max(3, std::min(12, (int) id(grow_star_count).state));
          const int pitch = std::min(20, 160 / std::max(1, NS - 1));
          const bool pointy = id(grow_star_shape).current_option().str() == "stars";
          int lit = (int) ceilf(id(grow_frac) * NS); if (lit > NS) lit = NS;
          for (int i = 0; i < NS; i++) {
            const int x = FX - (NS - 1) * pitch / 2 + i * pitch, y = 120;
            const Color c = i < lit ? ink : dim(ink, 0.18f);
            if (pointy) {
              it.filled_triangle(x, y - 6, x - 2, y, x + 2, y, c);
              it.filled_triangle(x, y + 6, x - 2, y, x + 2, y, c);
              it.filled_triangle(x - 6, y, x, y - 2, x, y + 2, c);
              it.filled_triangle(x + 6, y, x, y - 2, x, y + 2, c);
            } else it.filled_circle(x, y, 4, c);
          }
        }
        if (id(grow_show_countdown).state && (st == 1 || st == 3) && id(grow_min_to) >= 0) {
          char cb[12]; snprintf(cb, sizeof(cb), "%d min", id(grow_min_to));
          if (fs == "sun and moon") it.print(12, 10, id(font_small), ink, TextAlign::TOP_LEFT, cb);
          else                      it.print(FX, 120, id(font_small), ink, TextAlign::CENTER, cb);
        }
        // The time, digital, along the bottom.
        if (id(grow_show_time).state && now.is_valid()) {
          char tb[8]; int hh = now.hour;
          if (!id(fmt_24h).state) { hh %= 12; if (hh == 0) hh = 12; }
          snprintf(tb, sizeof(tb), "%d:%02d", hh, now.minute);
          if (id(fmt_24h).state) {
            it.print(FX, 148, id(font_med), ink, TextAlign::CENTER, tb);
          } else {                              // same rule as the round panel
            const char *ap = now.hour < 12 ? "am" : "pm";
            int gx_, gy_, tw, th, aw, ah;
            it.get_text_bounds(0, 0, tb, id(font_med), TextAlign::TOP_LEFT,
                               &gx_, &gy_, &tw, &th);
            it.get_text_bounds(0, 0, ap, id(font_small), TextAlign::TOP_LEFT,
                               &gx_, &gy_, &aw, &ah);
            const int GAP = 5;
            const int top  = 148 - th/2;
            const int left = FX - (tw + GAP + aw)/2;
            const int base = top + id(font_med)->get_baseline();
            it.print(left, top, id(font_med), ink, TextAlign::TOP_LEFT, tb);
            it.print(left + tw + GAP, base - id(font_small)->get_baseline(),
                     id(font_small), ink, TextAlign::TOP_LEFT, ap);
          }
        }
        return;
      }
      if (id(night_blank).state && id(auto_dim).state && now.is_valid()) {
        const int h  = now.hour;
        const int ns = (int) lroundf(id(night_start).state);
        const int ne = (int) lroundf(id(night_end).state);
        const bool night = (ns == ne) ? false
                         : (ns > ne)  ? (h >= ns || h < ne)
                                      : (h >= ns && h < ne);
        if (night) { it.fill(Color::BLACK); return; }
      }

      // ---- palette, resolved once under `interval:` like everywhere else ----
      const Color c_hour  = Color(id(pal_scr)[0], id(pal_scr)[1],  id(pal_scr)[2]);
      const Color c_sec   = Color(id(pal_scr)[6], id(pal_scr)[7],  id(pal_scr)[8]);
      const Color c_timer = Color(id(pal_scr)[9], id(pal_scr)[10], id(pal_scr)[11]);
      const Color ground  = Color(10, 12, 18);
      it.fill(ground);

      if (!now.is_valid()) {
        it.print(W / 2, H / 2, id(font_med), c_sec, TextAlign::CENTER, "--:--");
        return;
      }

      char tbuf[8];
      const bool h24 = id(fmt_24h).state;
      int hh = now.hour;
      if (!h24) { hh = hh % 12; if (hh == 0) hh = 12; }
      snprintf(tbuf, sizeof(tbuf), "%d:%02d", hh, now.minute);

      // ---- timer alert takes the whole panel --------------------------------
      // The one case where the clock yields, and only because a finished timer
      // is the single most time-critical thing this device ever says.
      if (id(timer_alert).state
          && (id(alert_seconds).state <= 0.0f
              || (uint32_t)(millis() - id(alert_since))
                 < (uint32_t) lroundf(id(alert_seconds).state * 1000.0f))) {
        const bool on = (now.second % 2) == 0;
        it.filled_rectangle(0, 0, W, H, on ? Color(120, 40, 0) : Color(40, 14, 0));
        it.print(W / 2, 62, id(font_t72), Color(255, 255, 255),
                 TextAlign::CENTER, "0:00");
        const std::string lbl = id(timer_label).state;
        it.printf(W / 2, 132, id(font_med), Color(255, 220, 190),
                  TextAlign::CENTER, "%s finished",
                  lbl.empty() ? "timer" : lbl.c_str());
        return;
      }

      // ---- is a timer running? ----------------------------------------------
      // current_option(), NOT .state. `timer_screen` is a SELECT and a select's
      // .state is a std::string, so `if (id(timer_screen).state)` does not
      // compile -- "could not convert std::string to bool". It also would not
      // have meant the right thing if it had: the options are "keep clock" and
      // "countdown", and only the second one wants this branch. This is what
      // the round panel does at its own timer block, and the two now agree.
      //
      // WORTH KNOWING: `esphome config` passes this file with the bug in it.
      // Validation checks the YAML schema and never compiles the lambdas, so a
      // type error inside one only appears at `esphome compile`. Validating is
      // not the same as building.
      int left = -1;
      if (id(timer_screen).current_option().str() == "countdown") {
        const float fin = id(timer_finish_epoch).state;
        if (!std::isnan(fin) && fin > 0) {
          const int rem = (int) lroundf(fin - (float) now.timestamp);
          if (rem > 0) left = rem;
        }
      }

      if (left >= 0) {
        // Time shrinks and moves to the top-left corner. It does NOT disappear:
        // clock > timers, and a glance at a wall clock has to answer "what time
        // is it" even while something is counting down.
        it.print(10, 6, id(font_t48), c_hour, TextAlign::TOP_LEFT, tbuf);

        char cbuf[12];
        if (left >= 3600)
          snprintf(cbuf, sizeof(cbuf), "%d:%02d:%02d", left / 3600, (left / 60) % 60, left % 60);
        else
          snprintf(cbuf, sizeof(cbuf), "%d:%02d", left / 60, left % 60);
        it.print(W - 10, 12, id(font_t72), c_timer, TextAlign::TOP_RIGHT, cbuf);

        const std::string lbl = id(timer_label).state;
        if (!lbl.empty())
          it.print(W - 10, 96, id(font_small), c_sec, TextAlign::TOP_RIGHT, lbl.c_str());

        // Progress bar along the bottom. Drawn as elapsed-from-the-left so it
        // drains toward zero the same way the ring's arc does.
        const float total = id(timer_total_seconds).state;
        if (!std::isnan(total) && total > 0) {
          const float frac = 1.0f - ((float) left / total);
          const int   bx0 = 10, bx1 = W - 10, by = H - 22;
          it.rectangle(bx0, by, bx1 - bx0, 12, Color(40, 44, 52));
          const int w = (int) lroundf((bx1 - bx0 - 2) * (frac < 0 ? 0 : frac > 1 ? 1 : frac));
          if (w > 0) it.filled_rectangle(bx0 + 1, by + 1, w, 10, c_timer);
        }
        return;
      }

      // ---- idle: the time is the panel ---------------------------------------
      // font_t96 puts "12:34" at roughly 2.48 x 96 = 238 px, which leaves 41 px
      // either side of a 320 px panel. font_big (118) would be 293 and would
      // crowd the seconds off the edge, so this is the largest honest size here
      // -- the same argument the round face makes for 118 over 132.
      const int ty = id(show_date).state || id(show_weather).state ? 58 : H / 2;
      it.print(W / 2, ty, id(font_t96), c_hour, TextAlign::CENTER, tbuf);

      if (id(show_seconds).state) {
        char sbuf[6];
        snprintf(sbuf, sizeof(sbuf), ":%02d", now.second);
        it.print(W - 8, ty + 26, id(font_med), c_sec, TextAlign::BASELINE_RIGHT, sbuf);
      }

      // ---- one subtitle line, date and weather sharing it --------------------
      // A bar has room for exactly one line under the time. Rather than pick
      // one and drop the other, they take an end each -- which is also what the
      // round face does with the digital sub-dial and the date.
      const int sy = 128;
      if (id(show_date).state) {
        static const char *dows[7] = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
        char dbuf[24];
        if (id(show_dow).state)
          snprintf(dbuf, sizeof(dbuf), "%s %d/%d",
                   dows[now.day_of_week - 1], now.day_of_month, now.month);
        else
          snprintf(dbuf, sizeof(dbuf), "%d/%d", now.day_of_month, now.month);
        it.print(id(show_weather).state ? 10 : W / 2, sy, id(font_med), c_sec,
                 id(show_weather).state ? TextAlign::TOP_LEFT : TextAlign::TOP_CENTER,
                 dbuf);
      }

      if (id(show_weather).state) {
        const float tC = id(weather_temp).state;
        if (!std::isnan(tC))
          it.printf(W - 10, sy, id(font_med), c_hour, TextAlign::TOP_RIGHT,
                    "%.1f°", tC);
      }

      // Stale-status hint, in the same corner and the same red the round face
      // uses at 6 o'clock, so the two panels fail in a recognisably same way.
      if (!id(ha_connected))
        it.filled_rectangle(W / 2 - 4, H - 8, 8, 4, Color(120, 30, 30));
