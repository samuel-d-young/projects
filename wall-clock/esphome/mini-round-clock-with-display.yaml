  - platform: template
    id: tint_strength
    name: "Weather tint strength"
    entity_category: config
    icon: mdi:gradient-horizontal
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 100
    optimistic: true
    restore_value: true

  - platform: template
