# =============================================================================
# mini-round-clock.yaml — THE build
# ESP32-S3-N16R8  +  Mokungi 24-LED WS2812B ring (92/71 mm)  +  360x360 round LCD
# =============================================================================
# Analogue time on the ring, digital time and weather on the display in the
# middle, Assist timer progress on both, ambient household status when idle.
#
# DESIGN PRIORITY (the tiebreaker for every decision below):
#     reliable clock  >  timers  >  status
#
# WHY THIS BOARD
#   A 360x360 RGB565 framebuffer is 360 x 360 x 2 = 259,200 bytes = 253 KB.
#   ESP8266 has ~30 KB of heap; a PSRAM-less ESP32 has ~160 KB. Neither is
#   close. ESPHome's ST77916 model declares `requires={"psram"}`, so a config
#   without PSRAM is REFUSED at validation. The N16R8's 8 MB of octal PSRAM is
#   exactly what satisfies it.
#
# !! THE DISPLAY SECTION IS COMMENTED OUT — READ THIS !!
#   This panel is a GC9B72, not an ST77916, and its header
#   (TE SDO BL CS DC RST SDA SCL VCC GND) is single 4-wire SPI, not QSPI.
#   ESPHome 2026.8.0 ships NO GC9B72 model, so it needs `model: CUSTOM` plus
#   the panel's init sequence, which is not published anywhere verifiable.
#   The RING config below is complete and works TODAY — flash it, get the clock
#   running, and re-enable the display once the init sequence is in hand.
#
# !! CHECK THE DISPLAY PINS BEFORE FLASHING !!
#   `model: ESP-VOCAT` ships Espressif's init sequence AND the ESP-VoCat v1.2
#   board's pin defaults, because that is where the init data came from. Your
#   panel is almost certainly wired differently. The GPIOs are substitutions
#   below — correct them against your module first.
#
# Verified against ESPHome 2026.8.0 source. `esphome config` NOT yet run.
# =============================================================================

substitutions:
  # Must match the device name in ESPHome Device Builder exactly — it sets
  # the hostname (mini-round-clock.local), the OTA target, and the prefix on
  # every entity this device creates in Home Assistant.
  # ESPHome allows lowercase, digits and hyphens, max 24 chars. This is 16.
  device_name: mini-round-clock
  friendly_name: Mini Round Clock

  # The render reads the real LED count from the strip at runtime, so this
  # only has to be right for the light component itself.
  # Default ring size, and the initial value of the runtime "Ring LED count"
  # number. Changing the ring later is done from Home Assistant, not here.
  num_leds: "24"

  # COMPILE-TIME CEILING. The RMT buffer is sized to this, so it is the largest
  # ring this firmware can drive. Raising it costs a little RAM and a longer
  # write (60 LEDs is ~1.8 ms at 20 fps, which is nothing). Only a ring BIGGER
  # than this needs a reflash.
  max_leds: "60"

  # ---- LED ring ------------------------------------------------------------
  led_pin: GPIO5              # keep clear of the QSPI pins below

  # Which physical LED sits at 12 o'clock. Run Mode = "test chase", see where
  # the red pixel lands, put the offset here. Positive rotates clockwise.
  twelve_oclock_offset: "0"

  # ---- DISPLAY PINS — one per header pad, any free GPIO ---------------------
  # Header reads:  TE  SDO  BL  CS  DC  RST  SDA  SCL  VCC  GND
  #   SCL -> clk    SDA -> mosi    SDO -> miso (reads only, usually unconnected)
  #   VCC -> 3V3    GND -> GND     TE  -> optional, leave unconnected
  lcd_clk: GPIO12             # SCL
  lcd_mosi: GPIO11            # SDA
  lcd_cs: GPIO10              # CS
  lcd_dc: GPIO13              # DC
  lcd_reset: GPIO14           # RST
  lcd_backlight: GPIO21       # BL

  # ---- overnight dimming, local 24h time -----------------------------------
  # To disable auto-dim entirely, set both to the same number.
  night_start_hour: "22"
  night_end_hour: "7"

  # ---- your Home Assistant weather entity ----------------------------------
  weather_entity: weather.home

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    # Priority 600 = after hardware init, before network. Lighting the ring
    # this early makes a boot loop visible rather than silent.
    - priority: 600
      then:
        - light.turn_on:
            id: ring
            brightness: 100%     # full scale; real dimming happens in the
            effect: "Face"       # render lambda, see BRIGHTNESS below
        - light.turn_on:
            id: backlight
            brightness: 80%
        - logger.log: "Boot: ring on, backlight on, display pending init sequence"

esp32:
  variant: esp32s3
  # If ESPHome does not pick up all 16 MB of flash, set an explicit `board:`.
  # Not set by default because the right board id depends on your module and a
  # wrong one is worse than the auto-selected default. (unverified)

# 8 MB octal PSRAM. `octal` is what the R8 suffix means — a quad-PSRAM part
# (R2, R8Q) needs `mode: quad` and will fail to initialise with this.
psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0   # CH343 USB-UART bridge on this board (VID 1A86), NOT native USB-JTAG
  level: INFO          # DEBUG floods the log with per-frame render noise

# -----------------------------------------------------------------------------
# API
# -----------------------------------------------------------------------------
api:
  encryption:
    # API *password* auth was REMOVED in ESPHome 2026.1.0 — a config with
    # `password:` here will not compile. Generate the key with:
    #     openssl rand -base64 32
    key: !secret wall_clock_api_key

  # ===========================================================================
  # THE MOST IMPORTANT LINE IN THIS FILE
  # ===========================================================================
  # Default is 15min: the device REBOOTS itself if no API client connects for
  # that long. During a Home Assistant outage the clock would reboot, and with
  # no battery-backed RTC a power-on reset loses the time entirely — so the
  # clock would go dark exactly when we most want it working.
  # REVERT: delete this line to restore the 15min default.
  reboot_timeout: 0s

  # Track connectivity so the render can show that STATUS is stale while still
  # showing the time. Setting a local global is safe here; note that calling a
  # Home Assistant action from on_client_connected can be silently dropped,
  # because HA starts listening for device actions shortly AFTER the connection
  # is established. Never put a homeassistant.action here without a delay.
  on_client_connected:
    - lambda: 'id(ha_connected) = true;'
  on_client_disconnected:
    - lambda: 'id(ha_connected) = false;'

ota:
  - platform: esphome
    password: !secret wall_clock_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s   # same reasoning as the API timeout above
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret wall_clock_ap_password

captive_portal:

# -----------------------------------------------------------------------------
# TIME — two sources, deliberately
# -----------------------------------------------------------------------------
# Home Assistant is primary AND the timezone authority: it pushes a POSIX TZ
# string *plus pre-parsed DST rules* with the epoch, and the device stores them,
# so DST transitions happen on-device even if HA is unreachable at the moment.
#
# When HA is unreachable the clock FREE-RUNS from its last sync — verified by
# reading homeassistant_time.cpp: with no clients there is no request and no
# error path. An outage does not disturb the displayed time at all.
#
# SNTP closes the one residual gap: a POWER-ON RESET loses the ESP32 RTC, so a
# power blip while HA is also down would leave no time at all on boot.
time:
  - platform: homeassistant
    id: ha_time
    # NO `timezone:` here on purpose — setting one would STOP HA pushing
    # timezone updates, which is the opposite of what we want.

  - platform: sntp
    id: sntp_time
    # The ONE hand-set value in this file. It applies only to a cold boot while
    # HA is unreachable; HA overrides it on the first successful sync. Without
    # it that boot would show UTC — confidently wrong time on the wall.
    timezone: Australia/Melbourne
    update_interval: 6h

# -----------------------------------------------------------------------------
# DISPLAY — DISABLED until the GC9B72 init sequence is in hand
# -----------------------------------------------------------------------------
#   was                      now                      because
#   -----------------------  -----------------------  --------------------------
#   spi: type: quad          type: single (default)   header is SDA+SCL+SDO,
#   data_pins: [4 pins]      clk_pin + mosi_pin       not D0-D3 -> 4-wire SPI
#   model: ESP-VOCAT         model: CUSTOM            ESP-VOCAT is an ST77916
#   (init from the model)    init_sequence: REQUIRED  ESPHome ships no GC9B72
#
# TO FINISH: the init sequence lives in your module's demo code — a header like
# LCD_Driver.h / gc9b72_init.h, or an `initcmd[]` array in an Arduino example.
# Send me that file and I will convert it to ESPHome's `init_sequence:` form.
# ESPHome appends SLPOUT/DISPON and the reset pulse itself, so those get dropped.
#
# Do NOT substitute a GC9A01 sequence. GC9A01 is a 240x240 part; its gamma and
# power tables will give you a blank or garbled panel that looks exactly like a
# wiring fault, and you will chase pins for hours.
#
# spi:
#   - id: lcd_bus
#     clk_pin: ${lcd_clk}
#     mosi_pin: ${lcd_mosi}

output:
  - platform: ledc
    pin: ${lcd_backlight}
    id: backlight_out

# -----------------------------------------------------------------------------
# STATE IMPORTED FROM HOME ASSISTANT
# -----------------------------------------------------------------------------
# All of this degrades safely: if HA is unreachable these stop updating and the
# render treats absent (NaN) values as "feature off".
#
# NOTE ON THE TIMER DESIGN. HA's timer entity has a `remaining` attribute, but
# it does NOT tick down while running — it is written once at start and only
# recomputed on pause/change. Its `duration`/`remaining` are also "H:MM:SS"
# STRINGS which the numeric sensor platform cannot import at all. So the HA
# package publishes the ABSOLUTE finish time as a unix epoch — static while the
# timer runs — and this device counts down against it locally. No drift.
sensor:
  - platform: homeassistant
    id: timer_finish_epoch
    entity_id: sensor.wall_clock_timer_finish_epoch     # 0 = no timer
  - platform: homeassistant
    id: timer_total_seconds
    entity_id: sensor.wall_clock_timer_total
    # Arc denominator. Can GROW mid-timer on "add five minutes" — the render
    # clamps so the arc never jumps backwards past full.

  # ---- MULTI-TIMER: one finish epoch per pool slot ------------------------
  # The Echo Wall Clock draws the NEXT-expiring timer as a full depleting arc
  # and gives every other running timer a single indicator LED at the position
  # where it will finish. These five feed those pips; the arc still comes from
  # timer_finish_epoch above, which HA defines as "whichever expires soonest".
  #
  # Five flat sensors rather than one packed string on purpose — ESPHome
  # imports numbers natively, and parsing a delimited blob inside a lambda is
  # the kind of thing that fails silently.
  #
  # 0 = that slot is not running.
  - platform: homeassistant
    id: t1_fin
    entity_id: sensor.wall_clock_timer_1_finish_epoch
  - platform: homeassistant
    id: t2_fin
    entity_id: sensor.wall_clock_timer_2_finish_epoch
  - platform: homeassistant
    id: t3_fin
    entity_id: sensor.wall_clock_timer_3_finish_epoch
  - platform: homeassistant
    id: t4_fin
    entity_id: sensor.wall_clock_timer_4_finish_epoch
  - platform: homeassistant
    id: t5_fin
    entity_id: sensor.wall_clock_timer_5_finish_epoch
  - platform: homeassistant
    id: weather_temp
    entity_id: ${weather_entity}
    attribute: temperature

text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: ${weather_entity}      # the entity STATE is the condition slug
  - platform: homeassistant
    id: next_bin
    entity_id: sensor.next_bin        # "Green waste" / "Recycling"
  - platform: homeassistant
    id: timer_label
    entity_id: sensor.wall_clock_timer_label   # name of the next timer, or empty

binary_sensor:
  - platform: homeassistant
    id: timer_alert
    entity_id: binary_sensor.wall_clock_timer_alert
  - platform: homeassistant
    id: bin_night
    entity_id: binary_sensor.wall_clock_bin_night
  - platform: homeassistant
    id: garage_open
    entity_id: binary_sensor.wall_clock_garage_open
  - platform: homeassistant
    id: driveway_unknown
    entity_id: binary_sensor.wall_clock_driveway_unknown
  # Four discrete sensors rather than a packed bitmask — each is individually
  # visible in HA dev tools when something looks wrong.
  - platform: homeassistant
    id: home_sam
    entity_id: binary_sensor.wall_clock_home_sam
  - platform: homeassistant
    id: home_laura
    entity_id: binary_sensor.wall_clock_home_laura
  - platform: homeassistant
    id: home_amanda
    entity_id: binary_sensor.wall_clock_home_amanda
  - platform: homeassistant
    id: home_zac
    entity_id: binary_sensor.wall_clock_home_zac

# -----------------------------------------------------------------------------
# CONTROLS EXPOSED TO HOME ASSISTANT
# -----------------------------------------------------------------------------
number:
  # ---- Ring geometry -------------------------------------------------------
  # HOW MANY LEDs ARE ACTUALLY ON YOUR RING.
  #
  # esp32_rmt_led_strip's own `num_leds:` is COMPILE-TIME — it sizes the RMT
  # buffer and cannot be a runtime value. So the strip is declared at
  # ${max_leds} (the largest ring this build supports) and this number says how
  # many of those are physically present. The render uses this count and leaves
  # the rest dark.
  #
  # Driving a chain shorter than the declared length is harmless: the surplus
  # bits simply fall off the end of the chain with nothing to latch them.
  #
  # So: change this from Home Assistant for any ring up to ${max_leds}, no
  # reflash. Only a ring LARGER than ${max_leds} needs the substitution raised
  # and a reflash.
  - platform: template
    id: ring_size
    name: "Ring LED count"
    entity_category: config
    icon: mdi:led-strip-variant
    min_value: 8
    max_value: ${max_leds}
    step: 1
    initial_value: ${num_leds}
    optimistic: true
    restore_value: true

  # Which physical LED sits at 12 o'clock. Set Mode to "test chase" and watch
  # where the red pixel lands, then dial this until it is at the top.
  # Positive rotates clockwise. Was a compile-time substitution.
  - platform: template
    id: twelve_offset
    name: "Twelve o'clock offset"
    entity_category: config
    icon: mdi:rotate-right
    min_value: 0
    max_value: ${max_leds}
    step: 1
    initial_value: ${twelve_oclock_offset}
    optimistic: true
    restore_value: true

  # ---- Brightness ----------------------------------------------------------
  - platform: template
    id: day_brightness
    name: "Brightness"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 45
    optimistic: true
    restore_value: true
  - platform: template
    id: night_brightness
    name: "Night brightness"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 1
    max_value: 50
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true

  # ---- Auto-dim window -----------------------------------------------------
  # Was two compile-time substitutions. Set both to the same hour to disable
  # the window without touching the Auto dim switch.
  - platform: template
    id: night_start
    name: "Night starts"
    entity_category: config
    icon: mdi:weather-night
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23
    step: 1
    initial_value: ${night_start_hour}
    optimistic: true
    restore_value: true
  - platform: template
    id: night_end
    name: "Night ends"
    entity_category: config
    icon: mdi:weather-sunny
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23
    step: 1
    initial_value: ${night_end_hour}
    optimistic: true
    restore_value: true

select:
  - platform: template
    id: display_mode
    name: "Mode"
    entity_category: config
    options:
      - "auto"          # clock + timer + alert + ambient
      - "clock only"    # suppress ambient status, keep the timer arc
      - "clock bare"    # clock alone — fault-finding
      - "test chase"    # one pixel walks the ring: wiring / order / index check
    initial_option: "auto"
    optimistic: true
    restore_value: true

  # Face style for the LCD. The ring is always analogue — that is the point of
  # a ring — so this only changes the screen.
  - platform: template
    id: clock_face
    name: "Face"
    entity_category: config
    icon: mdi:clock-outline
    options:
      - "digital"       # big time, subtitle underneath
      - "minimal"       # time only, nothing else
      - "analog"        # drawn hands on the LCD as well as the ring
    initial_option: "digital"
    optimistic: true
    restore_value: true

  # Palette for hands and accents. "mono" is the accessible one — it drops all
  # hue coding, so nothing depends on telling red from green.
  - platform: template
    id: colour_theme
    name: "Colour theme"
    entity_category: config
    icon: mdi:palette
    options:
      - "default"
      - "warm"
      - "cool"
      - "mono"
    initial_option: "default"
    optimistic: true
    restore_value: true

switch:
  - platform: template
    id: display_on
    name: "Display"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: fmt_24h
    name: "24 hour time"
    entity_category: config
    icon: mdi:clock-digital
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: show_seconds
    name: "Second hand"
    entity_category: config
    icon: mdi:timer-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: show_weather
    name: "Show weather"
    entity_category: config
    icon: mdi:weather-partly-cloudy
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # The ambient hints on the ring: bin night, garage, driveway, who's home.
  - platform: template
    id: show_status
    name: "Show status hints"
    entity_category: config
    icon: mdi:information-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Echo-style indicator LEDs for timers that are NOT the next to expire.
  - platform: template
    id: show_pips
    name: "Show extra timer pips"
    entity_category: config
    icon: mdi:circle-small
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: auto_dim
    name: "Auto dim at night"
    entity_category: config
    icon: mdi:brightness-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

globals:
  # Drives pulses and the test chase. Deliberately independent of wall-clock
  # time so animations still run before the first sync.
  - id: frame
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ha_connected
    type: bool
    restore_value: no
    initial_value: 'false'

# -----------------------------------------------------------------------------
# LIGHTS
# -----------------------------------------------------------------------------
light:
  - platform: monochromatic
    output: backlight_out
    id: backlight
    name: "Backlight"
    restore_mode: ALWAYS_ON

  - platform: esp32_rmt_led_strip
    id: ring
    internal: true      # not exposed to HA — the number/select/switch above are
                        # the intended surface. Exposing the raw light too
                        # invites a state fight between HA's brightness slider
                        # and the cap, with no way to tell which one won.
    pin: ${led_pin}
    num_leds: ${max_leds}       # ceiling; actual count is the ring_size number

    # `WS2812B` is NOT valid here. The accepted set is exactly WS2811, WS2812,
    # SK6812, APA106, SM16703 — a WS2812B ring uses WS2812. (fastled_clockless
    # DID accept WS2812B, so a copy-paste from an old config fails validation.)
    chipset: WS2812

    # `rgb_order:` was DEPRECATED in ESPHome 2026.8.0 — this exact version.
    # channel_colors replaces it and absorbs the old is_rgbw/is_wrgb keys; the
    # two cannot be combined. If red and green come out swapped, change to RGB.
    channel_colors: GRB

    # Gamma OFF by design. The default of 2.8 would make the brightness number
    # non-linear (50% would be ~14% duty), and the cap has to double as the
    # power story. We want it honest: 50% means 50% of current.
    gamma_correct: 1.0

    default_transition_length: 0s   # transitions fight per-pixel rendering
    restore_mode: ALWAYS_ON

    effects:
      # An addressable_lambda only runs while that effect is SELECTED — it does
      # NOT run with effect "None". on_boot selects it and nothing deselects it;
      # all mode logic lives inside.
      #
      # The lambda becomes a plain FUNCTION POINTER, so it cannot capture.
      # All state arrives via id(). Inner lambdas may capture freely.
      - addressable_lambda:
          name: "Face"
          update_interval: 50ms     # 20fps: smooth second hand, light main loop
          lambda: |-
            // The strip is COMPILED at ${max_leds}, but the ring physically
            // present is whatever "Ring LED count" says in Home Assistant.
            // Render to that and leave the surplus dark, so one firmware drives
            // any ring up to the ceiling with no reflash.
            const int PHYS = it.size();
            int N = (int) lroundf(id(ring_size).state);
            if (N < 4 || N > PHYS) N = PHYS;      // unset or nonsense -> whole strip
            if (N > 256) N = 256;
            id(frame)++;

            // Layers composite here at FULL brightness and get scaled once on
            // write-out. That makes the cap a single auditable multiply that no
            // layer can bypass, and avoids reading pixels back off the strip.
            static Color buf[256];
            for (int i = 0; i < N; i++) buf[i] = Color(0, 0, 0);

            // Fractions of the circle, so the face is correct at any ring size.
            const int off = (int) lroundf(id(twelve_offset).state);
            auto P = [N, off](float frac) -> int {
              int p = (int) lroundf(frac * N) + off;
              p %= N; return p < 0 ? p + N : p;
            };
            auto add = [](int i, int r, int g, int b) {   // buf is static
              buf[i].r = (uint8_t) std::min(255, (int) buf[i].r + r);
              buf[i].g = (uint8_t) std::min(255, (int) buf[i].g + g);
              buf[i].b = (uint8_t) std::min(255, (int) buf[i].b + b);
            };

            const std::string mode  = id(display_mode).current_option().str();
            const std::string theme = id(colour_theme).current_option().str();
            const auto now = id(ha_time).now();
            if (!id(display_on).state) { it.all() = Color::BLACK; return; }

            // ---- THEME ------------------------------------------------------
            // Hand and arc colours only. "mono" deliberately drops hue coding
            // entirely, so nothing on the face depends on telling red from
            // green.
            int hourC[3] = {255, 90, 20}, minC[3] = {30, 120, 255}, secC[3] = {90, 90, 90};
            int timerC[3] = {0, 90, 80}, pipC[3] = {0, 60, 55};
            if (theme == "warm") {
              hourC[0]=255; hourC[1]=70;  hourC[2]=0;
              minC[0] =255; minC[1] =160; minC[2] =40;
              secC[0] =120; secC[1] =60;  secC[2] =20;
              timerC[0]=200; timerC[1]=80; timerC[2]=0;
              pipC[0] =120; pipC[1] =50;  pipC[2] =0;
            } else if (theme == "cool") {
              hourC[0]=120; hourC[1]=200; hourC[2]=255;
              minC[0] =40;  minC[1] =90;  minC[2] =255;
              secC[0] =60;  secC[1] =90;  secC[2] =120;
              timerC[0]=0;  timerC[1]=140; timerC[2]=200;
              pipC[0] =0;   pipC[1] =80;  pipC[2] =120;
            } else if (theme == "mono") {
              hourC[0]=255; hourC[1]=255; hourC[2]=255;
              minC[0] =150; minC[1] =150; minC[2] =150;
              secC[0] =60;  secC[1] =60;  secC[2] =60;
              timerC[0]=90; timerC[1]=90; timerC[2]=90;
              pipC[0] =55;  pipC[1] =55;  pipC[2] =55;
            }

            // ---- TEST CHASE: wiring, LED count, colour order, index 0 ------
            if (mode == "test chase") {
              add((id(frame) / 6) % N, 255, 255, 255);
              add(P(0.0f), 160, 0, 0);            // red marks 12 o'clock
            }

            // ---- NO TIME YET -----------------------------------------------
            // A confidently wrong clock is worse than an obviously broken one.
            else if (!now.is_valid()) {
              add((id(frame) / 12) % N, 40, 20, 0);
            }

            // ---- ALERT (highest priority) ----------------------------------
            else if (id(timer_alert).state && mode != "clock bare") {
              const float ph = (id(frame) % 20) / 20.0f;      // ~1Hz at 20fps
              const float k = 0.35f + 0.65f * fabsf(1.0f - 2.0f * ph);
              for (int i = 0; i < N; i++) add(i, (int)(255*k), (int)(60*k), 0);
            }

            // ---- NORMAL FACE -----------------------------------------------
            else {
              for (int m = 0; m < 12; m++) add(P(m / 12.0f), 14, 14, 18);

              bool timer_running = false;
              if (mode == "auto" || mode == "clock only") {
                const float fin = id(timer_finish_epoch).state;
                const float tot = id(timer_total_seconds).state;
                if (!std::isnan(fin) && fin > 0 && !std::isnan(tot) && tot > 0) {
                  const float left = fin - (float) now.timestamp;
                  if (left > 0) {
                    timer_running = true;
                    float ratio = left / tot;
                    if (ratio > 1.0f) ratio = 1.0f;   // "add 5 minutes" clamp
                    const int lit = (int) ceilf(ratio * N);
                    // Teal by default, so it can never be mistaken for a hand.
                    for (int i = 0; i < lit; i++)
                      add(P((float) i / N), timerC[0], timerC[1], timerC[2]);
                  }
                }

                // ---- ECHO-STYLE PIPS for the OTHER running timers ----------
                // The real Echo Wall Clock gives the next-expiring timer the
                // full depleting arc, and every OTHER running timer a single
                // LED sitting where it will finish. This is that.
                //
                // Position is the finish time mapped onto the minute dial, so
                // two timers ending at different times land in different places
                // and can be told apart at a glance.
                //
                // The timer that already owns the arc is skipped, or the
                // soonest timer would draw a redundant dot on itself.
                if (id(show_pips).state) {
                  const float nextfin = id(timer_finish_epoch).state;
                  const float fins[5] = { id(t1_fin).state, id(t2_fin).state,
                                          id(t3_fin).state, id(t4_fin).state,
                                          id(t5_fin).state };
                  for (int k = 0; k < 5; k++) {
                    const float f = fins[k];
                    if (std::isnan(f) || f <= 0) continue;
                    if (f <= (float) now.timestamp) continue;
                    if (!std::isnan(nextfin) && fabsf(f - nextfin) < 0.5f) continue;
                    // Where that wall-clock time falls on the minute dial.
                    const long secs = (long) f;
                    const float frac = (float) (secs % 3600L) / 3600.0f;
                    add(P(frac), pipC[0], pipC[1], pipC[2]);
                  }
                }
              }

              // ---- AMBIENT: accent pixels only, never anything hand-like ----
              if (mode == "auto" && !timer_running && id(show_status).state) {
                if (id(bin_night).state) {                 // 12 o'clock breathe
                  const float ph = (id(frame) % 60) / 60.0f;
                  const float k = 0.4f + 0.6f * fabsf(1.0f - 2.0f * ph);
                  if (id(next_bin).state == "Recycling")
                    add(P(0.0f), (int)(160*k), (int)(140*k), 0);   // yellow
                  else
                    add(P(0.0f), 0, (int)(150*k), (int)(30*k));    // green
                }
                if (id(garage_open).state)                 // 3 o'clock, amber
                  add(P(0.25f), 150, 70, 0);
                if (id(driveway_unknown).state) {          // 9 o'clock, red
                  const float k = ((id(frame) / 10) % 2) ? 1.0f : 0.25f;
                  add(P(0.75f), (int)(200*k), 0, 0);
                }
                const bool who[4] = { id(home_sam).state,    id(home_laura).state,
                                      id(home_amanda).state, id(home_zac).state };
                const int rgb[4][3] = { {0,40,90}, {90,0,70}, {0,70,40}, {70,50,0} };
                for (int w = 0; w < 4; w++)
                  if (who[w])
                    add(P(0.5f + (w - 1.5f) / N), rgb[w][0], rgb[w][1], rgb[w][2]);
              }

              // ---- HANDS, drawn last so they sit on top --------------------
              const float hf = fmodf((float) now.hour, 12.0f) / 12.0f
                             + now.minute / 720.0f;
              // On a 24-LED ring one pixel is 2.5 minutes, so the hour hand
              // gets no shoulders — they would swamp the dial. The same code on
              // a 60-LED ring gives a genuinely per-minute face.
              add(P(hf), hourC[0], hourC[1], hourC[2]);
              add(P(now.minute / 60.0f + now.second / 3600.0f), minC[0], minC[1], minC[2]);
              if (id(show_seconds).state)
                add(P(now.second / 60.0f), secC[0], secC[1], secC[2]);

              // HA dropped: tint 6 o'clock so it is visible from the room that
              // STATUS is stale. The time itself is still trustworthy.
              if (!id(ha_connected)) add(P(0.5f), 30, 0, 0);
            }

            // ---- BRIGHTNESS + WRITE-OUT: the single place it is applied ----
            // Night window is inclusive of start, exclusive of end, and handles
            // the wrap over midnight. Start == end means "no night window",
            // which is how you disable dimming by hours alone. If the time is
            // unknown we cannot tell day from night, so fall back to dimmer.
            float bri = id(day_brightness).state / 100.0f;
            if (!id(auto_dim).state) {
              // Auto dim off: day brightness around the clock.
            } else if (now.is_valid()) {
              const int h = now.hour;
              const int ns = (int) lroundf(id(night_start).state);
              const int ne = (int) lroundf(id(night_end).state);
              const bool night = (ns == ne) ? false
                               : (ns > ne)  ? (h >= ns || h < ne)
                                            : (h >= ns && h < ne);
              if (night) bri = id(night_brightness).state / 100.0f;
            } else {
              bri = id(night_brightness).state / 100.0f;
            }
            for (int i = 0; i < N; i++)
              it[i] = Color((uint8_t) lroundf(buf[i].r * bri),
                            (uint8_t) lroundf(buf[i].g * bri),
                            (uint8_t) lroundf(buf[i].b * bri));
            // Anything past the configured ring size stays dark, so a short
            // ring on a long-compiled strip does not show stale pixels.
            for (int i = N; i < PHYS; i++) it[i] = Color::BLACK;

# =============================================================================
# DISPLAY — verified GC9B72 init sequence (working on hardware 2026-08-24)
# =============================================================================
# If `esphome config` rejects anything here, or the panel comes up blank or
# garbled, fall back to mini-round-clock.yaml (ring only, known good) and read
# docs/gc9b72-display-block.yaml for what to do next. The ring does not depend
# on any of this.
# =============================================================================

spi:
  - id: lcd_bus
    clk_pin: ${lcd_clk}       # SCL
    mosi_pin: ${lcd_mosi}     # SDA

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 118
    bpp: 4                # anti-aliased; 1bpp digits look ragged this large
    glyphs: "0123456789:"
  - file: "gfonts://Roboto"
    id: font_med
    size: 32
    bpp: 4
    glyphs: "0123456789.:-°% abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
  - file: "gfonts://Roboto"
    id: font_small
    size: 22
    bpp: 4
    glyphs: "0123456789.:-°% abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"

# -----------------------------------------------------------------------------
# THE ROUND DISPLAY
# -----------------------------------------------------------------------------

display:
  - platform: mipi_spi
    model: CUSTOM
    id: face_lcd
    spi_id: lcd_bus
    cs_pin: ${lcd_cs}
    dc_pin: ${lcd_dc}
    reset_pin: ${lcd_reset}
    dimensions:
      width: 360
      height: 360
    data_rate: 20MHz          # 50MHz is what xboot uses; 20 is a safe first pass
    pixel_mode: 16bit         # MUST match COLMOD 0x05 in the table above
    invert_colors: false      # flip if the image looks like a photo negative
    update_interval: 1s
    init_sequence:
      # =====================================================================
      # GENUINE GC9B72 INIT SEQUENCE
      # ---------------------------------------------------------------------
      # Source: xboot/xstar, xstar/driver/framebuffer/fb-gc9b72.c (MIT,
      # Jianjun Jiang). Cross-checked byte-for-byte against the independent
      # port in MaliosDark/Arduino_GC9B72 (src/Arduino_GC9B72.h). These are
      # the only two known-good public GC9B72 inits and they agree exactly.
      #
      # This REPLACES the borrowed GC9B71 table that was here before. That
      # table was a different chip's and produced stripes on a solid fill.
      #
      # xboot drives this panel as plain 4-wire SPI, mode 0, at 50 MHz, with
      # separate CS / D-C / RST — which is exactly how this board is wired.
      # ---------------------------------------------------------------------
      # 0x11 SLPOUT and 0x29 DISPON are NOT listed here: mipi_spi appends
      # both, with the correct delays. Verified in components/mipi/__init__.py
      # at tag 2026.8.0, Model.get_sequence().
      #
      # 0x3A and 0x36 ARE listed, in their original position, because the
      # vendor sequence sets them mid-table. mipi_spi appends its own copies
      # afterwards regardless (get_sequence() appends PIXFMT unconditionally,
      # despite its docstring claiming otherwise) — so `pixel_mode` below MUST
      # stay 16bit, or ESPHome's trailing 0x3A will contradict this table.
      # =====================================================================

      # ---- unlock the inner (vendor) register page ------------------------
      - [0xFE]
      - [0xEF]

      # ---- power / regulator / gate timing --------------------------------
      - [0x80, 0x19]
      - [0x82, 0x09]
      - [0x83, 0x03]
      - [0x88, 0x00]
      - [0x89, 0x38]
      - [0x8A, 0x40]
      - [0x8B, 0x0A]
      - [0x8C, 0x00]
      - [0x81, 0xFF]
      - [0x84, 0xFF]
      - [0x85, 0xFF]
      - [0x86, 0xFF]
      - [0x87, 0xFF]
      - [0x8E, 0xFF]
      - [0x8F, 0xFF]
      - [0x98, 0x3E]
      - [0x99, 0x3E]
      - [0x7D, 0x72]
      - [0x70, 0x02, 0x03, 0x03, 0x06, 0x03, 0x03, 0x09, 0x07, 0x09, 0x03]
      - [0x90, 0x06, 0x06, 0x01, 0x01]
      - [0x93, 0x02, 0xFF, 0x00]
      - [0xCB, 0x02]
      - [0xFB, 0x00, 0x00]
      - [0xF6, 0xC0]
      - [0x6C, 0x00, 0x00, 0x22, 0x00, 0xCC, 0x04, 0x58]
      - [0xAA, 0x0B, 0x00]
      - [0xEC, 0x07]
      - [0xF9, 0x40]
      - [0xEB, 0x01, 0x67]
      - [0x74, 0x01, 0x60, 0x00, 0x00, 0x00, 0x00]
      - [0xB5, 0x14, 0x14, 0x14]

      # ---- gate driver / source mux mapping (32 bytes) ---------------------
      - [0x6E, 0x0B, 0x0B, 0x09, 0x09, 0x13, 0x13, 0x11, 0x11, 0x16, 0x15, 0x01, 0x04, 0x00, 0x0D, 0x1D, 0x00, 0x00, 0x1D, 0x0D, 0x00, 0x04, 0x08, 0x15, 0x16, 0x12, 0x12, 0x14, 0x14, 0x0A, 0x0A, 0x0C, 0x0C]

      # ---- panel drive waveforms ------------------------------------------
      - [0x60, 0x38, 0x1C, 0x13, 0x56]
      - [0x61, 0xF8, 0x0A, 0x13, 0x56]
      - [0x62, 0xF8, 0x0B, 0x13, 0x56]
      - [0x63, 0x38, 0x1C, 0x13, 0x56]
      - [0x64, 0x38, 0x20, 0x72, 0xF8, 0x13, 0x56]
      - [0x65, 0x78, 0x1A, 0x70, 0x0B, 0x56, 0x13]
      - [0x66, 0x38, 0x24, 0x72, 0xFC, 0x13, 0x56]
      - [0x68, 0xB3, 0x08, 0x0E, 0x08, 0x0E, 0x0A, 0x0A]
      - [0x69, 0xB3, 0x08, 0x0E, 0x08, 0x0E, 0x0A, 0x0A]
      - [0x6A, 0x00, 0x00]

      # ---- pixel format + memory access ------------------------------------
      - [0x3A, 0x05]            # COLMOD: 16 bit/px, RGB565
      - [0x36, 0x00]            # MADCTL: no mirror, no swap, RGB order

      # ---- VCOM / power levels ---------------------------------------------
      - [0x7C, 0xB6, 0x29]
      - [0xAC, 0x40]
      - [0xC3, 0x1A]
      - [0xC4, 0x24]
      - [0xC9, 0x2F]

      # ---- gamma (positive/negative, both banks) ---------------------------
      - [0xF0, 0x11, 0x17, 0x08, 0x06, 0x05, 0x38]
      - [0xF1, 0x4D, 0x72, 0x72, 0x2D, 0x34, 0x8F]
      - [0xF2, 0x11, 0x17, 0x08, 0x06, 0x05, 0x38]
      - [0xF3, 0x4D, 0x72, 0x72, 0x2D, 0x34, 0x8F]

      - [0xB4, 0x0A]
      - [0x35, 0x00]            # TE line on, mode 0

      # ---- lock the inner register page ------------------------------------
      - [0xFE]
      - [0xEE]
    lambda: |-
      const int CX = 180, CY = 180;
      const auto now = id(ha_time).now();
      const std::string face = id(clock_face).current_option().str();
      const bool h24 = id(fmt_24h).state;

      // 12/24 hour. Done by hand rather than with strftime %I because %I pads
      // to "09:30", which reads wrong on a clock face. This drops the zero.
      auto hour12 = [](int h) -> int { int v = h % 12; return v == 0 ? 12 : v; };

      // ---- background: weather wash ------------------------------------
      // Kept dark on purpose. This sits inside a lit LED ring; a bright
      // background would wash the ring out and be unreadable at night.
      std::string cond = id(weather_condition).state;
      Color bg = Color(10, 12, 18);
      if (id(show_weather).state) {
        if      (cond == "sunny")            bg = Color(46, 34,  6);
        else if (cond == "clear-night")      bg = Color( 8, 10, 26);
        else if (cond == "partlycloudy")     bg = Color(28, 30, 38);
        else if (cond == "cloudy")           bg = Color(22, 24, 28);
        else if (cond == "fog")              bg = Color(26, 26, 30);
        else if (cond == "rainy" ||
                 cond == "pouring")          bg = Color( 8, 20, 40);
        else if (cond == "lightning" ||
                 cond == "lightning-rainy")  bg = Color(38, 24, 46);
        else if (cond == "snowy")            bg = Color(30, 36, 44);
        else if (cond == "windy")            bg = Color(16, 30, 30);
      }

      // ---- work out what this screen should be showing ------------------
      bool alert = id(timer_alert).state;
      int  left  = -1;
      if (!alert && now.is_valid()) {
        const float fin = id(timer_finish_epoch).state;
        if (!std::isnan(fin) && fin > 0) {
          const int rem = (int) lroundf(fin - (float) now.timestamp);
          if (rem > 0) left = rem;
        }
      }

      if (alert) {
        // Timer finished. The whole screen becomes the alert, pulsing in step
        // with the ring so the two read as one object.
        const bool on = (now.second % 2) == 0;
        it.filled_circle(CX, CY, 180, on ? Color(120, 40, 0) : Color(40, 14, 0));
        it.print(CX, CY - 12, id(font_big), Color(255, 255, 255),
                 TextAlign::CENTER, "0:00");
        const std::string lbl = id(timer_label).state;
        it.printf(CX, CY + 78, id(font_med), Color(255, 220, 190),
                  TextAlign::CENTER, "%s finished",
                  lbl.empty() ? "timer" : lbl.c_str());
        return;
      }

      it.filled_circle(CX, CY, 180, bg);

      if (left >= 0) {
        // A timer is running: it gets the big numerals, the clock drops to a
        // subtitle. The thing you are waiting on should be the readable one.
        const int m = left / 60, s = left % 60;
        it.printf(CX, CY - 34, id(font_big), Color(120, 235, 220),
                  TextAlign::CENTER, "%d:%02d", m, s);

        // Whose timer, when it was given a name.
        const std::string lbl = id(timer_label).state;
        if (!lbl.empty() && lbl != "unknown")
          it.printf(CX, CY + 40, id(font_small), Color(120, 200, 195),
                    TextAlign::CENTER, "%s", lbl.c_str());

        if (h24)
          it.strftime(CX, CY + 74, id(font_med), Color(150, 162, 185),
                      TextAlign::CENTER, "%H:%M", now);
        else
          it.printf(CX, CY + 74, id(font_med), Color(150, 162, 185),
                    TextAlign::CENTER, "%d:%02d", hour12(now.hour), now.minute);

        // ---- THE OTHER TIMERS -------------------------------------------
        // The ring can only give these a single pip each. The screen is where
        // a third and fourth timer are actually legible, so they are listed
        // here as a row of remaining times, soonest first.
        const float nextfin = id(timer_finish_epoch).state;
        float others[5]; int no = 0;
        const float fins[5] = { id(t1_fin).state, id(t2_fin).state,
                                id(t3_fin).state, id(t4_fin).state,
                                id(t5_fin).state };
        for (int k = 0; k < 5; k++) {
          const float f = fins[k];
          if (std::isnan(f) || f <= 0) continue;
          if (f <= (float) now.timestamp) continue;
          if (!std::isnan(nextfin) && fabsf(f - nextfin) < 0.5f) continue;
          others[no++] = f;
        }
        for (int a = 0; a < no; a++)          // tiny list, insertion sort
          for (int b = a + 1; b < no; b++)
            if (others[b] < others[a]) { float t = others[a]; others[a] = others[b]; others[b] = t; }

        for (int k = 0; k < no && k < 3; k++) {
          const int r = (int) lroundf(others[k] - (float) now.timestamp);
          it.printf(CX, CY + 106 + k * 22, id(font_small), Color(90, 150, 148),
                    TextAlign::CENTER, "+ %d:%02d", r / 60, r % 60);
        }

      } else if (now.is_valid()) {

        if (face == "analog") {
          // Drawn hands on the LCD as well as the ring. Deliberately thin and
          // unfilled — the ring is the primary analogue read, this echoes it.
          it.circle(CX, CY, 150, Color(60, 66, 80));
          for (int m = 0; m < 12; m++) {
            const float a = (m / 12.0f) * 6.28318f - 1.5708f;
            it.filled_circle(CX + (int)(cosf(a) * 150), CY + (int)(sinf(a) * 150),
                             3, Color(90, 98, 118));
          }
          const float ha = ((fmodf((float) now.hour, 12.0f) / 12.0f)
                            + now.minute / 720.0f) * 6.28318f - 1.5708f;
          const float ma = (now.minute / 60.0f + now.second / 3600.0f)
                            * 6.28318f - 1.5708f;
          it.line(CX, CY, CX + (int)(cosf(ha) * 80),  CY + (int)(sinf(ha) * 80),
                  Color(255, 150, 60));
          it.line(CX, CY, CX + (int)(cosf(ma) * 125), CY + (int)(sinf(ma) * 125),
                  Color(120, 180, 255));
          if (id(show_seconds).state) {
            const float sa = (now.second / 60.0f) * 6.28318f - 1.5708f;
            it.line(CX, CY, CX + (int)(cosf(sa) * 138), CY + (int)(sinf(sa) * 138),
                    Color(150, 150, 150));
          }
          it.filled_circle(CX, CY, 5, Color(220, 220, 220));

        } else {
          // digital and minimal share the big numerals
          if (h24)
            it.strftime(CX, CY - 22, id(font_big), Color(255, 255, 255),
                        TextAlign::CENTER, "%H:%M", now);
          else
            it.printf(CX, CY - 22, id(font_big), Color(255, 255, 255),
                      TextAlign::CENTER, "%d:%02d", hour12(now.hour), now.minute);

          if (face == "digital") {
            if (id(show_weather).state) {
              if (!std::isnan(id(weather_temp).state))
                it.printf(CX, CY + 62, id(font_med), Color(210, 220, 240),
                          TextAlign::CENTER, "%.0f°C", id(weather_temp).state);
              if (!cond.empty() && cond != "unknown") {
                // HA conditions are hyphenated slugs; make them readable.
                std::string pretty = cond;
                for (auto &ch : pretty) if (ch == '-') ch = ' ';
                it.printf(CX, CY + 104, id(font_small), Color(140, 152, 175),
                          TextAlign::CENTER, "%s", pretty.c_str());
              }
            }
            if (!h24)
              it.printf(CX, CY + 140, id(font_small), Color(120, 130, 150),
                        TextAlign::CENTER, "%s", now.hour < 12 ? "AM" : "PM");
          }
        }

      } else {
        // Deliberate "I don't know the time" state, matching the ring's crawl.
        it.print(CX, CY - 22, id(font_big), Color(90, 70, 30),
                 TextAlign::CENTER, "--:--");
        it.print(CX, CY + 62, id(font_small), Color(90, 80, 60),
                 TextAlign::CENTER, "waiting for time");
      }

      // Stale-status hint, matching the ring's red tint at 6 o'clock.
      if (!id(ha_connected))
        it.filled_circle(CX, CY + 140, 4, Color(120, 30, 30));
