    min_value: 0
    max_value: 100
    step: 1
    initial_value: 88
    optimistic: true
    restore_value: true
  - platform: template
    id: min_val
    name: "Minute intensity"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
