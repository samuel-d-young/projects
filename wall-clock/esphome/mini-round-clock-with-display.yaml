  # Echo-style indicator LEDs for timers that are NOT the next to expire.
  - platform: template
    id: show_pips
    name: "Show extra timer pips"
    entity_category: config
    icon: mdi:circle-small
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: auto_dim
