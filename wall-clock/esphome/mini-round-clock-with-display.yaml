# =============================================================================
# mini-round-clock.yaml — THE build
# ESP32-S3-N16R8  +  Mokungi 24-LED WS2812B ring (92/71 mm)
#   +  EITHER a 360x360 round GC9B72 LCD  OR a 1.9" 320x170 ST7789 bar
# =============================================================================
# TWO PANELS, ONE FIRMWARE. Both drivers are compiled in; which one is DRAWN is
# a Home Assistant control ("Screen": auto / round 360x360 / bar 320x170) and
# "auto" follows a strap wire in the panel's own cable.
#
# The three facts that shape all of it, each verified rather than assumed:
#
#   1. NEITHER MODULE CAN TALK BACK. The round one brings SDO to its header but
#      it is unconnected and no miso_pin is declared; the bar module has no such
#      pin at all. So the controller ID cannot be read and auto-detection cannot
#      be electrical in the usual sense. It is a strap on ${panel_detect}, tied
#      to GND in the bar panel's cable -- which that panel needs anyway, being
#      an 8-pin header in a different order to the round one's 10.
#
#   2. THE INIT SEQUENCE IS GONE AFTER BOOT. mipi_spi runs it in setup() and
#      then calls init_sequence_.clear() (mipi_spi.h, 2026.8.0). "Re-initialise
#      the panel the user just picked" is therefore not possible at runtime by
#      any means, so both panels are initialised at boot instead.
#
#   3. WHICH IS ONLY SAFE BECAUSE EACH HAS ITS OWN CS *AND* ITS OWN RESET.
#      Sharing CS would send each panel the other's init; sharing RESET would
#      let the second component's reset pulse wipe the first panel after it had
#      been set up. CLK, MOSI, DC and BL are shared and can be -- DC only means
#      anything while a CS is low.
#
# The bar panel is digital-only: the analogue faces are round-only, because a
# circle in a letterbox wastes two thirds of the panel. See its lambda.
# =============================================================================
# Analogue time on the ring, digital time and weather on the display in the
# middle, Assist timer progress on both, ambient household status when idle.
#
# DESIGN PRIORITY (the tiebreaker for every decision below):
#     reliable clock  >  timers  >  status
#
# WHY THIS BOARD
#   A 360x360 RGB565 framebuffer is 360 x 360 x 2 = 259,200 bytes = 253 KB.
#   ESP8266 has ~30 KB of heap; a PSRAM-less ESP32 has ~160 KB. Neither is
#   close. ESPHome's ST77916 model declares `requires={"psram"}`, so a config
#   without PSRAM is REFUSED at validation. The N16R8's 8 MB of octal PSRAM is
#   exactly what satisfies it.
#
# DISPLAY: WORKING. The panel is a GC9B72 on single 4-wire SPI (header reads
#   TE SDO BL CS DC RST SDA SCL VCC GND — no D0-D3, so not QSPI). ESPHome 2026.8.0
#   ships no GC9B72 model, so this uses `model: CUSTOM` with the panel's real
#   init sequence, transcribed from xboot/xstar's fb-gc9b72.c and corroborated
#   byte-for-byte against MaliosDark/Arduino_GC9B72. Confirmed on hardware
#   2026-08-24 at 20 MHz, pixel_mode 16bit.
#
#   Do NOT substitute a GC9B71 or GC9A01 table. The GC9B71 was tried: same
#   family, same 360x360 geometry, same 0xFE/0xEF unlock pair — and it still
#   came out as stripes, because the register map differs. Family resemblance
#   is not the table.
#
# PINS are the real ones for this module, set in the substitutions below and
#   confirmed working — not the ESP-VoCat reference defaults the ST77916 model
#   would have brought with it.
#
# COLOUR is resolved in one place: see the palette resolver under `interval:`.
#   Neither render lambda does colour maths of its own.
# =============================================================================

substitutions:
  # Must match the device name in ESPHome Device Builder exactly — it sets
  # the hostname (mini-round-clock.local), the OTA target, and the prefix on
  # every entity this device creates in Home Assistant.
  # ESPHome allows lowercase, digits and hyphens, max 24 chars. This is 16.
  device_name: mini-round-clock
  friendly_name: Mini Round Clock

  # The render reads the real LED count from the strip at runtime, so this
  # only has to be right for the light component itself.
  # Default ring size, and the initial value of the runtime "Ring LED count"
  # number. Changing the ring later is done from Home Assistant, not here.
  num_leds: "24"

  # COMPILE-TIME CEILING. The RMT buffer is sized to this, so it is the largest
  # ring this firmware can drive. Raising it costs a little RAM and a longer
  # write (60 LEDs is ~1.8 ms at 20 fps, which is nothing). Only a ring BIGGER
  # than this needs a reflash.
  max_leds: "60"

  # ---- LED ring ------------------------------------------------------------
  led_pin: GPIO5              # keep clear of the QSPI pins below

  # Which physical LED sits at 12 o'clock. Run Mode = "test chase", see where
  # the red pixel lands, put the offset here. Positive rotates clockwise.
  twelve_oclock_offset: "0"

  # ---- DISPLAY PINS — one per header pad, any free GPIO ---------------------
  # Header reads:  TE  SDO  BL  CS  DC  RST  SDA  SCL  VCC  GND
  #   SCL -> clk    SDA -> mosi    SDO -> miso (reads only, usually unconnected)
  #   VCC -> 3V3    GND -> GND     TE  -> optional, leave unconnected
  lcd_clk: GPIO12             # SCL
  lcd_mosi: GPIO11            # SDA
  lcd_cs: GPIO10              # CS
  lcd_dc: GPIO13              # DC
  lcd_reset: GPIO14           # RST
  lcd_backlight: GPIO21       # BL

  # ---- SECOND PANEL: 1.9" ST7789 bar, 170x320 native --------------------
  # Its header is DIFFERENT and shorter: GND VCC SCL SDA RES DC CS BLK.
  # Eight pins, no SDO and no TE — verified against Waveshare's own wiki text
  # ("the data pin from the slave device to the host device is hidden as it
  # only needs to display") and corroborated by done.land's teardown of the
  # same module. That single fact decides the whole design below; see the
  # PANEL SELECTION block further down.
  #
  # CLK, MOSI, DC and BL are SHARED with the round panel. CS and RESET are
  # NOT, and must not be — see the comment on the second display entry.
  lcd_cs_bar: GPIO16          # CS  — its own, never shared
  lcd_reset_bar: GPIO17       # RES — its own, never shared

  # Tie this to GND in the BAR panel's cable, leave it open in the round
  # one's. That is the auto-detect: it cannot be done over SPI because
  # neither module can talk back.
  panel_detect: GPIO18

  # ---- overnight dimming, local 24h time -----------------------------------
  # To disable auto-dim entirely, set both to the same number.
  night_start_hour: "22"
  night_end_hour: "7"

  # ---- your Home Assistant weather entity ----------------------------------
  weather_entity: weather.home

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    # Priority 600 = after hardware init, before network. Lighting the ring
    # this early makes a boot loop visible rather than silent.
    - priority: 600
      then:
        - light.turn_on:
            id: ring
            brightness: 100%     # full scale; real dimming happens in the
            effect: "Face"       # render lambda, see BRIGHTNESS below
        - light.turn_on:
            id: backlight
            brightness: 80%
        - logger.log: "Boot: ring on, backlight on, display pending init sequence"

esp32:
  variant: esp32s3
  # If ESPHome does not pick up all 16 MB of flash, set an explicit `board:`.
  # Not set by default because the right board id depends on your module and a
  # wrong one is worse than the auto-selected default. (unverified)

# 8 MB octal PSRAM. `octal` is what the R8 suffix means — a quad-PSRAM part
# (R2, R8Q) needs `mode: quad` and will fail to initialise with this.
psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0   # CH343 USB-UART bridge on this board (VID 1A86), NOT native USB-JTAG
  level: INFO          # DEBUG floods the log with per-frame render noise

# -----------------------------------------------------------------------------
# API
# -----------------------------------------------------------------------------
api:
  encryption:
    # API *password* auth was REMOVED in ESPHome 2026.1.0 — a config with
    # `password:` here will not compile. Generate the key with:
    #     openssl rand -base64 32
    key: !secret wall_clock_api_key

  # ===========================================================================
  # THE MOST IMPORTANT LINE IN THIS FILE
  # ===========================================================================
  # Default is 15min: the device REBOOTS itself if no API client connects for
  # that long. During a Home Assistant outage the clock would reboot, and with
  # no battery-backed RTC a power-on reset loses the time entirely — so the
  # clock would go dark exactly when we most want it working.
  # REVERT: delete this line to restore the 15min default.
  reboot_timeout: 0s

  # Track connectivity so the render can show that STATUS is stale while still
  # showing the time. Setting a local global is safe here; note that calling a
  # Home Assistant action from on_client_connected can be silently dropped,
  # because HA starts listening for device actions shortly AFTER the connection
  # is established. Never put a homeassistant.action here without a delay.
  on_client_connected:
    - lambda: 'id(ha_connected) = true;'
  on_client_disconnected:
    - lambda: 'id(ha_connected) = false;'

ota:
  - platform: esphome
    password: !secret wall_clock_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s   # same reasoning as the API timeout above
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret wall_clock_ap_password

captive_portal:

# -----------------------------------------------------------------------------
# TIME — two sources, deliberately
# -----------------------------------------------------------------------------
# Home Assistant is primary AND the timezone authority: it pushes a POSIX TZ
# string *plus pre-parsed DST rules* with the epoch, and the device stores them,
# so DST transitions happen on-device even if HA is unreachable at the moment.
#
# When HA is unreachable the clock FREE-RUNS from its last sync — verified by
# reading homeassistant_time.cpp: with no clients there is no request and no
# error path. An outage does not disturb the displayed time at all.
#
# SNTP closes the one residual gap: a POWER-ON RESET loses the ESP32 RTC, so a
# power blip while HA is also down would leave no time at all on boot.
time:
  - platform: homeassistant
    id: ha_time
    # NO `timezone:` here on purpose — setting one would STOP HA pushing
    # timezone updates, which is the opposite of what we want.

  - platform: sntp
    id: sntp_time
    # The ONE hand-set value in this file. It applies only to a cold boot while
    # HA is unreachable; HA overrides it on the first successful sync. Without
    # it that boot would show UTC — confidently wrong time on the wall.
    timezone: Australia/Melbourne
    update_interval: 6h

# -----------------------------------------------------------------------------
# DISPLAY — DISABLED until the GC9B72 init sequence is in hand
# -----------------------------------------------------------------------------
#   was                      now                      because
#   -----------------------  -----------------------  --------------------------
#   spi: type: quad          type: single (default)   header is SDA+SCL+SDO,
#   data_pins: [4 pins]      clk_pin + mosi_pin       not D0-D3 -> 4-wire SPI
#   model: ESP-VOCAT         model: CUSTOM            ESP-VOCAT is an ST77916
#   (init from the model)    init_sequence: REQUIRED  ESPHome ships no GC9B72
#
# TO FINISH: the init sequence lives in your module's demo code — a header like
# LCD_Driver.h / gc9b72_init.h, or an `initcmd[]` array in an Arduino example.
# Send me that file and I will convert it to ESPHome's `init_sequence:` form.
# ESPHome appends SLPOUT/DISPON and the reset pulse itself, so those get dropped.
#
# Do NOT substitute a GC9A01 sequence. GC9A01 is a 240x240 part; its gamma and
# power tables will give you a blank or garbled panel that looks exactly like a
# wiring fault, and you will chase pins for hours.
#
# spi:
#   - id: lcd_bus
#     clk_pin: ${lcd_clk}
#     mosi_pin: ${lcd_mosi}

output:
  - platform: ledc
    pin: ${lcd_backlight}
    id: backlight_out

# -----------------------------------------------------------------------------
# STATE IMPORTED FROM HOME ASSISTANT
# -----------------------------------------------------------------------------
# All of this degrades safely: if HA is unreachable these stop updating and the
# render treats absent (NaN) values as "feature off".
#
# NOTE ON THE TIMER DESIGN. HA's timer entity has a `remaining` attribute, but
# it does NOT tick down while running — it is written once at start and only
# recomputed on pause/change. Its `duration`/`remaining` are also "H:MM:SS"
# STRINGS which the numeric sensor platform cannot import at all. So the HA
# package publishes the ABSOLUTE finish time as a unix epoch — static while the
# timer runs — and this device counts down against it locally. No drift.
sensor:
  - platform: homeassistant
    id: timer_finish_epoch
    entity_id: sensor.wall_clock_timer_finish_epoch     # 0 = no timer
  - platform: homeassistant
    id: timer_total_seconds
    entity_id: sensor.wall_clock_timer_total
    # Arc denominator. Can GROW mid-timer on "add five minutes" — the render
    # clamps so the arc never jumps backwards past full.

  # ---- MULTI-TIMER: one finish epoch per pool slot ------------------------
  # The Echo Wall Clock draws the NEXT-expiring timer as a full depleting arc
  # and gives every other running timer a single indicator LED at the position
  # where it will finish. These five feed those pips; the arc still comes from
  # timer_finish_epoch above, which HA defines as "whichever expires soonest".
  #
  # Five flat sensors rather than one packed string on purpose — ESPHome
  # imports numbers natively, and parsing a delimited blob inside a lambda is
  # the kind of thing that fails silently.
  #
  # 0 = that slot is not running.
  - platform: homeassistant
    id: t1_fin
    entity_id: sensor.wall_clock_timer_1_finish_epoch
  - platform: homeassistant
    id: t2_fin
    entity_id: sensor.wall_clock_timer_2_finish_epoch
  - platform: homeassistant
    id: t3_fin
    entity_id: sensor.wall_clock_timer_3_finish_epoch
  - platform: homeassistant
    id: t4_fin
    entity_id: sensor.wall_clock_timer_4_finish_epoch
  - platform: homeassistant
    id: t5_fin
    entity_id: sensor.wall_clock_timer_5_finish_epoch
  - platform: homeassistant
    id: weather_temp
    entity_id: ${weather_entity}
    attribute: temperature

text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: ${weather_entity}      # the entity STATE is the condition slug
  - platform: homeassistant
    id: next_bin
    entity_id: sensor.next_bin        # "Green waste" / "Recycling"
  - platform: homeassistant
    id: timer_label
    entity_id: sensor.wall_clock_timer_label   # name of the next timer, or empty

binary_sensor:
  - platform: homeassistant
    id: timer_alert
    entity_id: binary_sensor.wall_clock_timer_alert
    # Stamp when the alarm STARTED, so the clock can stop showing it after
    # `alert_seconds` without needing Home Assistant to tell it to. A cancel
    # still clears it instantly -- the flag going false is checked on every
    # frame, and no timer is involved in that direction.
    on_press:
      - lambda: 'id(alert_since) = millis();'
  - platform: homeassistant
    id: bin_night
    entity_id: binary_sensor.wall_clock_bin_night
  - platform: homeassistant
    id: garage_open
    entity_id: binary_sensor.wall_clock_garage_open
  - platform: homeassistant
    id: driveway_unknown
    entity_id: binary_sensor.wall_clock_driveway_unknown
  # Four discrete sensors rather than a packed bitmask — each is individually
  # visible in HA dev tools when something looks wrong.
  - platform: homeassistant
    id: home_sam
    entity_id: binary_sensor.wall_clock_home_sam
  - platform: homeassistant
    id: home_laura
    entity_id: binary_sensor.wall_clock_home_laura
  - platform: homeassistant
    id: home_amanda
    entity_id: binary_sensor.wall_clock_home_amanda
  - platform: homeassistant
    id: home_zac
    entity_id: binary_sensor.wall_clock_home_zac

  # ---- WHICH PANEL IS PLUGGED IN --------------------------------------------
  # A strap, not a probe. Both modules are write-only: the round one brings SDO
  # out on its header but the bar one has no such pin at all, so there is no
  # bus to read an ID back over and no way to ask either panel what it is.
  # One wire from ${panel_detect} to GND in the bar panel's cable answers the
  # question deterministically, and the bar panel needs its own cable anyway —
  # different pin count, different order.
  - platform: gpio
    id: panel_strap
    name: "Bar panel fitted"
    entity_category: diagnostic
    pin:
      number: ${panel_detect}
      mode:
        input: true
        pullup: true
      inverted: true          # strapped to GND == true == bar panel
    filters:
      - delayed_on_off: 50ms

# -----------------------------------------------------------------------------
# CONTROLS EXPOSED TO HOME ASSISTANT
# -----------------------------------------------------------------------------
number:
  # ---- Ring geometry -------------------------------------------------------
  # HOW MANY LEDs ARE ACTUALLY ON YOUR RING.
  #
  # esp32_rmt_led_strip's own `num_leds:` is COMPILE-TIME — it sizes the RMT
  # buffer and cannot be a runtime value. So the strip is declared at
  # ${max_leds} (the largest ring this build supports) and this number says how
  # many of those are physically present. The render uses this count and leaves
  # the rest dark.
  #
  # Driving a chain shorter than the declared length is harmless: the surplus
  # bits simply fall off the end of the chain with nothing to latch them.
  #
  # So: change this from Home Assistant for any ring up to ${max_leds}, no
  # reflash. Only a ring LARGER than ${max_leds} needs the substitution raised
  # and a reflash.
  - platform: template
    id: ring_size
    name: "Ring LED count"
    entity_category: config
    icon: mdi:led-strip-variant
    min_value: 8
    max_value: ${max_leds}
    step: 1
    initial_value: ${num_leds}
    optimistic: true
    restore_value: true

  # Which physical LED sits at 12 o'clock. Set Mode to "test chase" and watch
  # where the red pixel lands, then dial this until it is at the top.
  # Positive rotates clockwise. Was a compile-time substitution.
  - platform: template
    id: twelve_offset
    name: "Twelve o'clock offset"
    entity_category: config
    icon: mdi:rotate-right
    min_value: 0
    max_value: ${max_leds}
    step: 1
    initial_value: ${twelve_oclock_offset}
    optimistic: true
    restore_value: true

  # ---- Brightness ----------------------------------------------------------
  - platform: template
    id: day_brightness
    name: "Brightness"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 45
    optimistic: true
    restore_value: true
  - platform: template
    id: night_brightness
    name: "Night brightness"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 1
    max_value: 50
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true

  # ---- Auto-dim window -----------------------------------------------------
  # Was two compile-time substitutions. Set both to the same hour to disable
  # the window without touching the Auto dim switch.
  - platform: template
    id: night_start
    name: "Night starts"
    entity_category: config
    icon: mdi:weather-night
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23
    step: 1
    initial_value: ${night_start_hour}
    optimistic: true
    restore_value: true
  - platform: template
    id: night_end
    name: "Night ends"
    entity_category: config
    icon: mdi:weather-sunny
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23
    step: 1
    initial_value: ${night_end_hour}
    optimistic: true
    restore_value: true

  # ---------------------------------------------------------------------------
  # CUSTOM PALETTE — twelve numbers, four elements, HSV
  # ---------------------------------------------------------------------------
  # Only consulted when "Colour theme" is set to "custom"; the presets ignore
  # them entirely, so these can be left mid-fiddle without affecting anything.
  #
  # HSV rather than RGB on purpose. Hue is the axis you actually want to drag,
  # and keeping saturation and value separate is what lets the SCREEN reuse the
  # same hue at its own brightness. A backlit LCD and an LED at arm's length do
  # not want the same value: the ring's timer colour is deliberately dim (V 35)
  # because it is a bare emitter, while the same teal as screen text has to be
  # bright to be legible. Storing RGB would weld those two together and one of
  # the surfaces would always be wrong.
  #
  # Defaults below are the "default" preset converted to HSV, so switching
  # straight to custom changes nothing visible until you move a slider.
  #
  # There is no pip control by design — the status pips track the timer arc at
  # 62%, which is what all four presets already do to within a few percent.
  # ---------------------------------------------------------------------------
  # RING DETAIL
  # ---------------------------------------------------------------------------
  - platform: template
    id: marker_bright
    name: "Hour marker brightness"
    entity_category: config
    icon: mdi:circle-slice-8
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 100
    optimistic: true
    restore_value: true

  # Status pixels are the lowest tier on the face. Turning them down is how you
  # keep the clock readable at a glance without giving up the ambient info.
  - platform: template
    id: status_bright
    name: "Status pixel brightness"
    entity_category: config
    icon: mdi:brightness-percent
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 100
    optimistic: true
    restore_value: true

  # Hue only. Saturation and value are pinned full because an alert is a single
  # state — there is no second alert colour to distinguish it from, so the only
  # useful axis is which hue catches YOUR eye. Follows mono to greyscale.
  - platform: template
    id: alert_hue
    name: "Alert hue"
    entity_category: config
    icon: mdi:bell-alert-outline
    unit_of_measurement: "°"
    min_value: 0
    max_value: 360
    step: 1
    initial_value: 20
    optimistic: true
    restore_value: true

  # HOW LONG THE CLOCK KEEPS SHOWING A FINISHED TIMER.
  # Sam: "just like Alexa, I want the alarm to go off until it is cancelled.
  # When it is cancelled the wall clock stops showing the alarm too. Otherwise
  # have the alarm stop after 15 seconds on the wall clock."
  #
  # Two different lifetimes, deliberately, and this number is only the second:
  #
  #   the ALARM   sounds until it is cancelled. That is Home Assistant's job and
  #               it is done in wall_clock_timers.yaml, which now re-announces
  #               on a loop instead of once-then-forget.
  #   the CLOCK   shows the alert from the moment it starts until whichever
  #               comes first: the alarm is cancelled, or this many seconds.
  #
  # A cancel always wins immediately -- the alert flag going false clears the
  # ring and the screen on the next frame, 50 ms later -- so "when it is
  # cancelled the wall clock stops showing the alarm too" holds no matter what
  # this is set to.
  #
  # Set it to 0 to mean "follow the alarm exactly", i.e. flash for as long as it
  # sounds. Worth saying plainly: at 15 the ring goes back to telling the time
  # while an un-cancelled alarm is still audible in the kitchen. That is what
  # was asked for and it is a reasonable thing to want -- the noise is what
  # fetches you, the ring is what you read once you are there -- but if it feels
  # wrong, 0 is the setting that makes the two agree.
  - platform: template
    id: alert_seconds
    name: "Alert shows for"
    entity_category: config
    icon: mdi:bell-sleep-outline
    unit_of_measurement: "s"
    min_value: 0
    max_value: 300
    step: 5
    initial_value: 15
    optimistic: true
    restore_value: true

  # How strongly the weather colours the screen background. 0 leaves the plain
  # near-black ground; 100 is the full tint.
  - platform: template
    id: tint_strength
    name: "Weather tint strength"
    entity_category: config
    icon: mdi:gradient-horizontal
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 100
    optimistic: true
    restore_value: true

  - platform: template
    id: hour_hue
    name: "Hour hue"
    entity_category: config
    icon: mdi:palette-outline
    unit_of_measurement: "°"
    min_value: 0
    max_value: 360
    step: 1
    initial_value: 18
    optimistic: true
    restore_value: true
  - platform: template
    id: hour_sat
    name: "Hour saturation"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 92
    optimistic: true
    restore_value: true
  - platform: template
    id: hour_val
    name: "Hour intensity"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    restore_value: true

  - platform: template
    id: min_hue
    name: "Minute hue"
    entity_category: config
    icon: mdi:palette-outline
    unit_of_measurement: "°"
    min_value: 0
    max_value: 360
    step: 1
    initial_value: 216
    optimistic: true
    restore_value: true
  - platform: template
    id: min_sat
    name: "Minute saturation"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 88
    optimistic: true
    restore_value: true
  - platform: template
    id: min_val
    name: "Minute intensity"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    restore_value: true

  - platform: template
    id: sec_hue
    name: "Second hue"
    entity_category: config
    icon: mdi:palette-outline
