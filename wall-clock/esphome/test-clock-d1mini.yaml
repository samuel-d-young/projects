# =============================================================================
# SUPERSEDED — kept for reference only.
# =============================================================================
# Sam settled on the ESP32-S3-N16R8 for this build. Use round-clock-s3.yaml.
#
# This config still works and is a valid ESP8266 port if you ever want the ring
# on its own. It CANNOT drive the 360x360 display: that needs 253 KB of
# framebuffer against ~30 KB of ESP8266 heap, and ESPHome's ST77916 model
# declares requires={"psram"} so it will not even compile here.
# =============================================================================

# =============================================================================
# test-clock-d1mini.yaml — bench test clock
# Wemos D1 mini (ESP8266) + Mokungi 24-LED WS2812B ring
# =============================================================================
# This is the DEVELOPMENT rig. It proves the entire software path — HA package,
# intent override, timer arc, alert, ambient status — on hardware you already
# have, before the 60-LED ring arrives.
#
# The render works in FRACTIONS of the circle, so this shows a correct, coarser
# clock on 24 pixels. Nothing about the logic changes for the 60.
#
# WHAT IS DIFFERENT FROM wall-clock.yaml (the ESP32 production config):
#   - esp8266: instead of esp32:
#   - neopixelbus instead of esp32_rmt_led_strip (the latter is ESP32-only;
#     neopixelbus's 2026.6 deprecation was ESP32-only, ESP8266 is unaffected)
#   - smaller render buffer, because ESP8266 heap is ~30KB not ~160KB
#   - no round display. See test-clock-s3-round.yaml and WIRING.md for why.
#
# NOT COMPILED OR FLASHED. Run `esphome config test-clock-d1mini.yaml` first.
# =============================================================================

substitutions:
  device_name: test-clock
  friendly_name: Test Clock

  # 24 for the Mokungi ring. The render reads the real count from the strip at
  # runtime, so this only has to be right for the light component itself.
  num_leds: "24"

  # GPIO4 = pin D2 on a D1 mini. See the method: note below for why this pin
  # and not GPIO3.
  led_pin: GPIO4

  # Run "test chase", see where the red pixel lands, put that offset here.
  twelve_oclock_offset: "0"

  night_start_hour: "22"
  night_end_hour: "7"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 600
      then:
        - light.turn_on:
            id: ring
            brightness: 100%
            effect: "Face"
        - logger.log: "Boot: ring on, Face effect selected"

# -----------------------------------------------------------------------------
# PLATFORM — ESP8266
# -----------------------------------------------------------------------------
# ESP8266 is NOT deprecated. 2026.1 moved it to ESP-IDF and it got substantially
# better: ~40% smaller binaries and free heap up from under 10K to over 30K.
# That heap improvement is what makes this config viable at all.
esp8266:
  board: d1_mini

logger:
  level: INFO
  # Serial logging stays on (see the method: note). If you switch the LED
  # method to esp8266_dma you MUST set baud_rate: 0 here, because DMA takes
  # over GPIO3 which UART0 needs.

api:
  encryption:
    key: !secret wall_clock_api_key
  # Same reasoning as the production config: the 15min default reboots the
  # device during an HA outage, and there is no RTC to survive it.
  reboot_timeout: 0s
  on_client_connected:
    - lambda: 'id(ha_connected) = true;'
  on_client_disconnected:
    - lambda: 'id(ha_connected) = false;'

ota:
  - platform: esphome
    password: !secret wall_clock_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret wall_clock_ap_password
  # NOTE: since 2026.1 ESPHome warns on any ESP8266 config without an explicit
  # min_auth_mode, and now defaults it to WPA2. If you see that warning, add:
  #   min_auth_mode: WPA2
  # Left out here because the key name was not verified against 2026.8.0 and a
  # wrong key fails the whole config. Add it only if ESPHome asks for it.

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    # No timezone: on purpose — HA pushes the zone AND pre-parsed DST rules.
  - platform: sntp
    id: sntp_time
    timezone: Australia/Melbourne   # cold-boot fallback only; HA overrides it
    update_interval: 6h

# -----------------------------------------------------------------------------
# STATE FROM HOME ASSISTANT
# -----------------------------------------------------------------------------
# Identical contract to the production config, so the same HA package drives
# both. If ESP8266 heap runs short, the four person sensors at the bottom are
# the cheapest things to delete — the clock and timer path do not need them.
sensor:
  - platform: homeassistant
    id: timer_finish_epoch
    entity_id: sensor.wall_clock_timer_finish_epoch
  - platform: homeassistant
    id: timer_total_seconds
    entity_id: sensor.wall_clock_timer_total

binary_sensor:
  - platform: homeassistant
    id: timer_alert
    entity_id: binary_sensor.wall_clock_timer_alert
  - platform: homeassistant
    id: bin_night
    entity_id: binary_sensor.wall_clock_bin_night
  - platform: homeassistant
    id: garage_open
    entity_id: binary_sensor.wall_clock_garage_open
  - platform: homeassistant
    id: driveway_unknown
    entity_id: binary_sensor.wall_clock_driveway_unknown
  - platform: homeassistant
    id: home_sam
    entity_id: binary_sensor.wall_clock_home_sam
  - platform: homeassistant
    id: home_laura
    entity_id: binary_sensor.wall_clock_home_laura
  - platform: homeassistant
    id: home_amanda
    entity_id: binary_sensor.wall_clock_home_amanda
  - platform: homeassistant
    id: home_zac
    entity_id: binary_sensor.wall_clock_home_zac

text_sensor:
  - platform: homeassistant
    id: next_bin
    entity_id: sensor.next_bin

# -----------------------------------------------------------------------------
# CONTROLS
# -----------------------------------------------------------------------------
number:
  - platform: template
    id: day_brightness
    name: "Brightness"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    # 30% not 55%, because this rig will often be USB-powered. 24 LEDs at full
    # white is ~1.44A, which is more than a PC USB port will give you. See
    # WIRING.md — if you power it from USB alone, keep this at or below 30.
    initial_value: 30
    optimistic: true
    restore_value: true

  - platform: template
    id: night_brightness
    name: "Night brightness"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 1
    max_value: 50
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true

select:
  - platform: template
    id: display_mode
    name: "Mode"
    entity_category: config
    options: ["auto", "clock only", "clock bare", "test chase"]
    initial_option: "auto"
    optimistic: true
    restore_value: true

switch:
  - platform: template
    id: display_on
    name: "Display"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

globals:
  - id: frame
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ha_connected
    type: bool
    restore_value: no
    initial_value: 'false'

# -----------------------------------------------------------------------------
# THE RING — neopixelbus, because this is an ESP8266
# -----------------------------------------------------------------------------
light:
  - platform: neopixelbus
    id: ring
    internal: true
    pin: ${led_pin}
    num_leds: ${num_leds}
    variant: WS2812        # WS2812B uses the WS2812 variant here
    type: GRB              # neopixelbus uses `type`, NOT channel_colors —
                           # that key belongs to esp32_rmt_led_strip.
                           # If red/green come out swapped, change to RGB.

    # METHOD — the ESP8266's awkward trade-off.
    #
    #   bit_bang      any GPIO0-15. Disables interrupts while writing:
    #                 24 LEDs is ~720us, which WiFi tolerates fine.
    #   esp8266_dma   GPIO3 ONLY. Rock solid, zero CPU — but GPIO3 is UART0 RX,
    #                 so you lose serial logging and must set logger
    #                 baud_rate: 0.
    #   esp8266_uart  GPIO1 (bus 0) or GPIO2 (bus 1). GPIO2 is the onboard LED
    #                 on most D1 minis, so it fights you.
    #
    # bit_bang on GPIO4/D2 is chosen so serial logging works during first flash,
    # which is exactly when you need it. If you see flicker at 24 LEDs, switch
    # to esp8266_dma on GPIO3 and set logger baud_rate: 0.
    method:
      type: bit_bang

    gamma_correct: 1.0     # honest brightness: 50% means 50% of current
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

    effects:
      - addressable_lambda:
          name: "Face"
          update_interval: 50ms
          lambda: |-
            int N = it.size();
            if (N < 4) return;
            if (N > 64) N = 64;          // buffer bound — see below
            id(frame)++;

            // 64 pixels x 4 bytes = 256 bytes. The ESP32 build uses 256
            // pixels; on ESP8266 with ~30KB of heap that would be careless,
            // and this rig will never exceed 64.
            static Color buf[64];
            for (int i = 0; i < N; i++) buf[i] = Color(0, 0, 0);

            auto P = [N](float frac) -> int {
              int p = (int) lroundf(frac * N) + (${twelve_oclock_offset});
              p %= N; return p < 0 ? p + N : p;
            };
            auto add = [](int i, int r, int g, int b) {   // buf is static
              buf[i].r = (uint8_t) std::min(255, (int) buf[i].r + r);
              buf[i].g = (uint8_t) std::min(255, (int) buf[i].g + g);
              buf[i].b = (uint8_t) std::min(255, (int) buf[i].b + b);
            };

            const std::string mode = id(display_mode).state;
            const auto now = id(ha_time).now();

            if (!id(display_on).state) { it.all() = Color::BLACK; return; }

            if (mode == "test chase") {
              add((id(frame) / 6) % N, 255, 255, 255);
              add(P(0.0f), 160, 0, 0);          // red marks 12 o'clock
            }
            else if (!now.is_valid()) {
              // Deliberate "I don't know the time" crawl. A confidently wrong
              // clock is worse than an obviously broken one.
              add((id(frame) / 12) % N, 40, 20, 0);
            }
            else if (id(timer_alert).state && mode != "clock bare") {
              const float ph = (id(frame) % 20) / 20.0f;
              const float k  = 0.35f + 0.65f * fabsf(1.0f - 2.0f * ph);
              for (int i = 0; i < N; i++) add(i, (int)(255*k), (int)(60*k), 0);
            }
            else {
              for (int m = 0; m < 12; m++) add(P(m / 12.0f), 14, 14, 18);

              bool timer_running = false;
              if (mode == "auto" || mode == "clock only") {
                const float finish = id(timer_finish_epoch).state;
                const float total  = id(timer_total_seconds).state;
                if (!std::isnan(finish) && finish > 0 &&
                    !std::isnan(total)  && total  > 0) {
                  const float left = finish - (float) now.timestamp;
                  if (left > 0) {
                    timer_running = true;
                    float ratio = left / total;
                    if (ratio > 1.0f) ratio = 1.0f;   // "add 5 minutes" clamp
                    const int lit = (int) ceilf(ratio * N);
                    for (int i = 0; i < lit; i++) add(P((float) i / N), 0, 90, 80);
                  }
                }
              }

              if (mode == "auto" && !timer_running) {
                if (id(bin_night).state) {
                  const float ph = (id(frame) % 60) / 60.0f;
                  const float k = 0.4f + 0.6f * fabsf(1.0f - 2.0f * ph);
                  if (id(next_bin).state == "Recycling")
                    add(P(0.0f), (int)(160*k), (int)(140*k), 0);
                  else
                    add(P(0.0f), 0, (int)(150*k), (int)(30*k));
                }
                if (id(garage_open).state) add(P(0.25f), 150, 70, 0);
                if (id(driveway_unknown).state) {
                  const float k = ((id(frame) / 10) % 2) ? 1.0f : 0.25f;
                  add(P(0.75f), (int)(200 * k), 0, 0);
                }
                const bool who[4] = { id(home_sam).state,    id(home_laura).state,
                                      id(home_amanda).state, id(home_zac).state };
                const int  rgb[4][3] = { {0,40,90}, {90,0,70}, {0,70,40}, {70,50,0} };
                for (int w = 0; w < 4; w++)
                  if (who[w])
                    add(P(0.5f + (w - 1.5f) / N), rgb[w][0], rgb[w][1], rgb[w][2]);
              }

              const float hf = fmodf((float) now.hour, 12.0f) / 12.0f
                             + now.minute / 720.0f;
              const float mf = now.minute / 60.0f + now.second / 3600.0f;
              const float sf = now.second / 60.0f;

              // On a 24-LED ring one pixel is 2.5 minutes, so the hour
              // shoulders are dropped — they would swamp the dial.
              add(P(hf), 255, 90, 20);      // hour   — amber
              add(P(mf), 30, 120, 255);     // minute — blue
              add(P(sf), 90, 90, 90);       // second — grey

              if (!id(ha_connected)) add(P(0.5f), 30, 0, 0);
            }

            float bri = id(day_brightness).state / 100.0f;
            if (now.is_valid()) {
              const int h = now.hour;
              const int ns = ${night_start_hour}, ne = ${night_end_hour};
              const bool night = (ns > ne) ? (h >= ns || h < ne)
                                           : (h >= ns && h < ne);
              if (night) bri = id(night_brightness).state / 100.0f;
            } else {
              bri = id(night_brightness).state / 100.0f;
            }
            for (int i = 0; i < N; i++)
              it[i] = Color((uint8_t) lroundf(buf[i].r * bri),
                            (uint8_t) lroundf(buf[i].g * bri),
                            (uint8_t) lroundf(buf[i].b * bri));
