# =============================================================================
# Wall Clock — LED ring driven by Home Assistant
# =============================================================================
# Replaces an Amazon Echo Wall Clock. Analogue time on a pixel ring, timer
# progress from HA Assist timers, ambient household status when idle.
#
# DESIGN PRIORITY (the tiebreaker for every decision below):
#     reliable clock  >  timers  >  status
# The clock face must survive Home Assistant being unreachable. Timers and
# status may not. Wherever those goals conflict, the clock wins.
#
# Verified against ESPHome 2026.8.0 docs and source. The lambda API was read
# from esphome/components/light/esp_color_view.h at tag 2026.8.0.
# NOT yet compiled or flashed — run `esphome config wall-clock.yaml` first.
# Rationale for every choice: ../docs/PHASE-1-RESEARCH.md
# =============================================================================

substitutions:
  device_name: wall-clock
  friendly_name: Wall Clock

  # ---------------------------------------------------------------------------
  # LED COUNT — the one number to change when moving from a test ring to the
  # real one. The whole render works in FRACTIONS of the circle, so a 12/16/24
  # LED ring shows a correct (coarser) clock with no other edits.
  # Develop on a small ring, set this to 60, re-flash. Nothing else changes.
  # ---------------------------------------------------------------------------
  num_leds: "24"          # <-- CHANGE TO "60" for the real ring

  # Data pin. GPIO4 is safe on both ESP32-S3 and plain ESP32 devkits.
  # On plain ESP32 never use GPIO34-39 — input-only, cannot drive data.
  led_pin: GPIO4

  # Which physical LED sits at 12 o'clock. The ring's solder pads rarely end up
  # at the top once mounted, so rotate in software instead of fighting the
  # wiring. Run the "test chase" mode, see where the red pixel lands, put the
  # offset here. Positive rotates clockwise.
  twelve_oclock_offset: "0"

  # Overnight dimming window, local 24h time. To disable auto-dim entirely,
  # set both to the same number.
  night_start_hour: "22"
  night_end_hour: "7"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    # Priority 600 runs after hardware init but before network. Lighting the
    # ring this early means a boot loop is visible on the wall rather than
    # silent — worth knowing about from across the kitchen.
    - priority: 600
      then:
        - light.turn_on:
            id: ring
            brightness: 100%     # full scale; real dimming happens inside the
            effect: "Face"       # render lambda — see BRIGHTNESS below
        - logger.log: "Boot: ring on, Face effect selected"

# -----------------------------------------------------------------------------
# PLATFORM
# -----------------------------------------------------------------------------
# `variant:` is preferred over `board:` in 2026 — board only affects pin aliases
# and is explicitly de-recommended in the docs. esp-idf is the default framework
# for all ESP32 variants, so it is not restated here.
#
# TO USE A SPARE PLAIN ESP32 (e.g. from the xLights rig): change this to
# `variant: esp32`. Nothing else needs to change. Plain ESP32 is actually the
# BETTER RMT host here (8 TX channels / 512 symbols vs the S3's 4 / 192) — the
# S3 was chosen only because Core Electronics no longer stocks a cheap
# WROOM-32 devkit.
esp32:
  variant: esp32s3

logger:
  level: INFO          # DEBUG floods the log with per-frame render noise

# -----------------------------------------------------------------------------
# API
# -----------------------------------------------------------------------------
api:
  encryption:
    # API *password* auth was REMOVED in ESPHome 2026.1.0 — a config containing
    # `password:` here will not compile. The key is a 32-byte base64 string:
    #     openssl rand -base64 32
    key: !secret wall_clock_api_key

  # ===========================================================================
  # THE MOST IMPORTANT LINE IN THIS FILE
  # ===========================================================================
  # Default is 15min: the device REBOOTS itself if no API client connects for
  # that long. That default is actively hostile to this project. During an HA
  # outage the clock would reboot, and because a bare ESP32 has no
  # battery-backed RTC, a power-on reset loses the time completely — so the
  # clock would go dark at exactly the moment we most want it working.
  #
  # 0s disables it. The documented tradeoff is that the ESP's network stack can
  # occasionally report "connected" when it isn't, and only a reboot clears
  # that. We accept it: priority one is that the clock keeps telling the time.
  #
  # REVERT: delete this line to restore the 15min default.
  reboot_timeout: 0s

  # Track HA connectivity so the render can show that STATUS is stale while
  # still showing the time. Setting a local global is safe here — note that
  # calling a Home Assistant action from on_client_connected can be silently
  # dropped, because HA starts listening for device actions shortly AFTER the
  # connection is established. Never put a homeassistant.action call here
  # without a delay in front of it.
  on_client_connected:
    - lambda: 'id(ha_connected) = true;'
  on_client_disconnected:
    - lambda: 'id(ha_connected) = false;'

ota:
  - platform: esphome
    password: !secret wall_clock_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Same reasoning as the API reboot_timeout above: keep trying, never reboot.
  # The clock does not need the network to tell the time.
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret wall_clock_ap_password

captive_portal:

# -----------------------------------------------------------------------------
# TIME — two sources, deliberately
# -----------------------------------------------------------------------------
# Home Assistant is primary AND the timezone authority. Verified by source
# read: HA pushes a POSIX TZ string *plus pre-parsed DST rules* alongside the
# epoch, and the device stores them. DST transitions are therefore handled
# on-device and happen correctly even if HA is unreachable at the moment they
# occur. That is exactly the "never set it by hand" behaviour asked for.
#
# When HA is unreachable the clock FREE-RUNS from its last sync. Verified by
# reading homeassistant_time.cpp: update() simply asks the API server, and with
# no clients there is no request and no error path — time only ever moves on a
# real sync. An HA outage does not disturb the displayed time at all.
#
# The one residual gap SNTP closes: a POWER-ON RESET loses the ESP32's RTC. If
# the power blips while HA is also down, there is no time at all on boot.
# SNTP recovers it from the internet without needing HA.
#
# (If true independence from both HA and the internet is ever wanted, add a
# DS3231 RTC module — ~$3 — as a third `time:` platform. Not in the BOM.)
time:
  - platform: homeassistant
    id: ha_time
    # NO `timezone:` here, on purpose. Setting one would STOP HA pushing
    # timezone updates, which is the opposite of what we want.

  - platform: sntp
    id: sntp_time
    # Fallback only. This is the ONE hand-set value in the file, and it applies
    # only in the narrow case of a cold boot while HA is unreachable — HA still
    # overrides it on the first successful sync. Without it, that cold boot
    # would display UTC, i.e. confidently wrong time on the wall.
    # REVERT: delete this line to leave the fallback on UTC.
    timezone: Australia/Melbourne
    update_interval: 6h

# -----------------------------------------------------------------------------
# STATE IMPORTED FROM HOME ASSISTANT
# -----------------------------------------------------------------------------
# All of this degrades safely: if HA is unreachable these stop updating, and
# the render treats absent (NaN) or stale values as "feature off".
#
# NOTE ON THE TIMER DESIGN. HA's timer entity has a `remaining` attribute, but
# it does NOT tick down while running — it is written once at start and only
# recomputed on pause/change. Importing it would give a frozen arc. Its
# `duration`/`remaining` are also "H:MM:SS" STRINGS, which the numeric
# `sensor: platform: homeassistant` cannot import at all.
#
# So the HA package publishes the ABSOLUTE finish time as a unix epoch — a
# number, and static while the timer runs — and this device counts down against
# it locally. No drift, no polling, no string parsing on the ESP32.
sensor:
  - platform: homeassistant
    id: timer_finish_epoch
    entity_id: sensor.wall_clock_timer_finish_epoch
    # 0 or absent means "no timer running"

  - platform: homeassistant
    id: timer_total_seconds
    entity_id: sensor.wall_clock_timer_total
    # Arc denominator. This can GROW mid-timer when someone says "add five
    # minutes" — the render clamps so the arc never jumps back past full.

binary_sensor:
  - platform: homeassistant
    id: timer_alert
    entity_id: binary_sensor.wall_clock_timer_alert
    # Held true for ~60s after a timer fires, then cleared by the HA package.

  - platform: homeassistant
    id: bin_night
    entity_id: binary_sensor.wall_clock_bin_night

  - platform: homeassistant
    id: garage_open
    entity_id: binary_sensor.wall_clock_garage_open

  - platform: homeassistant
    id: driveway_unknown
    entity_id: binary_sensor.wall_clock_driveway_unknown

  # Who's home. Four discrete sensors rather than one packed bitmask — more
  # entities, but each is individually visible in HA dev tools when something
  # looks wrong, which matters more here than compactness.
  - platform: homeassistant
    id: home_sam
    entity_id: binary_sensor.wall_clock_home_sam
  - platform: homeassistant
    id: home_laura
    entity_id: binary_sensor.wall_clock_home_laura
  - platform: homeassistant
    id: home_amanda
    entity_id: binary_sensor.wall_clock_home_amanda
  - platform: homeassistant
    id: home_zac
    entity_id: binary_sensor.wall_clock_home_zac

text_sensor:
  - platform: homeassistant
    id: next_bin
    entity_id: sensor.next_bin
    # State is "Green waste" / "Recycling" — picks the bin-night colour.

# -----------------------------------------------------------------------------
# CONTROLS EXPOSED TO HOME ASSISTANT
# -----------------------------------------------------------------------------
number:
  - platform: template
    id: day_brightness
    name: "Brightness"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 55
    optimistic: true
    restore_value: true
    # 55% is deliberate: with the 4A supply the absolute worst case (all
    # pixels, full white) is 3.78A, so this is a COMFORT setting, not a safety
    # limit — that is the right way round, and means a firmware bug here cannot
    # become an electrical problem.
    #
    # Note ESPHome's `max_power` CANNOT cap an addressable strip — it is
    # documented as float-outputs-only (PWM/AC dimmer/sigma-delta) and does not
    # reach esp32_rmt_led_strip. The cap is applied by hand at exactly one
    # place in the render lambda. Do not assume max_power protects anything.

  - platform: template
    id: night_brightness
    name: "Night brightness"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 1
    max_value: 50
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true

select:
  - platform: template
    id: display_mode
    name: "Mode"
    entity_category: config
    options:
      - "auto"          # normal: clock + timer + alert + ambient
      - "clock only"    # suppress ambient status, keep timer arc
      - "clock bare"    # clock alone — no timer, no ambient. Fault-finding.
      - "test chase"    # one pixel walks the ring. Wiring/order/index check.
    initial_option: "auto"
    optimistic: true
    restore_value: true
    # NOTE: the key is `initial_option`, not `initial_value` — template SELECT
    # and template NUMBER differ here, and the error message is unhelpful.

switch:
  - platform: template
    id: display_on
    name: "Display"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    # Template switches have NO restore_value/initial_value/set_action — the
    # base switch component's `restore_mode` is how persistence is expressed.

# -----------------------------------------------------------------------------
# INTERNAL STATE
# -----------------------------------------------------------------------------
globals:
  # Frame counter drives pulses and the test chase. Deliberately independent of
  # wall-clock time so animations still run before the first time sync.
  - id: frame
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: ha_connected
    type: bool
    restore_value: no
    initial_value: 'false'

# -----------------------------------------------------------------------------
# THE RING
# -----------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: ring
    internal: true       # not exposed to HA. The number/select/switch above are
                         # the intended surface — exposing the raw light too
                         # invites a state fight between HA's brightness slider
                         # and the cap, with no way to tell which one won.
    pin: ${led_pin}
    num_leds: ${num_leds}

    # `WS2812B` is NOT valid here. The accepted set is exactly WS2811, WS2812,
    # SK6812, APA106, SM16703 — a WS2812B ring uses WS2812. (fastled_clockless
    # DID accept WS2812B, so a copy-paste from an old config fails validation.)
    chipset: WS2812

    # `rgb_order:` was DEPRECATED in ESPHome 2026.8.0 — this exact version.
    # channel_colors replaces it and absorbs the old is_rgbw/is_wrgb keys; the
    # two cannot be combined. If red and green come out swapped, change to RGB.
    channel_colors: GRB

    # Gamma OFF by design. The default of 2.8 would make the brightness number
    # non-linear — a 50% setting would be ~14% actual duty — and the cap has to
    # double as the power story. We want it honest: 50% means 50% of current.
    # REVERT: set to 2.8 for a perceptually smoother dimming curve, but then do
    # not reason about current draw from the percentage.
    gamma_correct: 1.0

    default_transition_length: 0s   # transitions fight per-pixel rendering
    restore_mode: ALWAYS_ON

    effects:
      # An addressable_lambda only runs while that effect is SELECTED — it does
      # NOT run with effect "None". on_boot selects it and nothing deselects
      # it; all mode logic lives inside.
      #
      # The lambda is converted to a plain FUNCTION POINTER, so it cannot
      # capture anything. All state arrives via id(...). Inner lambdas defined
      # in the body may capture freely.
      - addressable_lambda:
          name: "Face"
          update_interval: 50ms    # 20fps: smooth second hand and pulses
                                   # without loading the main loop
          lambda: |-
            // N comes from the strip itself, NOT from the substitution. Taking
            // it from it.size() means the face adapts to whatever ring is
            // actually connected, and makes it impossible to half-render a
            // 60-LED ring because num_leds was left at a test value.
            int N = it.size();
            if (N < 4) return;
            if (N > 256) N = 256;          // buffer bound, see below
            id(frame)++;

            // ---- off-screen buffer -----------------------------------------
            // Layers composite here at FULL brightness, then get scaled once
            // on write-out. Two reasons: the brightness cap becomes a single
            // auditable multiply that no layer can accidentally bypass, and we
            // never read pixels back off the strip (which would round-trip
            // through colour correction).
            // static, not stack: 256 pixels is 1KB and the render runs from a
            // function pointer on the main loop's stack. Cleared every frame.
            static Color buf[256];
            for (int i = 0; i < N; i++) buf[i] = Color(0, 0, 0);

            // Map a fraction of the circle (0.0-1.0) to a pixel index,
            // applying the 12-o'clock mounting offset. Working in fractions is
            // what makes the face correct on any ring size.
            auto P = [N](float frac) -> int {
              int p = (int) lroundf(frac * N) + (${twelve_oclock_offset});
              p %= N; return p < 0 ? p + N : p;
            };
            // Additive blend, so overlapping layers combine instead of
            // clobbering each other.
            auto add = [](int i, int r, int g, int b) {   // buf is static: no capture needed
              buf[i].r = (uint8_t) std::min(255, (int) buf[i].r + r);
              buf[i].g = (uint8_t) std::min(255, (int) buf[i].g + g);
              buf[i].b = (uint8_t) std::min(255, (int) buf[i].b + b);
            };

            const std::string mode = id(display_mode).state;
            const auto now = id(ha_time).now();

            if (!id(display_on).state) {
              it.all() = Color::BLACK;
              return;
            }

            // ---- TEST CHASE ------------------------------------------------
            // Walks one white pixel round the ring with red marking the
            // computed 12 o'clock. Use it to confirm wiring, LED count, colour
            // order, and which physical pixel is index 0.
            if (mode == "test chase") {
              add((id(frame) / 6) % N, 255, 255, 255);
              add(P(0.0f), 160, 0, 0);
            }

            // ---- NO TIME YET -----------------------------------------------
            // Cold boot, HA down, SNTP not yet answered. Show a deliberate
            // "I don't know the time" crawl rather than a plausible-looking
            // wrong time — a wrong clock is worse than an obviously broken one.
            else if (!now.is_valid()) {
              add((id(frame) / 12) % N, 40, 20, 0);
            }

            // ---- ALERT (highest priority) ----------------------------------
            // A finished timer takes the whole ring. This is the one state
            // that overrides the clock, because it is the thing you came into
            // the room to see.
            else if (id(timer_alert).state && mode != "clock bare") {
              const float ph = (id(frame) % 20) / 20.0f;          // ~1Hz @20fps
              const float k  = 0.35f + 0.65f * fabsf(1.0f - 2.0f * ph);
              for (int i = 0; i < N; i++)
                add(i, (int)(255 * k), (int)(60 * k), 0);
            }

            // ---- NORMAL FACE -----------------------------------------------
            else {
              // Hour markers, dim, drawn first so hands blend over them.
              for (int m = 0; m < 12; m++) add(P(m / 12.0f), 14, 14, 18);

              // ---- TIMER arc ----
              bool timer_running = false;
              if (mode == "auto" || mode == "clock only") {
                const float finish = id(timer_finish_epoch).state;
                const float total  = id(timer_total_seconds).state;
                if (!std::isnan(finish) && finish > 0 &&
                    !std::isnan(total)  && total  > 0) {
                  const float left = finish - (float) now.timestamp;
                  if (left > 0) {
                    timer_running = true;
                    // Clamp: "add five minutes" grows the denominator
                    // mid-timer; without this the arc jumps backwards.
                    float ratio = left / total;
                    if (ratio > 1.0f) ratio = 1.0f;
                    const int lit = (int) ceilf(ratio * N);
                    // Drains clockwise from 12. Teal, so it can never be
                    // mistaken for a hand.
                    for (int i = 0; i < lit; i++) add(P((float) i / N), 0, 90, 80);
                  }
                }
              }

              // ---- AMBIENT status ----
              // Only when nothing more important is happening, and deliberately
              // sparse — accent pixels only, never anything hand-like.
              if (mode == "auto" && !timer_running) {
                if (id(bin_night).state) {                    // 12 o'clock breathe
                  const float ph = (id(frame) % 60) / 60.0f;
                  const float k = 0.4f + 0.6f * fabsf(1.0f - 2.0f * ph);
                  if (id(next_bin).state == "Recycling")
                    add(P(0.0f), (int)(160*k), (int)(140*k), 0);   // yellow
                  else
                    add(P(0.0f), 0, (int)(150*k), (int)(30*k));    // green
                }
                if (id(garage_open).state)                    // 3 o'clock, amber
                  add(P(0.25f), 150, 70, 0);
                if (id(driveway_unknown).state) {             // 9 o'clock, red blink
                  const float k = ((id(frame) / 10) % 2) ? 1.0f : 0.25f;
                  add(P(0.75f), (int)(200 * k), 0, 0);
                }
                // Who's home — four dim pixels clustered around 6 o'clock.
                const bool who[4] = { id(home_sam).state,    id(home_laura).state,
                                      id(home_amanda).state, id(home_zac).state };
                const int  rgb[4][3] = { {0,40,90}, {90,0,70}, {0,70,40}, {70,50,0} };
                for (int w = 0; w < 4; w++)
                  if (who[w])
                    add(P(0.5f + (w - 1.5f) / N), rgb[w][0], rgb[w][1], rgb[w][2]);
              }

              // ---- HANDS (last, so always on top) ----
              // Hour is widest and warmest, second is thinnest and coolest.
              // That ordering is what makes the dial readable at a glance.
              const float hf = fmodf((float) now.hour, 12.0f) / 12.0f
                             + now.minute / 720.0f;
              const float mf = now.minute / 60.0f + now.second / 3600.0f;
              const float sf = now.second / 60.0f;

              add(P(hf - 1.0f / N), 70, 25, 6);      // hour shoulders, so the
              add(P(hf + 1.0f / N), 70, 25, 6);      // hour hand reads as wide
              add(P(hf), 255, 90, 20);               // hour   — amber
              add(P(mf), 30, 120, 255);              // minute — blue
              add(P(sf), 90, 90, 90);                // second — grey

              // HA dropped: tint 6 o'clock faintly so it is visible from the
              // room that STATUS is stale. The time itself is still
              // trustworthy, and that distinction is worth showing.
              if (!id(ha_connected)) add(P(0.5f), 30, 0, 0);
            }

            // ---- BRIGHTNESS + WRITE-OUT ------------------------------------
            // The single place brightness is applied. Night window is
            // inclusive of start, exclusive of end, and handles the wrap over
            // midnight. If the time is not yet known we cannot tell day from
            // night, so fall back to the night (dimmer) value.
            float bri = id(day_brightness).state / 100.0f;
            if (now.is_valid()) {
              const int h = now.hour;
              const int ns = ${night_start_hour}, ne = ${night_end_hour};
              const bool night = (ns > ne) ? (h >= ns || h < ne)
                                           : (h >= ns && h < ne);
              if (night) bri = id(night_brightness).state / 100.0f;
            } else {
              bri = id(night_brightness).state / 100.0f;
            }
            for (int i = 0; i < N; i++) {
              it[i] = Color((uint8_t) lroundf(buf[i].r * bri),
                            (uint8_t) lroundf(buf[i].g * bri),
                            (uint8_t) lroundf(buf[i].b * bri));
            }
