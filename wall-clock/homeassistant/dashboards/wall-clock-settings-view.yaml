  - type: markdown
    visibility: *id001
    content: '### Mini Round Clock — everything the ring can light

      | what | where | colour | switch |

      |---|---|---|---|

      | Hour hand | the hour | orange | always on |

      | Minute hand | the minute | blue | always on |

      | Second hand | the second | grey | *Show second hand* |

      | Hour markers | all twelve | dim blue-white | *Markers* |

      | Timer arc | from 12 | teal | only while a timer runs |

      | Timer pips | where each one finishes | dim teal | *Extra timer pips* |

      | Bin night | 12 o''clock | breathing green, yellow for recycling | *Bin night* |

      | Garage open | 3 o''clock | amber | *Garage open* |

      | Driveway | 9 o''clock | blinking red | *Driveway* |

      | Who is home | either side of 6 | Sam **blue**, Laura magenta, Amanda green, Zac amber | *Who is home* |

      | Home Assistant dropped | 6 o''clock | dim red | automatic |


      **A single blue dot just left of 6 o''clock is Sam''s presence pixel.** The twelve hour markers are faintly blue too, but they are dim and there are twelve of them, so one blue dot is the presence one.'
  - type: markdown
    visibility: *id001
    content: '### Mini Round Clock — Colour

      The presets **default, warm, cool, mono** ignore the sliders below. Set **Theme** to **custom** first, then they apply immediately, no reflash.


      *Intensity* is the ring''s brightness for that element, not the screen''s — the screen reuses the same hue at its own brightness, because a bare LED and a backlit panel don''t want the same value.


      Status **pips** follow the timer arc at 62% and have no separate control. **mono** pins every saturation to zero and is the accessible palette.'
