# Paste into the dashboard's Raw configuration editor, replacing the existing
# Settings view in the `views:` list.
#
# Generated by homeassistant/dashboards/build_clock_dashboard.py --view -- do
# not hand-edit; edit CLOCKS in that script and re-run it.
- title: Settings
  path: settings
  icon: mdi:tune-variant
  cards:
  - type: markdown
    content: '# {{ states(''input_select.wall_clock_target'') }}

      Everything below is this clock. Tap another button to switch.'
  - type: horizontal-stack
    cards:
    - type: button
      name: Mini Round Clock
      icon: mdi:clock-outline
      show_state: false
      tap_action:
        action: perform-action
        perform_action: input_select.select_option
        target:
          entity_id: input_select.wall_clock_target
        data:
          option: Mini Round Clock
    - type: button
      name: Mini Round Clock 2
      icon: mdi:clock-outline
      show_state: false
      tap_action:
        action: perform-action
        perform_action: input_select.select_option
        target:
          entity_id: input_select.wall_clock_target
        data:
          option: Mini Round Clock 2
    - type: button
      name: Mini Round Clock 3
      icon: mdi:clock-outline
      show_state: false
      tap_action:
        action: perform-action
        perform_action: input_select.select_option
        target:
          entity_id: input_select.wall_clock_target
        data:
          option: Mini Round Clock 3
    - type: button
      name: Test Clock (D1 mini)
      icon: mdi:clock-outline
      show_state: false
      tap_action:
        action: perform-action
        perform_action: input_select.select_option
        target:
          entity_id: input_select.wall_clock_target
        data:
          option: Test Clock (D1 mini)
  - type: markdown
    content: '{% set s = ''binary_sensor.mini_round_clock_status'' %}{% if is_state(''input_select.wall_clock_target'', ''Mini Round Clock'') %}**Mini Round Clock** &mdash; {% if is_state(s, ''on'') %}online{% elif is_state(s, ''off'') %}**offline** (changes will not reach it){% else %}status unknown &mdash; not adopted yet?{% endif %}{% endif %}{% set s = ''binary_sensor.mini_round_clock_2_status'' %}{% if is_state(''input_select.wall_clock_target'', ''Mini Round Clock 2'') %}**Mini Round Clock 2** &mdash; {% if is_state(s, ''on'') %}online{% elif is_state(s, ''off'') %}**offline** (changes will not reach it){% else %}status unknown &mdash; not adopted yet?{% endif %}{% endif %}{% set s = ''binary_sensor.mini_round_clock_3_status'' %}{% if is_state(''input_select.wall_clock_target'', ''Mini Round Clock 3'') %}**Mini Round Clock 3** &mdash; {% if is_state(s, ''on'') %}online{% elif is_state(s, ''off'') %}**offline** (changes will not reach it){% else %}status unknown &mdash; not adopted
      yet?{% endif %}{% endif %}{% set s = ''binary_sensor.test_clock_status'' %}{% if is_state(''input_select.wall_clock_target'', ''Test Clock (D1 mini)'') %}**Test Clock (D1 mini)** &mdash; {% if is_state(s, ''on'') %}online{% elif is_state(s, ''off'') %}**offline** (changes will not reach it){% else %}status unknown &mdash; not adopted yet?{% endif %}{% endif %}'
