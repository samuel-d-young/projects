# =============================================================================
# wall_clock_ui.yaml — which clock the dashboard is customising
# =============================================================================
# Install: drop in /config/packages/, then `homeassistant.reload_all`.
# `input_select:` is already set up on this system, so this one does NOT need a
# restart — unlike the first install of wall_clock.yaml, which introduced
# `timer:` and `intent_script:`, and unlike the radar package's `rest:`.
#
# WHY A PICKER IS NEEDED AT ALL
# -----------------------------
# Every control on a clock is an ESPHome entity, and ESPHome derives entity ids
# from the device `name:`. Two clocks therefore have two disjoint sets of
# entities — `mini_round_clock_hour_hue` and `kitchen_clock_hour_hue` are
# unrelated — and no Home Assistant card can abstract over that natively.
#
# So the dashboard carries one set of cards per clock and shows only the
# selected one, using card-level `visibility`. That is core HA; no custom card
# is involved. The cards are generated by
# `dashboards/build_clock_dashboard.py`, because keeping N hand-written copies
# in sync is exactly the kind of thing that silently drifts.
#
# ADDING A CLOCK
# --------------
#   1. Give the new device a different `name:` in ESPHome. That one value sets
#      its hostname, its OTA target and its entity prefix — see the 2026-08-23
#      entry in BUILD-LOG.md.
#   2. Add it to CLOCKS in build_clock_dashboard.py and re-run that script.
#   3. Add its label to the options below and reload.
#
# The label here is only a label: rename it freely. The entity prefix is the
# real identity and changing that means renaming the device and reflashing.
#
# A CLOCK THAT IS NOT ON THE NETWORK NOW HIDES ITSELF. Every per-clock card is
# gated on `binary_sensor.<slug>_status` being on, so selecting a clock that has
# never been flashed shows one honest status line instead of twenty "Entity not
# found" boxes. That means it is safe to list a clock here before you build it.
# =============================================================================

# KEEP THESE IN STEP WITH `CLOCKS` in dashboards/build_clock_dashboard.py.
# The generator prints the list for you:  python build_clock_dashboard.py --names
input_select:
  wall_clock_target:
    name: Customising
    icon: mdi:cog-outline
    options:
      - Mini Round Clock
      - Mini Round Clock 2
      - Mini Round Clock 3
      - Test Clock (D1 mini)
