# =============================================================================
# wall_clock_weather.yaml — rain for the wall clock
# =============================================================================
# WHY THIS FILE EXISTS
# --------------------
# Everything else the clock shows about the weather is a plain attribute of the
# weather entity — temperature, humidity, wind_speed, uv_index — and ESPHome
# subscribes to those directly with no help from here.
#
# Rain is the exception. A Home Assistant weather entity carries NO current
# precipitation attribute. Checked on this instance's own entity:
#
#     weather.forecast_home  ->  cloud_coverage, dew_point, humidity,
#                                pressure, temperature, uv_index,
#                                wind_bearing, wind_speed
#
# Precipitation lives in the FORECAST, and since 2024.4 the forecast is no
# longer an attribute either — it is only reachable through the
# `weather.get_forecasts` action. An action cannot be called from an ordinary
# template sensor, which is why this is a TRIGGER-based template: the trigger
# fires on a schedule, the action fetches the forecast, and the sensor is
# rendered from what came back.
#
# THE ENTITY THE CLOCK LOOKS FOR
# ------------------------------
# `sensor.wall_clock_rain_today`, matching `rain_entity` in
# mini-round-clock-with-display.yaml. Rename in both places or neither.
#
# If this package is not deployed the clock does not break: weather_rain stays
# NaN, the renderer skips the fragment, and "Show rain" is a switch that does
# nothing. That is deliberate — an undeployed package should cost a missing
# word, not a "nan" on the wall.
#
# INSTALL
# -------
# Drop in /config/packages/ alongside the other wall_clock_*.yaml files and
# call `template.reload` (or restart). Requires `homeassistant: packages: !include_dir_named
# packages` in configuration.yaml, which this instance already has.
# =============================================================================

template:
  # ---------------------------------------------------------------------------
  # RAIN TODAY — total precipitation in today's daily forecast
  # ---------------------------------------------------------------------------
  - trigger:
      # Every 15 minutes, and once at startup so the clock is not blank for the
      # first quarter of an hour after a restart. met.no updates roughly
      # hourly, so 15 minutes is comfortably inside its resolution without
      # hammering the integration.
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    action:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: daily
        response_variable: fc
    sensor:
      - name: "Wall clock rain today"
        unique_id: wall_clock_rain_today
        unit_of_measurement: "mm"
        device_class: precipitation
        state_class: measurement
        # The first daily entry is today. `precipitation` is the accumulation
        # for that day. default(0) rather than unknown, because "no rain in the
        # forecast" and "the forecast does not mention rain" both mean 0 mm to
        # someone glancing at a clock.
        state: >-
          {{ (fc['weather.forecast_home'].forecast[0].precipitation
              | default(0) | float(0)) | round(1) }}
        availability: >-
          {{ fc is defined
             and fc['weather.forecast_home'] is defined
             and fc['weather.forecast_home'].forecast | count > 0 }}

      # ---------------------------------------------------------------------
      # RAIN CHANCE — the probability, which is the more useful number for
      # "do I need a coat". Not read by the clock today; exposed because it is
      # free once the forecast has been fetched, and it is the obvious next
      # thing to want on the extras line.
      # ---------------------------------------------------------------------
      - name: "Wall clock rain chance"
        unique_id: wall_clock_rain_chance
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {{ (fc['weather.forecast_home'].forecast[0].precipitation_probability
              | default(0) | float(0)) | round(0) }}
        availability: >-
          {{ fc is defined
             and fc['weather.forecast_home'] is defined
             and fc['weather.forecast_home'].forecast | count > 0 }}

  # ---------------------------------------------------------------------------
  # TODAY, FOR THE KIDS' CLOCKS -- condition + high + low, one sensor each
  # ---------------------------------------------------------------------------
  # The clocks draw a sun / cloud / rain symbol with the day's HIGH beside it
  # and the low underneath (mini-round-clock-with-display.yaml, the weather
  # widget). Three sensors rather than attributes because ESPHome imports a
  # sensor STATE natively and a text_sensor state as a string; nothing has to
  # be parsed on the device.
  #
  # SOURCE. weather.home is the built-in Open-Meteo integration set up on
  # zone.home 2026-09-16: no key, hourly refresh, and for Australia it blends
  # the Bureau's own ACCESS model with ECMWF. weather.forecast_home (met.no)
  # is the fallback when Open-Meteo has nothing. The Bureau of Meteorology
  # HACS integration (bremor/bureau_of_meteorology) would be the official
  # feed if it is ever installed: add it to `sources` first and nothing else
  # changes.
  #
  # "TODAY" is matched by LOCAL date, not taken as forecast[0]: Open-Meteo's
  # daily list starts at 00:00 UTC, which at 07:00 in Melbourne is still
  # yesterday's entry.
  - trigger:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: state
        entity_id: [weather.home, weather.forecast_home]
      - trigger: homeassistant
        event: start
    action:
      - action: weather.get_forecasts
        target:
          entity_id: [weather.home, weather.forecast_home]
        data:
          type: daily
        response_variable: fcs
      - variables:
          today: >-
            {% set ns = namespace(hit=none) %}
            {% set d = now().date() %}
            {% for src in ['weather.home', 'weather.forecast_home'] %}
              {% for f in (fcs[src].forecast if src in fcs else []) %}
                {% if ns.hit is none and as_local(as_datetime(f.datetime)).date() == d %}
                  {% set ns.hit = dict(f, source=src) %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {{ ns.hit }}
    sensor:
      - name: "Wall clock weather high"
        unique_id: wall_clock_weather_high
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:thermometer-chevron-up
        state: "{{ today.temperature | round(0) | int if today and today.temperature is not none else 'unknown' }}"
        attributes:
          source: "{{ today.source if today else '' }}"
          date: "{{ as_local(as_datetime(today.datetime)).date() if today else '' }}"
      - name: "Wall clock weather low"
        unique_id: wall_clock_weather_low
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:thermometer-chevron-down
        state: "{{ today.templow | round(0) | int if today and today.templow is not none else 'unknown' }}"
        attributes:
          source: "{{ today.source if today else '' }}"
      # The Home Assistant condition slug for the day: sunny, clear-night,
      # partlycloudy, cloudy, rainy, pouring, lightning, lightning-rainy,
      # snowy, snowy-rainy, hail, fog, windy, windy-variant, exceptional.
      # The clock maps these onto its drawn symbols; anything else draws a
      # cloud.
      - name: "Wall clock weather today"
        unique_id: wall_clock_weather_today
        icon: mdi:weather-partly-cloudy
        state: "{{ today.condition if today and today.condition else states('weather.home') }}"
        attributes:
          high: "{{ today.temperature if today else none }}"
          low: "{{ today.templow if today else none }}"
          rain_chance: "{{ today.precipitation_probability if today else none }}"
          rain_mm: "{{ today.precipitation if today else none }}"
          source: "{{ today.source if today else '' }}"
          fetched: "{{ now().isoformat(timespec='seconds') }}"
