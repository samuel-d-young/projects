              {% set d = w.days | default('everyday') %}
              {% set dayok = d == 'everyday' or (d == 'weekdays' and not weekend) or (d == 'weekends' and weekend) %}
              {% set a = (w.start | default('00:00')).split(':') %}
              {% set b = (w.end | default('00:00')).split(':') %}
              {% set ss = a[0] | int(0) * 3600 + a[1] | int(0) * 60 %}
              {% set es = b[0] | int(0) * 3600 + b[1] | int(0) * 60 %}
              {% set inside = (ss <= secs and secs < es) if ss < es else (secs >= ss or secs < es) %}
              {% if ns.hit is none and dayok and inside %}
                {% set ns.hit = dict(w, start_s=ss, end_s=es) %}
              {% endif %}
            {% endfor %}
            {{ ns.hit }}
