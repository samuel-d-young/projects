# =============================================================================
# wall_clock.yaml — ambient status for the LED ring wall clock
# =============================================================================
# Install to /config/packages/wall_clock.yaml (picked up by the existing
#   homeassistant:
#     packages: !include_dir_named packages
#
# ---------------------------------------------------------------------------
# THE TIMER SUBSYSTEM LIVES IN wall_clock_timers.yaml
# ---------------------------------------------------------------------------
# Timers, the eight Assist intent overrides and the alert flag moved out of
# this file when multi-timer support landed. Both files must be installed. HA
# merges packages per domain, so the `template:` blocks here and there combine.
#
# This file is now only the AMBIENT STATUS half: the wall_clock_* binary
# sensors the ring uses for its idle colour hints.
#
# ---------------------------------------------------------------------------
# FIRST INSTALL NEEDS A FULL RESTART. AFTER THAT, RELOAD IS ENOUGH.
# ---------------------------------------------------------------------------
# `homeassistant.reload_all` only calls `reload` on domains that are ALREADY
# set up — it cannot bootstrap a new one. Between them these two files
# introduce `timer:`, `intent_script:` and `input_text:`, none of which is part
# of default_config. So:
#
#     FIRST TIME:   ha core check   &&   ha core restart
#     EVERY EDIT AFTER:   Developer Tools > Actions > homeassistant.reload_all
#
# Editing custom_templates/wall_clock_timer_match.jinja additionally needs
# homeassistant.reload_custom_templates — reload_all does NOT pick it up.
#
# ---------------------------------------------------------------------------
# ENTITY IDS: RESOLVED AGAINST THE REAL SYSTEM 2026-08-23
# ---------------------------------------------------------------------------
# The values below are no longer guesses. They were read from the live
# entity registry, and four of the original assumptions turned out wrong:
#
#   * sensor.next_bin's `next_bin_night` is a DISPLAY STRING ("Mon 25 Aug"),
#     not a date or datetime. The original `as_datetime` version silently
#     returned false forever.
#   * There is no cover.* entity of any kind on this system, so the garage
#     sensor is pinned false rather than referencing a non-existent entity.
#   * Frigate's per-camera face sensor was the wrong approach here; there is a
#     purpose-built sensor.unknown_person_last_seen already doing the job.
#   * Only one person entity exists (person.vultron).
#
# To re-derive these on another system, paste into Developer Tools > Template:
#
#   {{ states.sensor | selectattr('entity_id','search','bin')
#      | map(attribute='entity_id') | list }}
#   {{ states.cover | map(attribute='entity_id') | list }}
#   {{ states.person | map(attribute='entity_id') | list }}
#   {{ states.assist_satellite | map(attribute='entity_id') | list }}
# =============================================================================


# -----------------------------------------------------------------------------
# THE CONTRACT WITH THE ESP32
# -----------------------------------------------------------------------------
# Everything the firmware subscribes to is named wall_clock_*. The firmware
# knows nothing about Frigate, area ids, or how many timers exist — change any
# of that here and the ESP32 needs no reflash. That indirection is the whole
# point of this file.
template:

  - binary_sensor:

      # ---- Bin night ----
      # RESOLVED 2026-08-23. `next_bin_night` is a display string formatted
      # like "Mon 25 Aug" — NOT a date, and NOT a weekday name. It is compared
      # against today's and tomorrow's date rendered the same way.
      #
      # '%-d' is the no-leading-zero day, which is glibc/musl specific. It is
      # correct on HA OS. On a platform where it is not, use '%d' and strip the
      # zero, or this silently never matches.
      - name: "Wall clock bin night"
        unique_id: wall_clock_bin_night
        state: >-
          {% set n = state_attr('sensor.next_bin', 'next_bin_night') %}
          {% set fmt = '%a %-d %b' %}
          {{ n is not none
             and (n == now().strftime(fmt)
                  or n == (now() + timedelta(days=1)).strftime(fmt)) }}

      # ---- Garage ----
      # PINNED FALSE. There is no cover.* entity on this system — checked the
      # whole domain, it is empty. Left in place rather than deleted so the
      # firmware's wall_clock_garage_open import stays valid and the ring hint
      # can be switched on later by editing only this line.
      - name: "Wall clock garage open"
        unique_id: wall_clock_garage_open
        state: "false"

      # ---- Unrecognised person on the driveway ----
      # RESOLVED 2026-08-23. This system already has a purpose-built
      # sensor.unknown_person_last_seen holding a timestamp, which is far more
      # reliable than inferring from Frigate's face sensor.
      #
      # The original approach had to work around two real Frigate 0.17 traps: a
      # null face name renders as the literal string "None", indistinguishable
      # from the 60-second timeout value; and `sub_label` is a two-element
      # ARRAY [name, score], not a string. Using the dedicated sensor sidesteps
      # both.
      #
      # 300s window: long enough to still be lit when you look up, short enough
      # not to nag.
      - name: "Wall clock driveway unknown"
        unique_id: wall_clock_driveway_unknown
        state: >-
          {% set t = states('sensor.unknown_person_last_seen') | as_datetime %}
          {{ t is not none and (now() - t).total_seconds() < 300 }}

      # ---- Who's home ----
      # RESOLVED 2026-08-23: person.vultron is the ONLY person entity on this
      # system. The other three are pinned false rather than removed, because
      # the firmware imports all four by name — deleting them here would leave
      # three imports permanently unavailable and need a reflash to tidy.
      # Add real person entities here as they appear; no firmware change.
      #
      # Deliberately NOT `states.person | selectattr(...)`: iterating a whole
      # domain trips HA's 1-update-per-second rate limit, whereas naming
      # entities does not.
      - name: "Wall clock home sam"
        unique_id: wall_clock_home_sam
        state: "{{ is_state('person.vultron', 'home') }}"
      - name: "Wall clock home laura"
        unique_id: wall_clock_home_laura
        state: "false"
      - name: "Wall clock home amanda"
        unique_id: wall_clock_home_amanda
        state: "false"
      - name: "Wall clock home zac"
        unique_id: wall_clock_home_zac
        state: "false"
