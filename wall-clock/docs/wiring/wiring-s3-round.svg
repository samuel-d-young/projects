<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1270" viewBox="0 0 1700 1270"><rect width="1700" height="1270" fill="#faf7f0"/><text x="50" y="52" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="26" fill="#1b1b1b" text-anchor="start" font-weight="bold">Mini Round Clock — ESP32-S3-N16R8 + 24-LED ring (92/71mm) + GC9B72 360x360</text><text x="50" y="80" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#6b6b6b" text-anchor="start" font-weight="normal">Red = +5V   Orange = +3V3   Black = GND   Yellow = LED data   Blue = display SPI (4-wire, NOT quad)</text><polyline points="120,150 1580,150" fill="none" stroke="#d6453d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="120,208 1080,208" fill="none" stroke="#e07a2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="120,820 1580,820" fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="136" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#d6453d" text-anchor="start" font-weight="bold">+5V rail</text><text x="1094" y="213" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#e07a2b" text-anchor="start" font-weight="normal">+3V3 rail  (display only — the ring is the sole 5V load)</text><text x="760" y="804" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold">GND rail  —  common ground is mandatory</text><rect x="60" y="360" width="200" height="170" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/><text x="160" y="396" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold">5V supply</text><text x="160" y="422" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#6b6b6b" text-anchor="middle" font-weight="normal">2A minimum</text><polyline points="160,360 160,150" fill="none" stroke="#d6453d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="150" r="5" fill="#d6453d"/><polyline points="160,530 160,820" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="820" r="5" fill="#2b2b2b"/><rect x="360" y="300" width="300" height="430" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/><text x="510" y="338" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold">ESP32-S3-N16R8</text><text x="510" y="362" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="normal">16MB flash / 8MB octal PSRAM</text><text x="510" y="384" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#3d9a5c" text-anchor="middle" font-weight="bold">PSRAM is mandatory here</text><text x="374" y="429" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">5V</text><polyline points="360,424 330,424" fill="none" stroke="#d6453d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="374" y="467" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">3V3</text><polyline points="360,462 330,462" fill="none" stroke="#e07a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="374" y="505" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">GND</text><polyline points="360,500 330,500" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="374" y="705" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">GPIO5  LED data</text><polyline points="360,700 330,700" fill="none" stroke="#e0a92b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="330,424 330,150" fill="none" stroke="#d6453d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="150" r="5" fill="#d6453d"/><polyline points="330,462 300,462 300,208" fill="none" stroke="#e07a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="208" r="5" fill="#e07a2b"/><polyline points="330,500 272,500 272,820" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="272" cy="820" r="5" fill="#2b2b2b"/><text x="646" y="425" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="end" font-weight="normal">GPIO12   SCL  (clk)</text><polyline points="660,420 790,420" fill="none" stroke="#3d78d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="646" y="460" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="end" font-weight="normal">GPIO11   SDA  (mosi)</text><polyline points="660,455 790,455" fill="none" stroke="#3d78d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="646" y="495" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="end" font-weight="normal">GPIO10   CS</text><polyline points="660,490 790,490" fill="none" stroke="#3d78d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="646" y="530" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="end" font-weight="normal">GPIO13   DC</text><polyline points="660,525 790,525" fill="none" stroke="#3d78d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="646" y="565" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="end" font-weight="normal">GPIO14   RST</text><polyline points="660,560 790,560" fill="none" stroke="#3d78d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="646" y="600" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="end" font-weight="normal">GPIO21   BL</text><polyline points="660,595 790,595" fill="none" stroke="#3d78d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="300" width="310" height="360" rx="8" fill="#ffffff" stroke="#3d78d6" stroke-width="2.5"/><rect x="784" y="413" width="12" height="14" fill="#3d78d6"/><rect x="784" y="448" width="12" height="14" fill="#3d78d6"/><rect x="784" y="483" width="12" height="14" fill="#3d78d6"/><rect x="784" y="518" width="12" height="14" fill="#3d78d6"/><rect x="784" y="553" width="12" height="14" fill="#3d78d6"/><rect x="784" y="588" width="12" height="14" fill="#3d78d6"/><circle cx="960" cy="452" r="96" fill="#faf7f0" stroke="#3d78d6" stroke-width="2"/><circle cx="960" cy="452" r="84" fill="#eef3fb" stroke="#3d78d6" stroke-width="1"/><text x="960" y="446" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold">360 x 360</text><text x="960" y="470" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="normal">GC9B72  4-wire SPI</text><text x="945" y="604" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold">1.85" round LCD</text><text x="945" y="626" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal">ESPHome: model CUSTOM + init_sequence</text><polyline points="840,300 840,208" fill="none" stroke="#e07a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="840" cy="208" r="4" fill="#e07a2b"/><text x="852" y="292" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" fill="#e07a2b" text-anchor="start" font-weight="normal">3V3</text><polyline points="790,640 730,640 730,820" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="730" cy="820" r="4" fill="#2b2b2b"/><text x="742" y="632" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal">GND</text><circle cx="1340" cy="452" r="118" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/><circle cx="1340" cy="452" r="84" fill="#faf7f0" stroke="#1b1b1b" stroke-width="2"/><circle cx="1340.0" cy="351.0" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1366.1407235553545" cy="354.4414915448041" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1390.5" cy="364.5314342177717" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1411.4177848998413" cy="380.5822151001587" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1427.4685657822283" cy="401.5" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1437.5585084551958" cy="425.8592764446454" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1441.0" cy="452.0" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1437.5585084551958" cy="478.1407235553546" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1427.4685657822283" cy="502.5" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1411.4177848998413" cy="523.4177848998413" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1390.5" cy="539.4685657822283" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1366.1407235553547" cy="549.5585084551959" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1340.0" cy="553.0" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1313.8592764446455" cy="549.5585084551959" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1289.5" cy="539.4685657822283" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1268.5822151001587" cy="523.4177848998413" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1252.5314342177717" cy="502.50000000000006" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1242.4414915448042" cy="478.14072355535455" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1239.0" cy="452.0" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1242.4414915448042" cy="425.85927644464545" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1252.5314342177717" cy="401.5" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1268.5822151001587" cy="380.5822151001587" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1289.5" cy="364.53143421777173" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1313.8592764446453" cy="354.44149154480414" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><text x="1340" y="446" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold">LED ring</text><text x="1340" y="467" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="normal">24 x WS2812B</text><polyline points="1237.8090023534362,393.0 1201.43593539449,372.0" fill="none" stroke="#d6453d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1187.43593539449" y="377.0" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#d6453d" text-anchor="end" font-weight="bold">VCC</text><polyline points="1201.43593539449,372.0 1200,372.0 1200,150" fill="none" stroke="#d6453d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1200" cy="150" r="5" fill="#d6453d"/><polyline points="1442.1909976465638,393.0 1478.56406460551,372.0" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1492.56406460551" y="377.0" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="bold">GND</text><polyline points="1478.56406460551,372.0 1500,372.0 1500,820" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1500" cy="820" r="5" fill="#2b2b2b"/><polyline points="1340.0,570.0 1340.0,612.0" fill="none" stroke="#e0a92b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1356.0" y="617.0" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#e0a92b" text-anchor="start" font-weight="bold">DIN</text><polyline points="330,700 300,700 300,960 1180,960" fill="none" stroke="#e0a92b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1207.0,960 1210.8333333333333,971 1218.5,949 1226.1666666666667,971 1233.8333333333333,949 1241.5,971 1249.1666666666667,949 1253.0,960" fill="none" stroke="#e0a92b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1230" y="938" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold">470 ohm</text><polyline points="1276,960 1340,960 1340,612.0" fill="none" stroke="#e0a92b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1560,150 1560,476.0" fill="none" stroke="#d6453d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1560,494.0 1560,820" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="1538" y1="476.0" x2="1582" y2="476.0" stroke="#1b1b1b" stroke-width="3"/><line x1="1538" y1="494.0" x2="1582" y2="494.0" stroke="#1b1b1b" stroke-width="3"/><text x="1590" y="483.0" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold">1000uF</text><text x="1590" y="502.0" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="normal">+ to 5V</text><rect x="50" y="1030" width="1600" height="169" rx="10" fill="#f2ecdf" stroke="#d8cdb4" stroke-width="2"/><text x="68" y="1058" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold">Before you power it</text><text x="68" y="1084" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">1.  Panel is a GC9B72 on 4-wire SPI — SDA/SCL/SDO, NOT quad. ESPHome ships no GC9B72 model, so it needs model: CUSTOM + an init_sequence.</text><text x="68" y="1109" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">2.  The panel is a 3.3V device — do NOT feed it 5V. The LED ring is the only 5V load here.</text><text x="68" y="1134" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">3.  Ground first on, last off. Power the ring before the S3. Never USB and the external supply at the same time.</text><text x="68" y="1159" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">4.  470 ohm at the RING end of the data wire. Add a 74AHCT125 if you see flicker or a wrong first pixel.</text><text x="68" y="1184" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">5.  Desolder BOTH 10-pin headers (display tab) and the ring's 4-pin header, and solder wires flat. That is what lets the screen sit flush.</text></svg>