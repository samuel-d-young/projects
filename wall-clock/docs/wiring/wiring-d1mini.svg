<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1130" viewBox="0 0 1580 1130"><rect width="1580" height="1130" fill="#faf7f0"/><text x="50" y="52" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="26" fill="#1b1b1b" text-anchor="start" font-weight="bold">Test clock — Wemos D1 mini (ESP8266) + 24-LED WS2812B ring</text><text x="50" y="80" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#6b6b6b" text-anchor="start" font-weight="normal">Red = +5V   Black = GND   Yellow = LED data.  Ground connects FIRST and disconnects LAST.</text><polyline points="120,150 1440,150" fill="none" stroke="#d6453d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="120,690 1440,690" fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="136" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#d6453d" text-anchor="start" font-weight="bold">+5V rail</text><text x="880" y="674" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold">GND rail  —  common ground is mandatory</text><rect x="60" y="300" width="210" height="190" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/><text x="165" y="335" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold">5V supply</text><text x="165" y="362" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#6b6b6b" text-anchor="middle" font-weight="normal">2A minimum</text><text x="165" y="392" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="normal">or USB — but then</text><text x="165" y="411" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="normal">cap brightness (note 4)</text><polyline points="165,300 165,150" fill="none" stroke="#d6453d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="165,490 165,690" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="165" cy="150" r="5" fill="#d6453d"/><circle cx="165" cy="690" r="5" fill="#2b2b2b"/><rect x="400" y="285" width="250" height="220" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/><text x="525" y="322" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold">Wemos D1 mini</text><text x="525" y="346" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#6b6b6b" text-anchor="middle" font-weight="normal">ESP8266</text><text x="414" y="397" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">5V</text><polyline points="400,392 370,392" fill="none" stroke="#d6453d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="414" y="437" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">G</text><polyline points="400,432 370,432" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="414" y="477" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">D2 / GPIO4</text><polyline points="400,472 370,472" fill="none" stroke="#e0a92b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="370,392 370,150" fill="none" stroke="#d6453d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="370" cy="150" r="5" fill="#d6453d"/><polyline points="370,432 330,432 330,690" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="690" r="5" fill="#2b2b2b"/><polyline points="370,472 300,472 300,800" fill="none" stroke="#e0a92b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="300,800 700,800" fill="none" stroke="#e0a92b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="700" y="745" width="220" height="110" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/><text x="810" y="780" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold">74AHCT125</text><text x="810" y="803" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="normal">3.3V -&gt; 5V level shift</text><text x="810" y="828" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" fill="#3d9a5c" text-anchor="middle" font-weight="normal">recommended, note 3</text><polyline points="920,800 1010,800" fill="none" stroke="#e0a92b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1032.0,800 1035.8333333333333,811 1043.5,789 1051.1666666666667,811 1058.8333333333333,789 1066.5,811 1074.1666666666667,789 1078.0,800" fill="none" stroke="#e0a92b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1055" y="778" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold">470 ohm</text><polyline points="1100,800 1150,800 1150,570" fill="none" stroke="#e0a92b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="700,763 660,763 660,150" fill="none" stroke="#d6453d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="660" cy="150" r="4" fill="#d6453d"/><polyline points="700,840 620,840 620,690" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="620" cy="690" r="4" fill="#2b2b2b"/><circle cx="1150" cy="400" r="128" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/><circle cx="1150" cy="400" r="94" fill="#faf7f0" stroke="#1b1b1b" stroke-width="2"/><circle cx="1150.0" cy="289.0" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1178.72891400638" cy="292.7822332819134" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1205.5" cy="303.8711801799273" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1228.4888527117068" cy="321.5111472882932" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1246.1288198200727" cy="344.5" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1257.2177667180865" cy="371.2710859936202" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1261.0" cy="400.0" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1257.2177667180865" cy="428.7289140063798" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1246.1288198200727" cy="455.5" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1228.4888527117068" cy="478.4888527117068" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1205.5" cy="496.1288198200727" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1178.72891400638" cy="507.2177667180866" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1150.0" cy="511.0" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1121.27108599362" cy="507.2177667180866" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1094.5" cy="496.1288198200727" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1071.5111472882932" cy="478.48885271170684" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1053.8711801799273" cy="455.50000000000006" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1042.7822332819135" cy="428.7289140063798" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1039.0" cy="400.0" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1042.7822332819135" cy="371.27108599362026" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1053.8711801799273" cy="344.5" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1071.5111472882932" cy="321.5111472882932" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1094.5" cy="303.87118017992736" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="1121.27108599362" cy="292.7822332819135" r="6.5" fill="#f2e9d8" stroke="#6b6b6b" stroke-width="1.5"/><text x="1150" y="394" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold">LED ring</text><text x="1150" y="415" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="normal">24 x WS2812B</text><polyline points="1045.1485383310091,326.5822161470661 1010.7441524708714,302.49200582032216" fill="none" stroke="#d6453d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="996.7441524708714" y="307.49200582032216" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#d6453d" text-anchor="end" font-weight="bold">VCC</text><polyline points="1010.7441524708714,302.49200582032216 985,302.49200582032216 985,150" fill="none" stroke="#d6453d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="985" cy="150" r="5" fill="#d6453d"/><polyline points="1254.8514616689909,326.5822161470661 1289.2558475291287,302.49200582032216" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1303.2558475291287" y="307.49200582032216" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="bold">GND</text><polyline points="1289.2558475291287,302.49200582032216 1330,302.49200582032216 1330,690" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1330" cy="690" r="5" fill="#2b2b2b"/><polyline points="1150.0,528.0 1150.0,570.0" fill="none" stroke="#e0a92b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1166.0" y="575.0" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#e0a92b" text-anchor="start" font-weight="bold">DIN</text><polyline points="1420,150 1420,411.0" fill="none" stroke="#d6453d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1420,429.0 1420,690" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="1398" y1="411.0" x2="1442" y2="411.0" stroke="#1b1b1b" stroke-width="3"/><line x1="1398" y1="429.0" x2="1442" y2="429.0" stroke="#1b1b1b" stroke-width="3"/><text x="1450" y="418.0" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold">1000uF</text><text x="1450" y="437.0" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="normal">+ to 5V</text><rect x="50" y="900" width="1480" height="169" rx="10" fill="#f2ecdf" stroke="#d8cdb4" stroke-width="2"/><text x="68" y="928" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold">Before you power it</text><text x="68" y="954" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">1.  Ground first on, last off. The DIN threshold is referenced to the ring's ground — no shared return, no defined logic level.</text><text x="68" y="979" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">2.  Power the ring BEFORE the D1 mini. Otherwise it back-powers parasitically through the data pin and can damage the MCU.</text><text x="68" y="1004" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">3.  The 470 ohm resistor goes at the RING end of the wire, not the D1 mini end. If you fit the 74AHCT125, put the resistor on its output.</text><text x="68" y="1029" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">4.  24 LEDs at full white is ~1.44A — more than a PC USB port gives. On USB, keep Brightness at or below 30% (the config defaults to 30).</text><text x="68" y="1054" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">5.  Never USB and an external supply at the same time. Flash over USB with the supply unplugged, then use OTA.</text></svg>