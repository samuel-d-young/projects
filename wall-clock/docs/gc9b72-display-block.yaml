# =============================================================================
# GC9B72 display block — DROP-IN CANDIDATE, NOT VERIFIED
# =============================================================================
# Paste this over the commented-out display section in mini-round-clock.yaml,
# uncomment it, and run `esphome config` before flashing.
#
# WHERE THIS INIT SEQUENCE CAME FROM, AND WHY IT MIGHT NOT WORK
#
# It is Espressif's init table for the **GC9B71**, from
#   esp-iot-solution/components/display/lcd/esp_lcd_gc9b71/esp_lcd_gc9b71.c
# not the GC9B72. What makes it a serious candidate rather than a guess:
#
#   * The GC9B71 datasheet (dl.espressif.com/AE/esp-iot-solution/
#     GC9B71_DataSheet_V1.0.pdf) states "360 RGB x 360 Resolution" — the same
#     panel geometry as yours, from the same Galaxycore family.
#   * Same interface options: SPI and QSPI.
#   * It opens with 0xFE / 0xEF, the Galaxycore inter-command unlock pair, so
#     the register map is the same dialect.
#
# What it is NOT: a datasheet-confirmed GC9B72 sequence. No GC9B72 datasheet is
# published on Espressif's CDN (checked — 404) and no GC9B72 driver exists in
# ESPHome, esp-iot-solution, LovyanGFX or Arduino_GFX.
#
# TRY IT. If the panel comes up correct, you are done. If it comes up blank,
# garbled, colour-shifted or mirrored, do NOT tune these values by hand —
# get the vendor demo code for THIS module from the seller (Baishun /
# Baishundianzi, 2.1" 360x360) and send it to me. Ten minutes of asking beats
# an evening of poking registers.
#
# Two commands were deliberately dropped: 0x11 (SLPOUT) and 0x29 (DISPON).
# ESPHome's mipi_spi appends both itself, along with the reset pulse.
# =============================================================================

spi:
  - id: lcd_bus
    clk_pin: ${lcd_clk}       # SCL
    mosi_pin: ${lcd_mosi}     # SDA

display:
  - platform: mipi_spi
    model: CUSTOM
    id: face_lcd
    spi_id: lcd_bus
    cs_pin: ${lcd_cs}
    dc_pin: ${lcd_dc}
    reset_pin: ${lcd_reset}
    dimensions:
      width: 360
      height: 360
    data_rate: 40MHz          # 10MHz is the default and far too slow at 360x360
    invert_colors: false      # flip if the image looks like a photo negative
    update_interval: 1s
    init_sequence:
      - [0xFE]
      - [0xEF]
      - [0x80, 0x11]
      - [0x81, 0x70]
      - [0x82, 0x09]
      - [0x83, 0x03]
      - [0x84, 0x62]
      - [0x89, 0x18]
      - [0x8A, 0x40]
      - [0x8B, 0x0A]
      - [0xEC, 0x07]
      - [0x74, 0x01, 0x80, 0x00, 0x00, 0x00, 0x00]
      - [0x98, 0x3E]
      - [0x99, 0x3E]
      - [0xA1, 0x01, 0x04]
      - [0xA2, 0x01, 0x04]
      - [0xCB, 0x02]
      - [0x7C, 0xB6, 0x24]
      - [0xAC, 0x74]
      - [0xF6, 0x80]
      - [0xB5, 0x09, 0x09]
      - [0xEB, 0x01, 0x81]
      - [0x60, 0x38, 0x06, 0x13, 0x56]
      - [0x63, 0x38, 0x08, 0x13, 0x56]
      - [0x61, 0x3B, 0x1B, 0x58, 0x38]
      - [0x62, 0x3B, 0x1B, 0x58, 0x38]
      - [0x64, 0x38, 0x0A, 0x73, 0x16, 0x13, 0x56]
      - [0x66, 0x38, 0x0B, 0x73, 0x17, 0x13, 0x56]
      - [0x68, 0x00, 0x0B, 0x22, 0x0B, 0x22, 0x1C, 0x1C]
      - [0x69, 0x00, 0x0B, 0x26, 0x0B, 0x26, 0x1C, 0x1C]
      - [0x6A, 0x15, 0x00]
      - [0x6E, 0x08, 0x02, 0x1A, 0x00, 0x12, 0x12, 0x11, 0x11, 0x14, 0x14, 0x13, 0x13, 0x04, 0x19, 0x1E, 0x1D, 0x1D, 0x1E, 0x19, 0x04, 0x0B, 0x0B, 0x0C, 0x0C, 0x09, 0x09, 0x0A, 0x0A, 0x00, 0x1A, 0x01, 0x07]
      - [0x6C, 0xCC, 0x0C, 0xCC, 0x84, 0xCC, 0x04, 0x50]
      - [0x7D, 0x72]
      - [0x70, 0x02, 0x03, 0x09, 0x07, 0x09, 0x03, 0x09, 0x07, 0x09, 0x03]
      - [0x90, 0x06, 0x06, 0x05, 0x06]
      - [0x93, 0x45, 0xFF, 0x00]
      - [0xC3, 0x15]
      - [0xC4, 0x36]
      - [0xC9, 0x3D]
      - [0xF0, 0x47, 0x07, 0x0A, 0x0A, 0x00, 0x29]
      - [0xF2, 0x47, 0x07, 0x0A, 0x0A, 0x00, 0x29]
      - [0xF1, 0x42, 0x91, 0x10, 0x2D, 0x2F, 0x6F]
      - [0xF3, 0x42, 0x91, 0x10, 0x2D, 0x2F, 0x6F]
      - [0xF9, 0x30]
      - [0xBE, 0x11]
      - [0xFB, 0x00, 0x00]
      # (0x11 SLPOUT dropped — mipi_spi appends it, with its delay)
